/* ---------- game log sparkline ---------- */
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin:6px 0 10px}
.spark i{flex:1 1 0;background:color-mix(in srgb,var(--team) 55%,transparent);
  border-radius:1px 1px 0 0;min-height:2px}
.spark i.best{background:#5FBF8A}
.sparklab{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* ---------- team compare button ---------- */
#tcmpbtn{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:5px 10px;border-radius:var(--r);
}
#tcmpbtn:hover{color:var(--chalk);border-color:var(--team)}
.tcmp-pick{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:520px;margin:0 auto;
}
.tcmp-pick button{
  padding:8px 4px;border:1px solid var(--line);border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.08em;color:var(--mute);
}
.tcmp-pick button:hover{border-color:var(--team);color:var(--chalk)}

.advt{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:9px 0 8px;margin-top:18px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.13em;color:var(--mute);
  transition:color .15s;
}
.advt:hover{color:var(--chalk)}
.advt .chev{
  display:inline-block;font-size:11px;color:var(--dim);
  transition:transform .18s;transform:rotate(0deg);
}
.advt[aria-expanded="true"]{color:var(--chalk)}
.advt[aria-expanded="true"] .chev{transform:rotate(90deg);color:var(--team)}
.advb{padding-top:4px}
.advb[hidden]{display:none}
.advsub{
  font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin:12px 0 5px;
}
.snap{display:flex;align-items:center;gap:10px;padding:6px 0}
.snap .l{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.snap .v{font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff}
.bar{height:4px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--team);border-radius:2px}

#foot{flex:0 0 auto;padding:7px 20px 9px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--dim);font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- responsive ---------- */
/* The offensive line needs roughly 68px per man. Once the side panel squeezes
   the field below ~860px that stops fitting, so drop the panel underneath and
   give the field the full window. */
@media (max-width:1250px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #split{flex-direction:column}
  #field{min-height:0;aspect-ratio:16/11}
  #detail{flex:1 1 auto;border-left:0;border-top:1px solid var(--line);max-height:none}
}
/* Below ~920px even the full window is too narrow for five linemen at true
   spacing. Rather than distort the formation, hold the field at a minimum width
   and let it pan sideways. */
@media (max-width:920px){
  .dgroup{padding:6px 9px 7px;gap:4px}
  .dlabel{font-size:10px;letter-spacing:.13em}
  .tbtn{width:32px;height:32px;padding:3px}
  #fieldwrap{padding:12px 0 10px;overflow-x:auto}
  #fieldbar{padding:0 14px}
  #field{aspect-ratio:4/3.6;min-width:700px}
  .chip{width:48px;gap:4px}
  .disc{width:44px;height:44px}
  .face .fallback{font-size:15px}
  .jersey{min-width:20px;height:20px;font-size:11px;right:-5px;bottom:-3px}
  .t100{width:18px;height:18px;font-size:8.5px;left:-5px;top:-3px}
  .pname{font-size:11px;width:80px}
  .slotlab{font-size:10.5px}
  .stack{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const DATA = /*__DATA__*/;

/* ---------------- formation coordinates ----------------
   Keyed by pos_grp then pos_slot, matching nflverse's own slot numbering.
   x/y are percentages of the field box.

   Rows sit ~22% apart vertically because a chip's ink runs from 28px above its
   point to 75px below it (disc, then name, then the "+N" depth count). Anything
   closer and the labels of one row land on the discs of the next -- which is
   what put the quarterback on top of the center. Run check_layout.py after
   editing these; it models the real rectangle and will catch it. */
const FORMS = {
  "3WR 1TE": { los:20, label:"11 personnel \u00b7 3 WR, 1 TE, 1 RB", coords:{
    1:[8,26],   2:[20,34],  3:[34,26], 4:[42,26], 5:[50,26], 6:[58,26],
    7:[66,26],  8:[92,26],  9:[50,48], 10:[76,26], 11:[40,70], 12:[60,70] }},
  "Base 4-3 D": { los:20, label:"Base 4\u20133 \u00b7 four down, three linebackers", coords:{
    1:[30,26],  2:[43,26],  3:[57,26], 4:[70,26], 5:[31,48], 6:[50,48],
    7:[69,48],  8:[7,28],   9:[38,76], 10:[62,76], 11:[93,28], 12:[17,52] }},
  "Base 3-4 D": { los:20, label:"Base 3\u20134 \u00b7 three down, four linebackers", coords:{
    1:[36,26],  2:[50,26],  3:[64,26], 4:[22,30], 5:[43,50], 6:[57,50],
    7:[78,30],  8:[7,28],   9:[38,76], 10:[62,76], 11:[93,28], 12:[17,54] }},
  "Special Teams": { los:null, label:"Kicking and return units", coords:{
    1:[25,26],  2:[50,26],  3:[75,26], 6:[25,70], 4:[50,70], 5:[75,70] }}
};
const UNITS = [
  {key:"off", label:"Offense", grps:["3WR 1TE"]},
  {key:"def", label:"Defense", grps:["Base 4-3 D","Base 3-4 D"]},
  {key:"st",  label:"Teams",   grps:["Special Teams"]}
];

// Position -> stat bucket, exported by the pipeline so the two sides cannot
// drift apart.
const POSBUCKET = DATA.posBucket || {};

/* ---------------- state ---------------- */
let team = "PHI", unit = "off", sel = null, t100only = false, advOpen = false;
let catchUpYear = 2021;
const sub = {};   // "grp|slot" -> chosen depth rank, lets you swap a backup in

const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
/* Headshots live on NFL.com's Cloudinary, which serves whatever the URL asks
   for. The stored base asks for "f_auto,q_auto" and no dimensions, so it returns
   a full-resolution portrait for a circle drawn at 44px. Adding a width to the
   transform is the single biggest speed win available here.

   Sizes snap to four buckets rather than the exact pixel size of each use. Every
   distinct URL is a separate CDN cache entry, so a handful of shared sizes beats
   a bespoke one per element. g_face centres the crop on the face, which also
   makes the small circles read better. */
const IMG_BUCKETS = [96, 128, 192, 320];
const imgBucket = want => IMG_BUCKETS.find(b => b >= want) || 320;

function imgUrl(p, want){
  if(!p || !p.im) return null;
  if(p.im[0] === "@") return p.im.slice(1);        // foreign host, leave alone
  const id = p.im[0] === "!" ? p.im.slice(1) : p.im;
  const base = p.im[0] === "!" ? DATA.imgAlt : DATA.imgBase;
  const tx = "f_auto,q_auto,c_fill,g_face,w_" + imgBucket(want || 128);
  return base.replace("f_auto,q_auto", tx) + id;
}

/* Every <img> in the app goes through here, so the loading hints are applied in
   one place rather than sixteen. */
function faceImg(p, want, opts){
  const url = imgUrl(p, want);
  if(!url) return null;
  const im = new Image();
  im.src = url;
  im.alt = (opts && opts.alt) || "";
  im.decoding = "async";
  // Anything in a long scrolling list waits until it is near the viewport.
  if(opts && opts.lazy) im.loading = "lazy";
  if(opts && opts.onerror) im.onerror = opts.onerror;
  return im;
}

/* Warm the cache for the team being viewed, so switching to the field or the
   face wall does not start from nothing. */
let preloaded = new Set();
function preloadTeam(tm, want){
  const key = tm + "|" + imgBucket(want);
  if(preloaded.has(key)) return;
  preloaded.add(key);
  const seen = new Set();
  (DATA.depth[tm] || []).forEach(r=>{
    if(seen.has(r.pid)) return;
    seen.add(r.pid);
    const p = DATA.players[r.pid];
    if(p && p.im){ const i = new Image(); i.decoding = "async"; i.src = imgUrl(p, want); }
  });
}

/* ---------------- field markings ---------------- */
function drawTurf(){
  const los = FORMS[activeGrp()]?.los;
  const p = [];
  // yard lines every 10% of height, heavier every other
  for(let i=1;i<10;i++){
    const y = i*70;
    p.push(`<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="#DDE6E1" stroke-opacity="${i%2?0.13:0.2}" stroke-width="1.5"/>`);
  }
  // hash marks
  for(let i=1;i<28;i++){
    const y = i*25;
    p.push(`<line x1="352" y1="${y}" x2="368" y2="${y}" stroke="#DDE6E1" stroke-opacity=".16" stroke-width="1.5"/>`);
    p.push(`<line x1="632" y1="${y}" x2="648" y2="${y}" stroke="#DDE6E1" stroke-opacity=".16" stroke-width="1.5"/>`);
  }
  // sideline numbers, rotated like a real field
  for(let i=1;i<10;i++){
    const y=i*70, n=(i<=5? i*10 : (10-i)*10);
    p.push(`<text x="70" y="${y+9}" fill="#DDE6E1" fill-opacity=".13" font-family="Archivo Black,sans-serif" font-size="30" transform="rotate(-90 70 ${y})">${n}</text>`);
    p.push(`<text x="930" y="${y+9}" fill="#DDE6E1" fill-opacity=".13" font-family="Archivo Black,sans-serif" font-size="30" text-anchor="end" transform="rotate(90 930 ${y})">${n}</text>`);
  }
  // sidelines
  p.push(`<rect x="0" y="0" width="1000" height="700" fill="none" stroke="#DDE6E1" stroke-opacity=".22" stroke-width="3"/>`);
  if(los!=null){
    const y=los*7;
    p.push(`<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="var(--team)" stroke-opacity=".8" stroke-width="2" stroke-dasharray="7 6"/>`);
  }
  $("#turf").innerHTML = p.join("");
}

/* ---------------- data helpers ---------------- */
const activeGrps = () => UNITS.find(u=>u.key===unit).grps;
function activeGrp(){
  const rows = DATA.depth[team]||[];
  return activeGrps().find(g => rows.some(r=>r.grp===g)) || activeGrps()[0];
}
function slotsFor(grp){
  if(isPast()){
    const snap = (chartAt(timeIdx)[team] || {})[grp] || {};
    const by = {};
    for(const slot in snap){
      by[slot] = snap[slot].map((pid, i) => ({
        pid, rank: i + 1, grp, slot: +slot,
        abb: (SLOTMETA[grp+"|"+slot]||{}).abb || "",
        name: (SLOTMETA[grp+"|"+slot]||{}).name || "",
      })).filter(r => DATA.players[r.pid]);
    }
    return by;
  }
  const rows = (DATA.depth[team]||[]).filter(r=>r.grp===grp);
  const by = {};
  rows.forEach(r => (by[r.slot] ||= []).push(r));
  Object.values(by).forEach(a => a.sort((x,y)=>x.rank-y.rank));
  return by;
}

/* ---------------- render ---------------- */
/* Standard NFL ordering: AFC first, then NFC, each East / North / South / West. */
const DIVISIONS = ["AFC East","AFC North","AFC South","AFC West",
                   "NFC East","NFC North","NFC South","NFC West"];

function renderRail(){
  const rail = $("#rail"); rail.innerHTML="";
  const byDiv = {};
  Object.entries(DATA.teams).forEach(([ab,t]) => (byDiv[t.div] ||= []).push(ab));

  DIVISIONS.forEach(div=>{
    const abbrs = byDiv[div];
    if(!abbrs) return;
    const g = el("div","dgroup");
    g.appendChild(el("div","dlabel", div));
    const row = el("div","dteams");
    abbrs.sort().forEach(ab=>{
      const t = DATA.teams[ab];
      const b = el("button","tbtn");
      b.setAttribute("aria-current", ab===team);
      b.setAttribute("aria-label", t.name);
      b.title = t.name;
      if(t.logo){
        const im = new Image(); im.src = t.logo; im.alt = "";
        im.onerror = () => { b.innerHTML=""; b.appendChild(el("span","abbr", ab)); };
        b.appendChild(im);
      } else b.appendChild(el("span","abbr", ab));
      b.onclick = () => goTeam(ab);
      row.appendChild(b);
    });
    g.appendChild(row);
    rail.appendChild(g);
  });

  const cur = rail.querySelector('[aria-current="true"]');
  if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
}

function renderHead(){
  const t = DATA.teams[team];
  document.documentElement.style.setProperty("--team", t.c1);
  // Readable text on top of the team colour.
  const rgb = t.c1.match(/\w\w/g).map(h=>parseInt(h,16));
  const lum = (0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2])/255;
  document.documentElement.style.setProperty("--team2", lum>0.6 ? "#0E1417" : "#fff");
  // Several clubs wear colours far too dark to read against a dark page --
  // Seattle's navy manages 1.08:1, which is invisible. Lighten until the accent
  // actually carries, and use that wherever the colour has to mean something.
  document.documentElement.style.setProperty("--team-accent", readableAccent(t.c1));

  $("#tname").textContent = t.name;
  const n = (DATA.depth[team]||[]).filter((r,i,a)=>a.findIndex(x=>x.pid===r.pid)===i).length;
  $("#tmeta").textContent = `${t.div} \u00b7 ${n} players on the chart`;

  const s = DATA.season[team];
  const tr = $("#trec"); tr.innerHTML = "";
  if(s){
    tr.appendChild(el("span","wl", s.record));
    const f = el("span","fin"+(s.champ?" champ":""), s.finish);
    tr.appendChild(f);
    tr.appendChild(el("span","pts", `${s.pf} scored \u00b7 ${s.pa} allowed`));
  }
  const tb = el("button",null,"Compare teams");
  tb.id = "tcmpbtn";
  tb.onclick = () => openTeamCompare(team);
  tr.appendChild(tb);

  const u = $("#units"); u.innerHTML="";
  UNITS.forEach(x=>{
    const b = el("button",null,x.label);
    b.dataset.unit = x.key;
    b.setAttribute("aria-pressed", x.key===unit);
    b.onclick = () => { unit=x.key; sel=null; renderField(); renderTeam(); syncHash(); };
    u.appendChild(b);
  });
}

/* Swapping backups in is easy to do a lot of, and until now the only way back
   was to switch teams and return. The control appears only once something has
   been changed, so it is not a permanent button explaining a state you are
   usually not in. */
function changedCount(){
  return Object.keys(sub).filter(k => sub[k]).length;
}

function renderResetChanges(){
  const bar = $("#fieldbar");
  let btn = document.getElementById("resetchart");
  const n = changedCount();
  if(!n){
    if(btn) btn.remove();
    return;
  }
  if(!btn){
    btn = el("button", null, "");
    btn.id = "resetchart";
    // Next to the formation label, because it describes the state of the field
    // rather than being another mode alongside Faces and Lineup.
    $("#formlab").after(btn);
  }
  btn.textContent = "Reset " + n + (n === 1 ? " change" : " changes");
  btn.title = "Put the listed starters back";
  btn.onclick = () => {
    for(const k in sub) delete sub[k];
    sel = null;
    renderField();
    renderTeam();
    syncHash();
  };
}

function renderTimebar(){
  const bar = $("#timebar");
  if(!TL){ bar.hidden = true; return; }
  bar.hidden = false;
  const sl = $("#time");
  sl.max = TL.dates.length - 1;
  sl.value = timeIdx;
  const d = new Date(TL.dates[timeIdx] + "T12:00:00Z");
  const nice = d.toLocaleDateString(undefined,{month:"short", day:"numeric"});
  const lab = $("#timelab");
  lab.innerHTML = "";
  if(isPast()){
    lab.appendChild(el("b", null, nice));
    lab.appendChild(document.createTextNode(" \u00b7 as it stood"));
  } else {
    lab.appendChild(el("b", null, nice));
    lab.appendChild(document.createTextNode(" \u00b7 today"));
  }
  $("#timenow").hidden = !isPast();
  document.body.classList.toggle("past", isPast());
}

function renderField(){
  closeSwap();
  preloadTeam(team, 112);
  const grp = activeGrp(), form = FORMS[grp], by = slotsFor(grp);
  renderTimebar();
  renderResetChanges();
  $("#formlab").textContent = form.label;
  $("#units").querySelectorAll("button")
    .forEach(b => b.setAttribute("aria-pressed", b.dataset.unit === unit));
  drawTurf();

  const box = $("#chips"); box.innerHTML="";
  Object.entries(form.coords).forEach(([slot,[x,y]])=>{
    const stackArr = by[slot]; if(!stackArr || !stackArr.length) return;
    const key = grp+"|"+slot;
    const idx = Math.min(sub[key]||0, stackArr.length-1);
    const row = stackArr[idx];
    const p = DATA.players[row.pid]; if(!p) return;

    const c = el("button","chip");
    c.dataset.pid = p.id;
    c.style.left = x+"%"; c.style.top = y+"%";
    if(sel===p.id) c.classList.add("sel");
    if(idx>0) c.classList.add("sub");
    if(t100only && !p.t100) c.classList.add("faded");
    if(playedToday(p)) c.classList.add("played");
    c.setAttribute("aria-label", `${p.name}, ${row.name}`);

    const d = el("div","disc");
    const face = el("div","face");
    const im = faceImg(p, 112, {onerror: () => {
      face.innerHTML = "";
      face.appendChild(el("div","fallback", p.num ?? "\u2013"));
    }});
    if(im) face.appendChild(im);
    else face.appendChild(el("div","fallback", p.num ?? "\u2013"));
    d.appendChild(face);
    if(p.num!=null) d.appendChild(el("div","jersey", p.num));
    if(p.t100) d.appendChild(el("div","t100", p.t100));
    if(p.inj) d.appendChild(el("div","injdot", p.inj.sev>=3?"!":"?"));

    // Movement badges describe the present, so they are meaningless on a
    // reconstruction of an earlier week.
    const mv = !isPast() && p.mv && (p.mv["2w"] || p.mv.season);
    if(mv){
      if(mv.new){
        d.appendChild(el("div","mv newc","NEW"));
      } else if(mv.d){
        const b = el("div","mv"+(mv.d<0?" down":""));
        b.textContent = (mv.d>0?"\u25B2":"\u25BC")+Math.abs(mv.d);
        d.appendChild(b);
      }
    }
    c.appendChild(d);

    c.appendChild(el("div","slotlab", slotLabel(grp, slot, row.abb)));
    c.appendChild(el("div","pname", shortName(p.name)));
    const lv = liveLineFor(p);
    if(lv) c.appendChild(el("div","livestat", lv.length > 26 ? lv.slice(0,26)+"\u2026" : lv));
    else if(stackArr.length>1) c.appendChild(el("div","stack", `+${stackArr.length-1}`));

    c.onclick = () => { sel=p.id; renderDetail(grp,slot,idx); paintSel(); syncHash(); };
    attachHold(c, grp, slot, stackArr);
    box.appendChild(c);
  });
}
function paintSel(){
  document.querySelectorAll(".chip").forEach(c =>
    c.classList.toggle("sel", c.dataset.pid === sel));
}
/* Lighten a colour toward white until it clears roughly 4:1 on the page. The
   hue is preserved, so a team still looks like itself. */
function readableAccent(hex){
  const srgb = c => { c /= 255; return c <= 0.03928 ? c/12.92 : ((c+0.055)/1.055)**2.4; };
  const lumOf = ([r,g,b]) => 0.2126*srgb(r) + 0.7152*srgb(g) + 0.0722*srgb(b);
  const BG = lumOf([0x13,0x1C,0x20]);
  const ratio = rgb => { const L = lumOf(rgb);
    return (Math.max(L,BG)+0.05)/(Math.min(L,BG)+0.05); };
  let rgb = (hex.match(/\w\w/g) || ["4A","7C","6F"]).map(h=>parseInt(h,16));
  if(ratio(rgb) >= 4) return hex;
  for(let a = 0.05; a <= 0.85; a += 0.05){
    const lit = rgb.map(c => Math.min(255, Math.round(c + (255-c)*a)));
    if(ratio(lit) >= 4)
      return "#" + lit.map(c=>c.toString(16).padStart(2,"0")).join("");
  }
  return "#9DB3AD";
}

const shortName = n => { const p=n.split(" "); return p.length<2?n:p[0][0]+". "+p.slice(1).join(" "); };

/* All three receiver slots come through as plain "WR". nflverse ranks receivers
   across the whole group (slot 1 gets WR1/4/7, slot 2 gets WR2/5/8, slot 8 gets
   WR3/6/9), so number them by slot to keep the field readable. */
const WR_SLOT = {1:"WR1", 2:"WR2", 8:"WR3"};
function slotLabel(grp, slot, abb){
  return (grp === "3WR 1TE" && abb === "WR") ? WR_SLOT[slot] || abb : abb;
}

function renderDetail(grp,slot,idx){

  h.appendChild(ph);
  const hi = el("div");

  hi.appendChild(el("h2","dname blk",p.name));

  h.appendChild(hi);

  // Tag row: Top 100, rookie status, and where they played last season.
  const tags = el("div","tags");

  if(p.t100){
    const b = el("span","pill gold");
    b.appendChild(el("span",null,"NFL Top 100"));
    b.appendChild(el("b",null,"#"+p.t100));
    // A rank alone does not say whether he is arriving or fading. Last year's
    // placing is what makes it mean something.
    if(p.t100p){
      const d = p.t100p - p.t100;
      b.appendChild(el("span","mv100 " + (d > 0 ? "up" : d < 0 ? "dn" : ""),
        d > 0 ? "\u25B2 " + d : d < 0 ? "\u25BC " + Math.abs(d) : "\u2013"));
    } else {
      b.appendChild(el("span","mv100 new","new"));
    }
    tags.appendChild(b);
  }
  if(p.rook){
    const b = el("span","pill new");
    b.appendChild(el("span",null,"Rookie"));
    b.appendChild(el("span","sub", p.pick ? "No. "+p.pick+" overall" : "Undrafted"));
    tags.appendChild(b);
  }
  if(p.prev){
    const t = DATA.teams[p.prev];
    const b = el("span","pill moved");
    b.appendChild(el("span","arrow","\u2190"));
    b.appendChild(el("span",null, t ? t.nick : p.prev));
    b.appendChild(el("span","sub", DATA.statsSeason));
    tags.appendChild(b);
  }
  if(p.dnp){
    const b = el("span","pill");
    b.appendChild(el("span",null,"Did not play in "+DATA.statsSeason));
    tags.appendChild(b);
  }
  if(tags.children.length) d.appendChild(tags);

  if(p.t100 && (p.t100p || p.t100)){
    const line = el("div");
    line.style.cssText = "margin:-6px 0 14px;font-family:'Barlow Condensed',sans-serif;"
      + "font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)";
    if(p.t100p){
      const d = p.t100p - p.t100;
      line.textContent = d === 0
        ? "Same rank as " + DATA.t100PrevYear
        : (d > 0 ? "Up " : "Down ") + Math.abs(d) + " from "
          + ord(p.t100p) + " in " + DATA.t100PrevYear;
    } else {
      line.textContent = "First time on the list";
    }

  }

  if(p.inj){
    const ib = el("div","injbar");
    ib.appendChild(el("span",null,"\u26A0"));
    ib.appendChild(el("span",null, p.inj.label
      + (p.inj.detail ? " \u00b7 "+p.inj.detail : "")));
    d.appendChild(ib);
  }

  if(p.mv){
    const two = p.mv["2w"], seas = p.mv.season;
    let txt = null;
    if(two && two.new) txt = "Added to the depth chart in the last fortnight.";
    else if(two && two.d) txt = (two.d>0?"Up ":"Down ")+Math.abs(two.d)
      +(Math.abs(two.d)===1?" spot":" spots")+" in the last fortnight.";
    else if(seas && seas.new) txt = "Added to the depth chart since March.";
    else if(seas && seas.d) txt = (seas.d>0?"Up ":"Down ")+Math.abs(seas.d)
      +(Math.abs(seas.d)===1?" spot":" spots")+" since March.";
    if(txt){
      const mb = el("div");
      const rising = (two && (two.d||0)>0) || (seas && (seas.d||0)>0)
                     || (two&&two.new) || (seas&&seas.new);
      mb.style.cssText = "margin-bottom:14px;font-family:'Barlow Condensed',sans-serif;"
        + "font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:"
        + (rising ? "var(--rise)" : "var(--fall)");
      mb.textContent = txt;
      d.appendChild(mb);

  const bs = el("div","sect");
  bs.appendChild(el("h3",null,"Profile"));
  const bio = el("dl","bio");
  const add = (k,v) => { if(v==null||v==="")return; const w=el("div");
    w.appendChild(el("dt",null,k)); w.appendChild(el("dd",null,v)); bio.appendChild(w); };
  add("Pos", p.pos);
  if(p.dr) add("Drafted", "Rd " + p.dr.rd + (p.dr.pk ? ", No. " + p.dr.pk : ""));
  else add("Drafted", "Undrafted");
  add("Exp", p.exp==null?null:(p.exp===0?"Rookie":p.exp+" yr"));
  add("Ht", p.ht?Math.floor(p.ht/12)+"'"+(p.ht%12)+'"':null);
  add("Wt", p.wt?p.wt+" lb":null);
  bs.appendChild(bio);
  if(p.col){ const cw=el("div"); cw.style.cssText="margin-top:9px;font-size:13px;color:var(--mute)";
    cw.textContent="College: "+p.col; bs.appendChild(cw); }
  if(p.dr && p.dr.yr){

    const byOther = p.dr.tm && p.dr.tm !== team;
    const tn = byOther ? (DATA.teams[p.dr.tm]?.nick || p.dr.tm) : null;
    dw.textContent = p.dr.yr + " draft" + (tn ? ", by the " + tn : "");
    bs.appendChild(dw);
  }
  d.appendChild(bs);

  // contract
  const ct = p.ct;
  if(ct){
    const cs = el("div","sect");
    cs.appendChild(el("h3",null,"Contract"));

    const top = el("div","ctop");
    const left = el("div");
    left.appendChild(el("div","apy","$"+ct.apy.toFixed(1)+"M"));
    left.appendChild(el("div","per","Average per year"));
    top.appendChild(left);
    if(ct.r){
      const right = el("div","pos");
      right.appendChild(el("b",null,ord(ct.r)));
      right.appendChild(document.createTextNode("of "+ct.n+" "+p.pos));
      top.appendChild(right);
    }
    cs.appendChild(top);

    const add = (label, val) => {
      if(val==null) return;
      const r = el("div","stat");
      r.appendChild(el("span","l",label));
      r.appendChild(el("span","v",val));
      r.appendChild(el("span","r"));
      cs.appendChild(r);
    };
    if(ct.yrs && ct.val!=null) add("Total", ct.yrs+" yr \u00b7 $"+ct.val.toFixed(1)+"M");
    if(ct.gtd!=null) add("Guaranteed", "$"+ct.gtd.toFixed(1)+"M");
    if(ct.cap!=null) add("Share of cap", ct.cap+"%");
    if(ct.signed) add("Signed", ct.signed);

    const cn = el("div");
    cn.style.cssText="margin-top:9px;font-size:12px;color:var(--dim);line-height:1.5";
    cn.textContent = "Figures are Over The Cap estimates. Rank is by average "
      + "per year among players at the same position.";
    cs.appendChild(cn);
    d.appendChild(cs);
  }

  const vsU = liveVsUsual(p);
  const lvLine = liveLineFor(p);
  if(lvLine){
    const lb = el("div","injbar");
    lb.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:14px;"
      + "padding:7px 10px;border-radius:3px;"
      + "background:color-mix(in srgb,#C25B5B 14%,transparent);"
      + "border:1px solid color-mix(in srgb,#C25B5B 40%,transparent);"
      + "font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.06em;"
      + "text-transform:uppercase;color:#E4A4A4";
    lb.appendChild(el("span",null,"Today"));
    lb.appendChild(el("span",null, lvLine));
    d.appendChild(lb);

    if(vsU.length){
      const vs = el("div","sect");
      vs.style.marginTop = "0";
      vs.appendChild(el("h3",null,"Against his usual day"));
      vsU.forEach(x=>{
        const r = el("div","vsusual");
        r.appendChild(el("span","k", x.label));
        r.appendChild(el("span","now", x.now.toLocaleString()));
        const pct = Math.round((x.ratio - 1) * 100);
        const cls = x.ratio >= 1.25 ? "up" : x.ratio <= 0.75 ? "dn" : "";
        r.appendChild(el("span","cmp2 " + cls,
          "avg " + x.avg + (pct > 0 ? "  +" + pct + "%" : "  " + pct + "%")));
        vs.appendChild(r);
      });
      const n = el("div","carnote");
      n.textContent = "Compared with his per-game average across the "

      vs.appendChild(n);
      d.appendChild(vs);
    }
  }

  // This season, when there is one. Shown above last year because it is the

  if(p.cur && p.cur.items.length){
    const cs = el("div","sect");
    const ch = el("h3", null, (DATA.current || {}).season + " season");
    ch.appendChild(el("span", null, p.cur.games
      + (p.cur.games === 1 ? " game" : " games")));
    cs.appendChild(ch);
    p.cur.items.forEach(it=>{
      const r = el("div","stat");
      r.appendChild(el("span","l", it.l));
      r.appendChild(el("span","v", it.v.toLocaleString()));
      if(it.r){
        const pct = it.r / it.n;
        const cls = pct <= 0.2 ? "good" : pct <= 0.6 ? "mid" : "low";
        const rr = el("span","r " + cls);
        rr.appendChild(el("b", null, ord(it.r)));
        rr.appendChild(document.createTextNode(" / " + it.n));
        r.appendChild(rr);
      } else r.appendChild(el("span","r"));
      cs.appendChild(r);
    });
    if(!(DATA.current || {}).ranked){
      const n = el("div","carnote");
      n.textContent = "Too few games played to rank anyone yet, so these are "
        + "totals only.";
      cs.appendChild(n);
    }
    d.appendChild(cs);
  }

  // stats
  const ss = el("div","sect");
  const prevNick = p.prev ? (DATA.teams[p.prev]?.nick || p.prev) : null;
  const sh = el("h3", null,
    ((DATA.current || {}).live ? "Last season" : DATA.statsSeason + " season")
    + (prevNick ? " with the " + prevNick : ""));
  if(p.st) sh.appendChild(el("span",null,p.st.games+" G"));
  ss.appendChild(sh);
  if(p.st){
    p.st.items.forEach(it=>{
      const r = el("div","stat");
      r.appendChild(el("span","l",it.l));
      r.appendChild(el("span","v", it.v.toLocaleString()));
      if(it.r){
        const pct = it.r/it.n;
        const cls = pct<=0.2?"good":pct<=0.6?"mid":"low";
        const rr = el("span","r "+cls);
        rr.appendChild(el("b",null,ord(it.r)));
        rr.appendChild(document.createTextNode(" / "+it.n));
        r.appendChild(rr);

    const note = el("div"); note.style.cssText="margin-top:9px;font-size:12px;color:var(--dim);line-height:1.5";
    note.textContent="Rank is among qualifying players at the same position group.";

  } else {
    const n = el("div"); n.style.cssText="font-size:13px;color:var(--dim);line-height:1.6";
    n.textContent = p.rook
      ? "No NFL numbers yet \u2014 " + DATA.statsSeason.toString().slice(-2)
        + " was his last college season."
      : "No "+DATA.statsSeason+" stats recorded. Linemen, long snappers and "
        + "players who did not appear last season show no line here.";
    ss.appendChild(n);
  }
  d.appendChild(ss);

  // where he works
  const tc = targetChart(p), rc = runChart(p);
  if(tc || rc){
    disclose(d, "where", "Where he works", null, body=>{
      if(tc){
        const t = p.tgt;
        const w = el("div");
        w.innerHTML = tc;
        body.appendChild(w.firstElementChild);
        const key = el("div","chartkey");
        [["var(--team-accent)","caught"],["transparent","incomplete"],
         ["var(--brass)","touchdown"],["var(--fall)","intercepted"]].forEach(([c,lab])=>{
          const sp = el("span");
          const i = el("i");
          i.style.background = c;
          i.style.border = "1.5px solid " + (c === "transparent" ? "var(--team-accent)" : c);
          sp.appendChild(i);
          sp.appendChild(document.createTextNode(lab));
          key.appendChild(sp);
        });
        body.appendChild(key);
        const n = el("div","carnote");
        n.textContent = t.n + " targets, " + t.c + " caught. Average depth "
          + t.adot + " yards, " + t.deep + " thrown twenty or more downfield. "
          + "Height on the chart is how far the ball travelled in the air, not "
          + "how far he ran with it.";
        body.appendChild(n);
      }
      if(rc){
        body.appendChild(el("div","advsub","Where he runs"));
        body.appendChild(rc);
        const n = el("div","carnote");
        n.textContent = p.run.n + " carries, " + p.run.avg + " a go. Darker means "
          + "more carries through that gap; a gold border means he scored there.";
        body.appendChild(n);
      }
    });
  }

  // career, year by year
  if(p.car && p.car.length){
    const bucket = POSBUCKET[p.pos];
    const cols = (DATA.careerSchema || {})[bucket] || [];
    if(cols.length){
      const span = p.car.length === 1 ? "1 season"
                 : p.car.length + " seasons";
      disclose(d, "car", "Career by year", span, body=>{
        // Highlight each column's best season so a career reads at a glance.
        const best = {};
        cols.forEach(c=>{
          const vals = p.car.map(r=>r[c.k]).filter(v=>v!=null);
          if(vals.length > 1) best[c.k] = Math.max(...vals);
        });

        // The shape first, then the numbers.
        const arc = careerChart(p, cols[0].k, cols[0].l);
        if(arc){
          const aw = el("div");
          aw.innerHTML = arc;
          body.appendChild(aw.firstElementChild);
          body.appendChild(el("div","chartnote",
            cols[0].l + " by season \u00b7 best year marked"));
        }

        const w = el("div","carwrap");
        const t = document.createElement("table");
        t.className = "car";
        const thead = document.createElement("thead");
        const hr = document.createElement("tr");
        ["Year","Tm","G", ...cols.map(c=>c.l)].forEach((h,i)=>{
          const th = document.createElement("th");
          th.textContent = h;
          if(i < 2) th.style.textAlign = "left";
          hr.appendChild(th);
        });
        thead.appendChild(hr); t.appendChild(thead);

        const tb = document.createElement("tbody");
        p.car.forEach(r=>{
          const tr = document.createElement("tr");
          if(r.y === DATA.statsSeason) tr.className = "cur";
          const add = (txt, cls) => {
            const td = document.createElement("td");
            if(cls) td.className = cls;
            td.textContent = txt;
            tr.appendChild(td);
          };
          add(r.y, "yr");
          add(r.t || "\u2013", "tm");
          add(r.g ?? "\u2013");
          cols.forEach(c=>{
            const v = r[c.k];
            add(v == null ? "\u2013" : v.toLocaleString(),
                (v != null && best[c.k] != null && v === best[c.k]) ? "best" : null);
          });
          tb.appendChild(tr);
        });
        t.appendChild(tb); w.appendChild(t); body.appendChild(w);

        const n = el("div","carnote");
        n.textContent = p.carFrom
          ? "Best season in each column is picked out. He has been in the league "
            + "since " + p.carFrom + "; records here begin in " + DATA.careerFirst + "."
          : "Best season in each column is picked out. Regular season only.";
        body.appendChild(n);
      });
    }
  }

  // week by week
  if(p.log && p.log.length > 1){
    const bucket = POSBUCKET[p.pos];
    const cols = (DATA.careerSchema || {})[bucket] || [];
    if(cols.length){
      // Chart the headline stat -- the first column is the one that defines the
      // position, so it is the right thing to draw.
      const key = cols[0].k, lab = cols[0].l;
      disclose(d, "log", "Week by week", p.log.length+" games", body=>{
        const vals = p.log.map(r=>r[key] || 0);
        const peak = Math.max(...vals, 1);
        const sp = el("div","spark");
        p.log.forEach(r=>{
          const v = r[key] || 0;
          const bar = el("i");
          bar.style.height = Math.max(4, Math.round(v/peak*100))+"%";
          if(v === peak && peak > 0) bar.className = "best";
          bar.title = "Week "+r.w+(r.o?" vs "+r.o:"")+": "+v+" "+lab;
          sp.appendChild(bar);
        });
        body.appendChild(sp);
        const sl = el("div","sparklab");
        sl.appendChild(el("span",null, lab+" by week"));
        sl.appendChild(el("span",null,"peak "+peak.toLocaleString()));
        body.appendChild(sl);

        const w = el("div","carwrap");
        w.style.marginTop = "12px";
        const t = document.createElement("table");
        t.className = "car";
        const hr = document.createElement("tr");
        ["Wk","Opp", ...cols.map(c=>c.l)].forEach((h,i)=>{
          const th = document.createElement("th");
          th.textContent = h;
          if(i < 2) th.style.textAlign = "left";
          hr.appendChild(th);
        });
        const thead = document.createElement("thead");
        thead.appendChild(hr); t.appendChild(thead);
        const tb = document.createElement("tbody");
        p.log.forEach(r=>{
          const tr = document.createElement("tr");
          const add = (txt, cls) => {
            const td = document.createElement("td");
            if(cls) td.className = cls;
            td.textContent = txt;
            tr.appendChild(td);
          };
          add(r.w, "yr");
          add(r.o || "\u2013", "tm");
          cols.forEach(c=>{
            const v = r[c.k];
            add(v == null ? "\u2013" : v.toLocaleString(),
                (c.k === key && v === peak && peak > 0) ? "best" : null);
          });
          tb.appendChild(tr);
        });
        t.appendChild(tb); w.appendChild(t); body.appendChild(w);
        const n = el("div","carnote");
        n.textContent = "Regular season only. Weeks with no game are absent rather "
          + "than shown as zeroes, so a bye and a healthy scratch do not look alike.";
        body.appendChild(n);
      });
    }
  }

  // comparables
  if(p.cmp && p.cmp.length){
    disclose(d, "cmp", "Most similar players", null, body=>{
      p.cmp.forEach(c=>{
        const q = DATA.players[c.pid];
        if(!q) return;
        const b = el("button","comp");
        const face = el("div","cf");
        const im = faceImg(q, 96, {lazy: true});
        if(im) face.appendChild(im);
        b.appendChild(face);
        b.appendChild(el("span","cn", q.name));
        const loc = LOCATE[q.id];
        b.appendChild(el("span","ct2",
          (loc ? loc.team+" \u00b7 " : "") + q.pos));
        b.onclick = () => goPlayer(q.id);
        body.appendChild(b);
      });
      const n = el("div","carnote");
      n.textContent = "Nearest players by age, size, snap share, production and "
        + "salary, within the same position group. This says who he resembles, "
        + "not what he will do.";
      body.appendChild(n);
    });
  }

  // down-and-distance splits
  if(p.sit && p.sit.length){
    disclose(d, "sit", "By situation", null, body=>{
      p.sit.forEach(x=>{
        const r = el("div","sit");
        const lw = el("div","l");
        lw.appendChild(el("b",null,x.l));
        lw.appendChild(el("span",null, x.n+" plays \u00b7 "+x.sub));
        r.appendChild(lw);
        r.appendChild(el("span","v", x.v+x.u));
        if(x.r){
          const pct = x.r/x.rn;
          r.appendChild(el("span","r "+(pct<=0.25?"good":pct>=0.7?"low":""),
                           ord(x.r)+" / "+x.rn));
        } else r.appendChild(el("span","r"));
        body.appendChild(r);
      });
      const n = el("div");
      n.style.cssText="margin-top:10px;font-size:12px;color:var(--dim);line-height:1.5";
      n.textContent = "Success rate counts plays that gained enough to keep the "
        + "drive on schedule. Ranks are against others at the same position.";
      body.appendChild(n);
    });
  }

  // biggest plays of last season
  if(p.hl && p.hl.length){
    disclose(d, "hl", "Biggest plays", p.hl.length+" from "+DATA.statsSeason, body=>{
      p.hl.forEach(x=>{
        const w = el("div","hl");
        const top = el("div","top");
        top.appendChild(el("span","wk","Week "+x.wk+(x.vs?" vs "+x.vs:"")));
        if(x.td) top.appendChild(el("span","td","TD"));
        top.appendChild(el("span","ep","+"+x.epa.toFixed(1)+" EPA"));
        w.appendChild(top);
        w.appendChild(el("div","txt", x.d));
        body.appendChild(w);
      });
      const n = el("div");
      n.style.cssText="margin-top:10px;font-size:12px;color:var(--dim);line-height:1.5";
      n.textContent = "Ranked by expected points added, which already knows that "
        + "twelve yards on 3rd-and-11 is worth more than twenty on 1st-and-10.";
      body.appendChild(n);

      const a = document.createElement("a");
      a.className = "yt";
      a.href = "https://www.youtube.com/results?search_query="
             + encodeURIComponent(p.name + " " + DATA.statsSeason + " highlights");
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "\u25B6  Watch on YouTube";
      body.appendChild(a);
    });
  }

  // advanced stats, collapsed by default but sticky once opened
  const a = p.adv;
  if(a && (a.items.length || a.snaps)){
    const t = el("button","advt");
    t.setAttribute("aria-expanded", advOpen);
    t.appendChild(el("span",null,"Advanced"));
    const ch = el("span","chev","\u25B6");
    t.appendChild(ch);
    d.appendChild(t);

    const body = el("div","advb");
    body.hidden = !advOpen;

    a.items.forEach(it=>{
      const r = el("div","stat");
      r.appendChild(el("span","l",it.l));
      r.appendChild(el("span","v", it.v.toLocaleString()));
      if(it.r){
        const cls = it.r/it.n<=0.2?"good":it.r/it.n<=0.6?"mid":"low";
        const rr = el("span","r "+cls);
        rr.appendChild(el("b",null,ord(it.r)));
        rr.appendChild(document.createTextNode(" / "+it.n));
        r.appendChild(rr);
      } else r.appendChild(el("span","r"));
      body.appendChild(r);
    });

    if(a.snaps){
      body.appendChild(el("div","advsub","Playing time"));
      a.snaps.forEach(s=>{
        const w = el("div");
        const row = el("div","snap");
        row.appendChild(el("span","l", s.l));
        row.appendChild(el("span","v", s.v.toLocaleString()+"  "+s.pct+"%"));
        w.appendChild(row);
        const bar = el("div","bar");
        const fill = el("i"); fill.style.width = Math.min(100, s.pct)+"%";
        bar.appendChild(fill); w.appendChild(bar);
        body.appendChild(w);
      });
    }

    const src = el("div");
    src.style.cssText="margin-top:12px;font-size:12px;color:var(--dim);line-height:1.5";
    src.textContent = "Charting data from Pro Football Reference. A rank appears "
      + "only where the player cleared a volume threshold, so a corner who was "
      + "rarely thrown at shows the number without a rank.";
    body.appendChild(src);

    t.onclick = () => {
      advOpen = !advOpen;
      t.setAttribute("aria-expanded", advOpen);
      body.hidden = !advOpen;
    };
    d.appendChild(body);
  }

  // depth at this spot
  const ds = el("div","sect");
  const dh = el("h3",null,"Depth at "+slotLabel(grp,slot,row.abb));
  dh.appendChild(el("span",null,stackArr.length+" listed"));
  ds.appendChild(dh);
  const list = el("div","depth");
  stackArr.forEach((r,i)=>{
    const pp = DATA.players[r.pid]; if(!pp) return;
    const b = el("button","drow");
    b.setAttribute("aria-current", i===idx);
    b.appendChild(el("span","dord", i+1));
    b.appendChild(el("span","dnm", pp.name));
    if(pp.t100) b.appendChild(el("span","dt100","T100"));
    if(pp.rook) b.appendChild(el("span","drook","R"));
    else if(pp.prev) b.appendChild(el("span","dnew","NEW"));
    if(pp.num!=null) b.appendChild(el("span","djn", pp.num));
    b.onclick = () => {
      // Selecting the listed starter is a removal, not a change. Storing a zero
      // here would leave the chart looking modified when it is back to default.
      if(i === 0) delete sub[grp + "|" + slot];
      else sub[grp + "|" + slot] = i;
      sel = pp.id;
      renderField(); renderDetail(grp, slot, i); syncHash();
    };
    list.appendChild(b);
  });
  ds.appendChild(list);
  d.appendChild(ds);
  d.scrollTop = 0;
}
const ord = n => n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");
// A coach hired in 2013 is in his 14th season in 2026, not "14 years" -- the
// current season has not been played yet.
const ordSeason = n => ord(n);

/* ---------------- team overview (default panel) ---------------- */
const tier = r => r<=8 ? "tier1" : r<=24 ? "tier2" : "tier3";
const rcls = r => r<=8 ? "good" : r<=24 ? "mid" : "low";

// Several sections are long enough to want collapsing. Open state is keyed by
// name so it persists as you move between teams.
const openSections = {};
function disclose(parent, key, label, note, fill){
  const t = el("button","advt");
  const on = !!openSections[key];
  t.setAttribute("aria-expanded", on);
  const lw = el("span",null,label);
  if(note){ const n = el("span"); n.style.cssText="color:var(--dim);margin-left:8px";
            n.textContent = note; lw.appendChild(n); }
  t.appendChild(lw);
  t.appendChild(el("span","chev","\u25B6"));
  parent.appendChild(t);
  const body = el("div","advb");
  body.hidden = !on;
  fill(body);
  t.onclick = () => {
    openSections[key] = !openSections[key];
    t.setAttribute("aria-expanded", openSections[key]);
    body.hidden = !openSections[key];
  };
  parent.appendChild(body);
}

function sectionHistory(d){
  const h = (DATA.history || {})[team];
  if(!h || !h.seasons.length) return;
  disclose(d, "hist", "Last ten seasons", h.record, body=>{
    const sum = el("div","hsum");
    const left = el("div");
    left.appendChild(el("div","big", h.pct + "%"));
    left.appendChild(el("div","lab", "Win rate, " + h.from + "\u2013" + h.to));
    sum.appendChild(left);
    const rk = el("div","rk");
    rk.appendChild(el("b",null, ord(h.rank)));

    sum.appendChild(rk);
    body.appendChild(sum);

    const line = el("div","carnote");
    line.style.marginTop = "0";
    line.textContent = h.playoffs + " playoff trips \u00b7 " + h.div_titles
      + " division titles \u00b7 " + h.titles
      + (h.titles === 1 ? " Super Bowl" : " Super Bowls");

    body.appendChild(seasonStrip(h.seasons));
    body.appendChild(el("div","chartnote",
      "Each block is a season, sized by points difference \u00b7 gold is a title"));

    h.seasons.forEach(s=>{

      w.appendChild(b);
    });
    body.appendChild(w);
    const sl = el("div","sparklab");
    sl.appendChild(el("span",null, h.from));
    sl.appendChild(el("span",null, "wins by season"));
    sl.appendChild(el("span",null, h.to));
    body.appendChild(sl);

    const wrap = el("div","carwrap");
    wrap.style.marginTop = "12px";
    const t = document.createElement("table");
    t.className = "car hist";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["Year","Record","Div","Fin","Result","Coach"].forEach((x,i)=>{
      const th = document.createElement("th");
      th.textContent = x;
      if(i === 0 || i > 3) th.style.textAlign = "left";
      hr.appendChild(th);
    });
    thead.appendChild(hr); t.appendChild(thead);
    const tb = document.createElement("tbody");
    h.seasons.slice().reverse().forEach(s=>{
      const tr = document.createElement("tr");
      if(s.y === DATA.statsSeason) tr.className = "cur";
      const add = (txt, cls) => {
        const td = document.createElement("td");
        if(cls) td.className = cls;
        td.textContent = txt;
        tr.appendChild(td);

      add(s.as ? s.y + "*" : s.y, "yr");
      add(s.rec);
      add(s.div);
      add(s.dr ? s.dr + "/" + s.dn : "\u2013");
      add(s.fin, "fin" + (s.champ ? " sb" : s.playoff ? " po" : ""));
      add(s.coach || "\u2013", "co");
      tb.appendChild(tr);

    t.appendChild(tb); wrap.appendChild(t); body.appendChild(wrap);

    const moved = h.seasons.filter(s=>s.as);
    const n = el("div","carnote");
    n.textContent = "Div is the record inside the division; Fin is where they placed "
      + "in it."
      + (moved.length ? "  * played as " + moved[0].as + " that season." : "");
    body.appendChild(n);
  });
}

function sectionCatchUp(d){
  const yr = catchUpYear;
  const rows = (DATA.depth[team] || []);
  const best = {};
  rows.forEach(r=>{
    const k = r.grp + "|" + r.slot;
    if(!best[k] || r.rank < best[k].rank) best[k] = r;
  });
  const starters = Object.values(best)
    .map(r => ({r, p: DATA.players[r.pid]}))
    .filter(x => x.p);
  if(!starters.length) return;

  const fresh = starters.filter(x => x.p.first && x.p.first > yr);
  const known = starters.filter(x => x.p.first && x.p.first <= yr);

  disclose(d, "catchup", "If you stopped watching",
           fresh.length + " new starters", body=>{
    const pick = el("div","yrpick");
    [2018,2020,2021,2022,2023].forEach(y=>{
      const b = el("button", null, "after " + y);
      b.setAttribute("aria-pressed", y === yr);
      b.onclick = () => { catchUpYear = y; renderTeam(); openSections.catchup = true; };
      pick.appendChild(b);
    });
    body.appendChild(pick);

    const head = el("div","cuhead");
    const left = el("div");
    left.appendChild(el("div","big", fresh.length + " of " + starters.length));
    left.appendChild(el("div","lab", "starters you have never seen"));
    head.appendChild(left);
    body.appendChild(head);

    const list = (label, arr, showYear) => {
      if(!arr.length) return;
      const h = el("div","advsub", label);
      body.appendChild(h);
      arr.sort((a,b)=> (a.p.t100||999) - (b.p.t100||999)
                    || (a.p.first||0) - (b.p.first||0));
      arr.slice(0,12).forEach(x=>{
        const row = el("button","curow");
        const f = el("div","cf");
        const im = faceImg(x.p, 96, {lazy: true});
        if(im) f.appendChild(im);
        row.appendChild(f);
        row.appendChild(el("span","cn", x.p.name));
        row.appendChild(el("span","cp", x.r.abb));
        if(showYear && x.p.first) row.appendChild(el("span","cy", "'" + String(x.p.first).slice(-2)));
        row.onclick = () => { $("#quiz").hidden = true; goPlayer(x.p.id); };
        body.appendChild(row);
      });
    };

    list("New since then", fresh, true);
    list("Still here from before", known, false);

    const n = el("div","carnote");
    n.textContent = "Debut year comes from career stats where available, otherwise "
      + "from years of experience. The second list is your anchor \u2014 you know "
      + "more of this roster than it feels like.";
    body.appendChild(n);
  });
}

/* ---------------- depth chart through time ----------------
   The timeline stores a baseline plus weekly diffs. Replaying the diffs up to a
   given week reconstructs the chart as it stood then. Slot labels come from the
   current chart, since a slot's position name does not change even when its
   occupants do. */
const TL = DATA.timeline || null;
let timeIdx = TL ? TL.dates.length - 1 : 0;
const TL_CACHE = {};

const SLOTMETA = {};
Object.values(DATA.depth).forEach(rows=>rows.forEach(r=>{
  SLOTMETA[r.grp + "|" + r.slot] ||= {abb: r.abb, name: r.name};
}));

function chartAt(i){
  if(!TL) return null;
  if(TL_CACHE[i]) return TL_CACHE[i];
  const out = JSON.parse(JSON.stringify(TL.base));
  for(let k = 0; k < i; k++){
    const ch = TL.diffs[k] || {};
    for(const tm in ch)
      for(const grp in ch[tm]){
        out[tm] ||= {}; out[tm][grp] ||= {};
        for(const slot in ch[tm][grp]) out[tm][grp][slot] = ch[tm][grp][slot];
      }
  }
  TL_CACHE[i] = out;
  return out;
}
const isPast = () => TL && timeIdx < TL.dates.length - 1;

/* ---------------- where each player sits ----------------
   Search and deep links both need to answer "which team, which unit, which
   slot" for an arbitrary player, which the depth rows know but not directly. */
const LOCATE = {};
Object.entries(DATA.depth).forEach(([tm, rows])=>{
  rows.forEach(r=>{
    const unit = UNITS.find(u=>u.grps.includes(r.grp));
    if(!unit) return;
    const cur = LOCATE[r.pid];
    // Prefer the post where he is highest on the chart.
    if(!cur || r.rank < cur.rank) LOCATE[r.pid] = {team:tm, unit:unit.key, grp:r.grp,
                                                   slot:r.slot, rank:r.rank};
  });
});

/* ---------------- search ---------------- */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f.'-]/g,"");
const INDEX = Object.values(DATA.players).map(p=>({
  pid:p.id, name:p.name, n:norm(p.name), pos:p.pos, num:p.num, t100:p.t100,
  team:(LOCATE[p.id]||{}).team, rank:(LOCATE[p.id]||{}).rank || 99
})).filter(x=>x.team);
const TEAMINDEX = Object.entries(DATA.teams).map(([ab,t])=>({
  ab, name:t.name, n:norm(t.name+" "+t.nick+" "+ab)
}));

let resIdx = -1, resList = [];

function search(qs){
  const q = norm(qs.trim());
  if(q.length < 2) return [];
  const teams = TEAMINDEX.filter(t=>t.n.includes(q))
    .map(t=>({kind:"team", ab:t.ab, name:t.name}));
  // Surname matches rank above mid-string ones, which is how people search.
  const scored = [];
  for(const p of INDEX){
    const i = p.n.indexOf(q);
    if(i < 0) continue;
    const last = p.n.split(" ").slice(1).join(" ");
    scored.push({kind:"player", ...p,
                 s: last.startsWith(q) ? 0 : p.n.startsWith(q) ? 1 : 2 + i});
  }
  // Same-name players: the recognised one first, then the starter, then A-Z.
  scored.sort((a,b)=> a.s-b.s || (a.t100||999)-(b.t100||999)
                    || a.rank-b.rank || a.name.localeCompare(b.name));
  return [...teams.slice(0,3), ...scored.slice(0,25)];
}

/* ---------------- deep links ---------------- */
let applyingHash = false;
function syncHash(){
  if(applyingHash) return;
  const scoresOpen = !$("#scores").hidden;
  const h = scoresOpen ? `#/scores/${scoreWeek || ""}`
          : sel ? `#/p/${sel}` : `#/${team}/${unit}`;
  if(location.hash !== h) history.replaceState(null, "", h);
}
function applyHash(){
  const h = decodeURIComponent(location.hash || "").replace(/^#\/?/, "");
  if(!h) return false;
  const parts = h.split("/").filter(Boolean);
  applyingHash = true;
  try{
    if(parts[0] === "scores"){
      const w = parseInt(parts[1], 10);
      if(w >= 1 && w <= 18) scoreWeek = w;
      renderAll();
      openScores();
      return true;
    }
    if(parts[0] === "p" && parts[1] && DATA.players[parts[1]]){
      goPlayer(parts[1]); return true;
    }
    if(DATA.teams[parts[0]]){
      const u = UNITS.find(x=>x.key === parts[1]);
      goTeam(parts[0], u ? u.key : undefined);
      return true;
    }
  } finally { applyingHash = false; }
  return false;
}
window.addEventListener("hashchange", ()=>{ if(!applyingHash) applyHash(); });

/* ---------------- trade machine ----------------
   Moving a player is not just a name changing colour. It frees money on one
   side, spends it on the other, and leaves a hole someone has to fill. This
   computes all three from the contract and depth data already loaded. */
let tradePid = null, tradeTo = null;

function openTrade(pid){
  tradePid = pid; tradeTo = null;
  $("#cmp").hidden = false;
  renderTrade();
}

function depthHole(pid){
  const loc = LOCATE[pid];
  if(!loc) return null;
  const stack = ((DATA.depth[loc.team]||[])
    .filter(r=>r.grp===loc.grp && r.slot===loc.slot)
    .sort((a,b)=>a.rank-b.rank));
  const i = stack.findIndex(r=>r.pid===pid);
  return {
    slot: (SLOTMETA[loc.grp+"|"+loc.slot]||{}).abb || loc.grp,
    wasStarter: i === 0,
    next: i >= 0 && stack[i+1] ? DATA.players[stack[i+1].pid] : null,
    behind: Math.max(0, stack.length - 1),
  };
}

function renderTrade(){
  const p = DATA.players[tradePid];
  const g = $("#cmpgrid");
  const head = $("#cmp").querySelector("h2");
  const from = (LOCATE[tradePid]||{}).team;
  head.textContent = "Trade";
  g.innerHTML = "";

  const box = el("div","tradebox");
  const hdr = el("div","tradehdr");
  hdr.appendChild(el("span","who", p.name));
  hdr.appendChild(el("span","ct2", p.pos + (p.num!=null ? "  #"+p.num : "")));
  hdr.appendChild(el("span","tradearrow","\u2192"));
  hdr.appendChild(el("span","who", tradeTo ? DATA.teams[tradeTo].nick : "\u2026"));
  box.appendChild(hdr);

  if(!tradeTo){
    const lab = el("div","carnote");
    lab.style.cssText = "margin:0 0 10px;font-family:'Barlow Condensed',sans-serif;"
      + "text-transform:uppercase;letter-spacing:.11em;font-size:11.5px;text-align:center";
    lab.textContent = "Send him where?";
    box.appendChild(lab);
    const pick = el("div","tcmp-pick");
    Object.keys(DATA.teams).sort().forEach(ab=>{
      if(ab === from) return;
      const b = el("button",null,ab);
      b.onclick = () => { tradeTo = ab; renderTrade(); };
      pick.appendChild(b);
    });
    box.appendChild(pick);
    g.appendChild(box);
    return;
  }

  const apy = p.ct ? p.ct.apy : 0;
  const hole = depthHole(tradePid);
  const grid = el("div","tradegrid");

  const side = (ab, sign) => {
    const col = el("div","tradecol");
    const rv = (DATA.roster||{})[ab] || {};
    const cap = rv.cap || {};
    col.appendChild(el("h4", null,
      DATA.teams[ab].nick + (sign < 0 ? " give up" : " receive")));

    const row = (k, v, cls) => {
      const r = el("div","cmprow");
      r.appendChild(el("span","k", k));
      r.appendChild(el("span", cls ? "val "+cls : "val", v));
      col.appendChild(r);
    };
    if(apy){
      row("Cap change", (sign<0 ? "\u2212" : "+") + "$" + apy.toFixed(1) + "M",
          sign<0 ? "" : "");
      const before = cap.total || 0;
      const after = before + sign*apy;
      row("Committed", "$"+before.toFixed(0)+"M \u2192 $"+after.toFixed(0)+"M");
    } else {
      row("Cap change", "no contract on record");
    }

    if(sign < 0 && hole){
      row("Opens at", hole.slot + (hole.wasStarter ? " (starter)" : ""));
      row("Next up", hole.next ? hole.next.name : "nobody listed");
    }
    if(sign > 0){
      const loc = LOCATE[tradePid];
      const theirs = ((DATA.depth[ab]||[])
        .filter(r=>r.abb === (SLOTMETA[loc.grp+"|"+loc.slot]||{}).abb)
        .sort((a,b)=>a.rank-b.rank));
      const inc = theirs[0] ? DATA.players[theirs[0].pid] : null;
      row("Currently there", inc ? inc.name : "nobody listed");
      const age = rv.age && rv.age.avg;
      if(age) row("Roster age", age + " yrs");
    }
    return col;
  };

  grid.appendChild(side(from, -1));
  grid.appendChild(side(tradeTo, +1));
  box.appendChild(grid);

  const again = el("button", null, "Pick a different team");
  again.style.cssText = "margin-top:14px;font-family:'Barlow Condensed',sans-serif;"
    + "font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);"
    + "border:1px solid var(--line);padding:6px 12px;border-radius:3px";
  again.onclick = () => { tradeTo = null; renderTrade(); };
  box.appendChild(again);

  const n = el("div","carnote");
  n.textContent = "Cap figures are average per year, not a real cap hit \u2014 dead "
    + "money and proration are not modelled. This is a shape, not a GM tool.";
  box.appendChild(n);
  g.appendChild(box);
}

/* ---------------- live game day ----------------
   ESPN's endpoints are undocumented and only populate their interesting fields
   while a game is actually being played, so nothing here assumes a shape. Every
   read is guarded and every panel hides itself if its data is absent. A missing
   field costs you that panel; it never breaks the page.

   Two endpoints:
     /scoreboard          scores, status, and the live down-and-distance
     /summary?event=ID    box score, drives, win probability
*/
const PROXY = "";
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const espnUrl = path => (PROXY ? PROXY + encodeURIComponent(ESPN + path) : ESPN + path);

const LIVE = {games:[], byTeam:{}, stats:{}, situation:null, drives:[],
              wp:null, active:new Set(), box:[], teamStats:[], plays:[],
              err:null, at:0, on:false, gameId:null};
let livePoll = null;

const TEAMFIX = {WSH:"WAS", LAR:"LA", JAC:"JAX"};
const normTeam = ab => TEAMFIX[ab] || ab;
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };

async function getJSON(path){
  const r = await fetch(espnUrl(path), {cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

const LIVE_DEBUG = /(^|[#&?])debug/.test(location.hash + location.search);
function liveLog(...a){ if(LIVE_DEBUG) console.log("[live]", ...a); }

/* ESPN's bare /scoreboard returns whatever week it thinks is current, which
   during preseason is unreliable -- it can hand back regular season week 1 and
   miss games being played today. Asking for an explicit date removes the
   guesswork; the bare call is kept as a fallback in case the parameter is ever
   rejected. */
function todayStamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}

async function fetchLive(){
  const tries = ["/scoreboard?dates=" + todayStamp(), "/scoreboard"];
  for(const path of tries){
    try {
      const j = await getJSON(path);
      const events = j.events || [];
      liveLog(path, "->", events.length, "events",
              events.map(e => (e.shortName || "") + " " +
                ((((e.status||{}).type)||{}).state || "")).join(" | "));
      if(!events.length) continue;              // try the next shape

      LIVE.games = events.map(e=>{
        const c = (e.competitions || [])[0] || {};
        const st = (e.status || {}).type || {};
        return {
          id: e.id,
          state: st.state,
          detail: st.shortDetail,
          situation: c.situation || null,
          teams: (c.competitors || []).map(t=>({
            ab: normTeam((t.team || {}).abbreviation || ""),
            id: (t.team || {}).id,
            score: t.score, home: t.homeAway === "home",
          })),
        };
      });
      LIVE.byTeam = {};
      LIVE.games.forEach(g => g.teams.forEach(t => {
        if(t.ab) LIVE.byTeam[t.ab] = g;
      }));
      LIVE.on = LIVE.games.some(g => g.state === "in");
      LIVE.at = Date.now();
      LIVE.err = null;
      liveLog("teams with a game today:", Object.keys(LIVE.byTeam).join(","),
              "| any live:", LIVE.on);
      return true;
    } catch(e){
      liveLog(path, "failed:", e.message);
      LIVE.err = String(e.message || e);
    }
  }
  LIVE.games = []; LIVE.byTeam = {}; LIVE.on = false;
  return false;
}

/* Box score, drives and win probability for one game. Keyed by ESPN athlete id,
   which every player in the payload carries, so stats land on the chart itself. */
async function fetchGame(gameId){
  try {
    const j = await getJSON("/summary?event=" + gameId);
    const stats = {}, active = new Set(), box = [];

    // Two shapes are kept from the same payload: a flat lookup keyed by athlete
    // id, which is what puts a line under a chip, and the original structure,
    // which is what a real box score needs.
    ((j.boxscore || {}).players || []).forEach(team=>{
      const ab = normTeam(((team.team || {}).abbreviation) || "");
      const cats = [];
      (team.statistics || []).forEach(cat=>{
        const labels = cat.labels || [];
        const rows = [];
        (cat.athletes || []).forEach(a=>{
          const ath = a.athlete || {};
          const id = ath.id;
          const line = {};
          (a.stats || []).forEach((v,i)=>{ if(labels[i]) line[labels[i]] = v; });
          if(id){
            stats[id] = stats[id] || {};
            stats[id][cat.name || "stats"] = line;
            active.add(String(id));
          }
          rows.push({
            eid: id ? String(id) : null,
            name: ath.displayName || ath.shortName || "",
            pos: (ath.position || {}).abbreviation || "",
            stats: a.stats || [],
          });
        });
        if(rows.length) cats.push({
          name: cat.name || "", label: cat.text || cat.name || "",
          labels, rows,
        });
      });
      if(cats.length) box.push({team: ab, cats});
    });

    // Team totals, for the comparison at the top of the box score.
    const teamStats = ((j.boxscore || {}).teams || []).map(t=>({
      team: normTeam(((t.team || {}).abbreviation) || ""),
      stats: (t.statistics || []).map(x=>({
        label: x.label || x.name, value: x.displayValue,
      })),
    }));

    const dr = j.drives || {};
    const list = [...(dr.previous || [])];
    if(dr.current) list.push(dr.current);
    LIVE.drives = list.slice(-12).reverse().map(d=>({
      team: normTeam(((d.team || {}).abbreviation) || ""),
      result: d.displayResult || d.result || "",
      plays: (d.plays || []).length || num(d.offensivePlays) || null,
      yards: num(d.yards),
      time: (d.timeElapsed || {}).displayValue || null,
      scoring: !!d.isScore,
    }));

    const wp = j.winprobability;
    if(Array.isArray(wp) && wp.length){
      const last = wp[wp.length - 1];
      const home = num(last.homeWinPercentage);
      LIVE.wp = home == null ? null : {
        home: Math.round(home * 100),
        series: wp.slice(-60).map(p => num(p.homeWinPercentage)).filter(v => v != null),
      };
    } else LIVE.wp = null;

    LIVE.stats = stats;
    LIVE.active = active;
    LIVE.box = box;
    LIVE.teamStats = teamStats;
    LIVE.gameId = gameId;
    liveLog("box score:", box.map(b => b.team + " " + b.cats.length + " cats").join(", "));
    return true;
  } catch(e){
    LIVE.drives = []; LIVE.wp = null; LIVE.box = []; LIVE.teamStats = [];
    liveLog("summary failed:", e.message);
    return false;
  }
}

/* ---- reading a player's day ---- */
function liveLineFor(p){
  if(!p.eid) return null;
  const s = LIVE.stats[p.eid];
  if(!s) return null;
  const bits = [];
  for(const cat in s){
    const line = s[cat];
    const keys = Object.keys(line).slice(0,3);
    const txt = keys.map(k => line[k] + " " + k).join(", ");
    if(txt) bits.push(txt);
  }
  return bits.join(" \u00b7 ") || null;
}
// A function declaration, not a const arrow: this is called from renderField,
// which sits earlier in the file. Hoisting removes any temporal-dead-zone risk
// if the boot order is ever rearranged.
function playedToday(p){ return !!(p.eid && LIVE.active.has(String(p.eid))); }

/* "Is that good?" -- every player's 2025 line and games are already loaded, so a
   live figure can be set against his own per-game average rather than left as a
   bare number. Only stats that exist in both places can be compared. */
const LIVE_MATCH = {
  "YDS": ["Rec yds","Rush yds","Pass yds"], "REC": ["Rec"], "CAR": ["Carries"],
  "TD": ["Rec TD","Rush TD","Pass TD"], "TOT": ["Solo tkl"], "SACKS": ["Sacks"],
  "SOLO": ["Solo tkl"], "INT": ["INT"],
};
function liveVsUsual(p){
  if(!p.eid || !p.st || !p.st.games) return [];
  const s = LIVE.stats[p.eid];
  if(!s) return [];
  const out = [];
  for(const cat in s){
    for(const k in s[cat]){
      const want = LIVE_MATCH[k.toUpperCase()];
      if(!want) continue;
      const now = num(s[cat][k]);
      if(now == null) continue;
      const base = p.st.items.find(i => want.includes(i.l));
      if(!base || !base.v) continue;
      const avg = base.v / p.st.games;
      if(avg <= 0) continue;
      out.push({label: base.l, now, avg: Math.round(avg * 10) / 10,
                ratio: now / avg});
      break;
    }
  }
  return out.slice(0,3);
}


/* ---- refresh loop ---- */
async function refreshLive(){
  const ok = await fetchLive();
  if(!ok){ renderLiveStrip(false); return false; }
  const g = LIVE.byTeam[team];
  LIVE.situation = g && g.state === "in" ? g.situation : null;
  if(g && g.state !== "pre"){ await fetchGame(g.id); await fetchPlays(g.id); }
  else { LIVE.stats = {}; LIVE.active = new Set(); LIVE.drives = []; LIVE.wp = null; }
  renderLiveStrip(true);
  renderField();
  // Draw the most recent play, but only onto a present-day view of a team that
  // is actually in the game.
  const latest = (LIVE.plays || [])[0];
  const g2 = LIVE.byTeam[team];
  if(latest && !isPast() && g2 && g2.state === "in"){
    drawPlay(latest, buildFeedIndex(g2.teams.map(t => t.ab).filter(Boolean)));
  } else clearPlayArrow();
  if(sel){ paintSel(); } else { renderTeam(); }
  return true;
}

function startLive(){ refreshLive().then(schedulePoll); }

/* The gap is re-evaluated after every refresh rather than fixed at startup: a
   game that is only scheduled when the page loads will kick off later, and the
   app should tighten up when it does. */
function schedulePoll(){
  clearInterval(livePoll);
  livePoll = setInterval(() => refreshLive().then(schedulePoll),
                         LIVE.on ? 30000 : 300000);
}

/* ---- the strip above the field ---- */
function renderLiveStrip(ok){
  const bar = $("#livebar");
  bar.className = "";
  // A failed request used to hide silently, which is indistinguishable from
  // "no games today". Say so instead, quietly, so a problem is visible.
  if(!ok){
    bar.hidden = false;
    bar.innerHTML = "";
    bar.appendChild(el("span","livelab",
      "Live scores unavailable" + (LIVE.err ? " (" + LIVE.err + ")" : "")));
    return;
  }
  if(!LIVE.games.length){ bar.hidden = true; return; }
  const g = LIVE.byTeam[team];
  bar.innerHTML = "";

  if(!g){
    const live = LIVE.games.filter(x => x.state === "in");
    if(!live.length){
      // Nothing live and nothing for this team: show today's slate so the strip
      // is still informative rather than vanishing.
      const today = LIVE.games.slice(0,3);
      if(!today.length){ bar.hidden = true; return; }
      bar.hidden = false;
      bar.appendChild(el("span","livelab","Today"));
      today.forEach(x=>{
        const aa = x.teams.find(t=>!t.home) || {}, hh2 = x.teams.find(t=>t.home) || {};
        bar.appendChild(el("span","livegame",
          aa.ab + " " + (x.state==="pre" ? "@ " : (aa.score??0) + " \u00b7 ") + hh2.ab
          + (x.state==="pre" ? "" : " " + (hh2.score??0))));
      });
      return;
    }
    bar.hidden = false; bar.className = "live";
    bar.appendChild(el("span","livedot on"));
    bar.appendChild(el("span","livelab", live.length
      + (live.length === 1 ? " game in progress" : " games in progress")));
    live.slice(0,4).forEach(x=>{
      const a = x.teams.find(t=>!t.home) || {}, h = x.teams.find(t=>t.home) || {};
      bar.appendChild(el("span","livegame",
        a.ab + " " + (a.score||0) + " \u00b7 " + h.ab + " " + (h.score||0)));
    });
    return;
  }

  bar.hidden = false;
  const a = g.teams.find(t=>!t.home) || {}, h = g.teams.find(t=>t.home) || {};
  const opp = (a.ab === team ? h.ab : a.ab);
  const home = h.ab === team;

  if(g.state === "pre"){
    // Not kicked off. No score exists yet, so do not invent a 0-0.
    bar.appendChild(el("span","when","Next"));
    bar.appendChild(el("span","vs",
      (home ? "vs " : "at ") + ((DATA.teams[opp]||{}).nick || opp)));
    bar.appendChild(el("span","livelab", g.detail || ""));
    return;
  }

  bar.className = g.state === "in" ? "live" : "final";
  const dot = el("span","livedot");
  if(g.state === "in") dot.classList.add("on");
  bar.appendChild(dot);
  const scoreEl = el("span","livescore",
    a.ab + " " + (a.score ?? 0) + "  \u2013  " + h.ab + " " + (h.score ?? 0));
  if(LIVE.box && LIVE.box.length){
    scoreEl.classList.add("scoreclick");
    scoreEl.title = "Full box score";
    scoreEl.onclick = openBox;
  }
  bar.appendChild(scoreEl);
  bar.appendChild(el("span","livelab", g.detail || ""));
  if(g.state === "in"){
    const wb = el("button", null, "Watch");
    wb.id = "watchbtn";
    wb.onclick = () => openWatch(g.id);
    bar.appendChild(wb);
  }

  // Down and distance, if the feed is carrying it.
  const st = LIVE.situation;
  if(st && (st.downDistanceText || st.shortDownDistanceText)){
    bar.appendChild(el("span","dd",
      st.downDistanceText || st.shortDownDistanceText));
  }
  if(LIVE.wp){
    const hp = LIVE.wp.home, mine = home ? hp : 100 - hp;
    bar.appendChild(el("span","wp", mine + "% win"));
  }
}

/* ---- today's game, in the team panel ---- */
function sectionGame(d){
  const g = LIVE.byTeam[team];
  if(!g || g.state === "pre") return;
  const live = g.state === "in";
  const a = g.teams.find(t=>!t.home) || {}, h = g.teams.find(t=>t.home) || {};
  const home = h.ab === team;

  const sec = el("div","sect");
  sec.style.marginTop = "0";
  const hh = el("h3", null, live ? "Live now" : "Today's game");
  hh.appendChild(el("span", null, g.detail || ""));
  sec.appendChild(hh);

  // Score line
  const sc = el("div","gsc");
  sc.appendChild(el("span","t", a.ab + " " + (a.score ?? 0)));
  sc.appendChild(el("span","d", "\u2013"));
  sc.appendChild(el("span","t", h.ab + " " + (h.score ?? 0)));
  if(LIVE.box && LIVE.box.length){
    const bx = el("button", null, "Box score");
    bx.style.cssText = "margin-left:auto;font-family:'Barlow Condensed',sans-serif;"
      + "font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);"
      + "border:1px solid var(--line);padding:5px 10px;border-radius:3px";
    bx.onclick = openBox;
    sc.appendChild(bx);
  }
  sec.appendChild(sc);

  // Field position. Drawn as its own bar rather than on the formation, because
  // the formation is a diagram of personnel, not a scale map of the field --
  // putting a real yard line on it would be a lie.
  const st = LIVE.situation;
  if(st){
    const dd = st.downDistanceText || st.shortDownDistanceText;
    if(dd) sec.appendChild(el("div","ddbig", dd));
    const yl = num(st.yardLine);
    if(yl != null){
      const strip = el("div","fieldbar2");
      const rz = el("i","rz"); strip.appendChild(rz);
      const ball = el("i","ball");
      ball.style.left = Math.max(0, Math.min(100, yl)) + "%";
      strip.appendChild(ball);
      sec.appendChild(strip);
      const lab = el("div","fblab");
      lab.appendChild(el("span", null, st.possessionText || ""));
      if(st.isRedZone) lab.appendChild(el("span","hot","Red zone"));
      sec.appendChild(lab);
    }
    if(st.lastPlay && st.lastPlay.text){
      const lp = el("div","lastplay", st.lastPlay.text);
      sec.appendChild(lp);
    }
  }

  // Win probability, with the swing so far
  if(LIVE.wp){
    const mine = home ? LIVE.wp.home : 100 - LIVE.wp.home;
    const wrap = el("div");
    wrap.style.marginTop = "12px";
    const top = el("div","qmeta");
    top.style.marginBottom = "4px";
    const l = el("span");
    l.appendChild(el("b", null, mine + "%"));
    l.appendChild(document.createTextNode(" win probability"));
    top.appendChild(l);
    wrap.appendChild(top);
    const series = LIVE.wp.series.map(v => home ? v : 1 - v);
    if(series.length > 3){
      const sp = el("div","spark");
      sp.style.height = "28px";
      series.forEach(v=>{
        const b = el("i");
        b.style.height = Math.max(3, Math.round(v * 100)) + "%";
        sp.appendChild(b);
      });
      wrap.appendChild(sp);
    }
    sec.appendChild(wrap);
  }

  // Who has actually played
  const rows = (DATA.depth[team] || []);
  const bestSlot = {};
  rows.forEach(r=>{
    const k = r.grp + "|" + r.slot;
    if(!bestSlot[k] || r.rank < bestSlot[k].rank) bestSlot[k] = r;
  });
  const projected = Object.values(bestSlot).filter(r => DATA.players[r.pid]);
  const seen = projected.filter(r => playedToday(DATA.players[r.pid]));
  if(LIVE.active.size){
    const n = el("div","carnote");
    n.style.marginTop = "12px";
    n.textContent = seen.length + " of " + projected.length
      + " projected starters have recorded a stat"
      + (live ? " so far." : ".")
      + " A depth chart is a guess until somebody plays.";
    sec.appendChild(n);
  }

  d.appendChild(sec);

  // Drives
  if(LIVE.drives.length){
    disclose(d, "drives", "Drives", LIVE.drives.length + " shown", body=>{
      LIVE.drives.forEach(dv=>{
        const row = el("div","drv" + (dv.scoring ? " score" : ""));
        row.appendChild(el("span","dt", dv.team));
        row.appendChild(el("span","dr2", dv.result || "\u2013"));
        const bits = [];
        if(dv.plays) bits.push(dv.plays + " pl");
        if(dv.yards != null) bits.push(dv.yards + " yds");
        if(dv.time) bits.push(dv.time);
        row.appendChild(el("span","dm", bits.join(" \u00b7 ")));
        body.appendChild(row);
      });
      const n = el("div","carnote");
      n.textContent = "Most recent first.";
      body.appendChild(n);
    });
  }
}

/* ---------------- full box score ----------------
   Opened by clicking any score. Renders whatever categories the feed happens to
   carry rather than a fixed list, because they differ between a game in progress
   and a finished one, and between preseason and regular season. */
let boxTeam = null;

function openBox(){
  if(!LIVE.box || !LIVE.box.length) return;
  $("#box").hidden = false;
  const g = LIVE.byTeam[team];
  // Default to the team being viewed if it is playing, else the first side.
  if(!boxTeam || !LIVE.box.some(b => b.team === boxTeam))
    boxTeam = LIVE.box.some(b => b.team === team) ? team : LIVE.box[0].team;
  renderBox();
}
function closeBox(){ $("#box").hidden = true; }

function renderBox(){
  const g = LIVE.byTeam[team] || LIVE.games.find(x => x.id === LIVE.gameId);
  const head = $("#boxhead"), body = $("#boxbody");
  head.innerHTML = ""; body.innerHTML = "";

  if(g){
    const a = g.teams.find(t=>!t.home) || {}, h = g.teams.find(t=>t.home) || {};

    sc.appendChild(el("span","bd","\u2013"));
    sc.appendChild(el("span","bt", h.ab + " " + (h.score ?? 0)));
    sc.appendChild(el("span","bs", g.detail || ""));

  }
