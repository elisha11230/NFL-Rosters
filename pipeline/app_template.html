<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NFL Depth Charts</title>
<meta name="description" content="Every NFL roster laid out in formation, with last season's numbers and league ranks.">
<meta name="theme-color" content="#0E1417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Depth Chart">
<meta name="application-name" content="Depth Chart">
<!--ICONS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette is measured, not eyeballed. Every text token clears WCAG AA (4.5:1)
   against both the page and the panel; borders clear 3:1 so they are visible
   rather than implied. The previous --dim sat at 2.55:1 and carried every
   caption and note in the app, which is why it read as murky. */
:root{
  --ink:#131C20; --panel:#1B252B; --field:#1B3129; --line:#566C77;
  --rule:#2F414E;                       /* quieter divider inside panels */
  --chalk:#EAF1ED; --mute:#A2B3AD; --dim:#819590;
  --brass:#D9B84A;
  --team:#4A7C6F; --team2:#0E1417; --team-accent:#7FA99E;
  --rise:#6FD69B; --fall:#E08A8A;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--chalk);
  font:400 15px/1.5 Barlow,-apple-system,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.cond{font-family:'Barlow Condensed',Barlow,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.blk{font-family:'Archivo Black',Impact,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--team);outline-offset:2px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}

/* ---------- team rail, grouped by division ---------- */
#rail{
  display:flex;gap:0;overflow-x:auto;overflow-y:hidden;
  background:#0A0F11;border-bottom:1px solid var(--line);
  scrollbar-width:thin;flex:0 0 auto;
}
#rail::-webkit-scrollbar{height:3px}
#rail::-webkit-scrollbar-thumb{background:var(--dim)}
.dgroup{
  flex:0 0 auto;display:flex;flex-direction:column;gap:5px;
  padding:8px 13px 9px;border-right:1px solid var(--line);
}
.dgroup:last-child{border-right:0}
.dlabel{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.16em;color:var(--dim);
  padding-left:2px;white-space:nowrap;
}
.dteams{display:flex;gap:3px}
.tbtn{
  position:relative;width:38px;height:38px;padding:4px;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  opacity:.5;transition:opacity .15s,background .15s;
}
.tbtn:hover{opacity:.9;background:#141C20}
.tbtn[aria-current="true"]{opacity:1;background:#161F24}
.tbtn[aria-current="true"]::after{
  content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;
  background:var(--team);border-radius:1px;
}
.tbtn img{width:100%;height:100%;object-fit:contain;display:block}
.tbtn .abbr{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.06em;color:var(--chalk);
}

/* ---------- team header ---------- */
#head{
  flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;padding:16px 20px 13px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,color-mix(in srgb,var(--team) 12%,transparent),transparent);
  position:relative;flex-wrap:wrap;
}
#head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--team)}
#hl{min-width:0}
#tname{font-size:clamp(19px,3.4vw,29px);line-height:1;color:#fff}
#tmeta{margin-top:6px;font-size:12.5px;color:var(--mute);font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.11em}
#units{display:flex;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
#units button{
  padding:8px 15px;background:var(--panel);font-family:'Barlow Condensed',sans-serif;
  font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
}
#units button[aria-pressed="true"]{background:var(--team);color:var(--team2)}

/* ---------- body split ---------- */
#split{flex:1 1 auto;display:flex;min-height:0}

/* ---------- field ---------- */
#fieldwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;padding:16px 18px 10px;overflow:auto}
#fieldbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:12px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--dim);font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.11em}
#t100btn{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:5px 10px;border-radius:var(--r);transition:.15s;
}
#t100btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
#t100btn:hover{color:var(--chalk)}

#field{
  position:relative;width:100%;flex:1 1 auto;min-height:520px;
  background:var(--field);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;
}
#field svg{position:absolute;inset:0;width:100%;height:100%}
#chips{position:absolute;inset:0}

/* ---------- player chip ----------
   .disc holds the badges and does NOT clip. .face is the circular window that
   crops the photo. Keeping those separate is what stops the jersey number from
   being sliced off by the circle. */
.chip{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  width:60px;transition:opacity .2s;
}
.chip.faded{opacity:.22}
.disc{
  position:relative;width:56px;height:56px;
  transition:transform .13s;
}
.face{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:#0B1113;border:2px solid var(--team);
  transition:box-shadow .13s,border-color .13s;
}
.chip:hover .disc,.chip.sel .disc{transform:scale(1.08)}
.chip:hover .face,.chip.sel .face{box-shadow:0 0 0 3px color-mix(in srgb,var(--team) 35%,transparent)}
.chip.sel .face{border-color:#fff}
.face img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.face .fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Archivo Black',sans-serif;font-size:18px;color:var(--dim);
}
.jersey{
  position:absolute;right:-6px;bottom:-3px;
  min-width:24px;height:24px;padding:0 5px;
  border-radius:12px;background:var(--team);color:var(--team2);
  font-family:'Archivo Black',sans-serif;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--field);
}
.t100{
  position:absolute;left:-7px;top:-3px;width:24px;height:24px;border-radius:50%;
  background:var(--brass);color:#181200;border:2px solid var(--field);
  font-family:'Archivo Black',sans-serif;font-size:11px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.slotlab{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.13em;color:var(--team-accent);
}
/* Name and depth count sit outside the button's hit area so they can be wider
   than the chip without stealing clicks from the player next to them. */
.pname{
  position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);
  width:92px;pointer-events:none;
  font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:13px;
  color:var(--chalk);text-align:center;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.stack{
  position:absolute;top:calc(100% + 19px);left:50%;transform:translateX(-50%);
  pointer-events:none;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.09em;
  color:var(--dim);
}
.chip.sub .pname{color:var(--brass)}

/* ---------- detail panel ---------- */
#detail{
  flex:0 0 336px;border-left:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:20px;
}
#empty{color:var(--dim);font-size:13.5px;line-height:1.65;padding-top:8px}
#empty b{display:block;color:var(--mute);font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.11em;font-size:12px;margin-bottom:8px;font-weight:600}

.dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.dphoto{
  flex:0 0 78px;height:78px;border-radius:var(--r);overflow:hidden;
  background:#0B1113;border:1px solid var(--line);
}
.dphoto img{width:100%;height:100%;object-fit:cover;object-position:top center}
.dphoto .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Archivo Black',sans-serif;font-size:22px;color:var(--dim)}
.dnum{font-family:'Archivo Black',sans-serif;font-size:12px;color:var(--team);margin-bottom:2px}
.dname{font-size:20px;line-height:1.1;color:#fff;margin-bottom:5px}
.dpos{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;
  font-size:12px;color:var(--mute)}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border:1px solid var(--line);border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:600;
  color:var(--mute);white-space:nowrap;
}
.pill b{font-family:'Archivo Black',sans-serif;font-size:12px;letter-spacing:0}
.pill .sub{color:var(--dim);letter-spacing:.08em;font-weight:500}
.pill.gold{border-color:var(--brass);color:var(--brass)}
.pill .mv100{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.06em}
.pill .mv100.up{color:var(--rise)} .pill .mv100.dn{color:var(--fall)}
.pill .mv100.new{color:var(--brass)}
.pill.gold .sub{color:color-mix(in srgb,var(--brass) 65%,var(--panel))}
.pill.new{
  border-color:color-mix(in srgb,var(--team) 55%,var(--line));
  color:var(--team-accent);
}
.pill.new .sub{color:color-mix(in srgb,var(--team) 30%,var(--mute))}
.pill.moved .arrow{color:var(--dim);font-size:12px}

.sect{margin-top:20px}
.sect h3{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.13em;color:var(--mute);
  padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:11px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.sect h3 span{color:var(--dim);letter-spacing:.09em}

.bio{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;font-size:13px}
.bio div{display:flex;justify-content:space-between;gap:8px}
.bio dt{color:var(--dim);font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.08em;font-size:12px}
.bio dd{color:var(--chalk)}

.stat{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.stat:last-child{border-bottom:0}
.stat .l{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.08em;font-size:12.5px;color:var(--mute)}
.stat .v{font-family:'Archivo Black',sans-serif;font-size:14px;color:#fff;min-width:52px;text-align:right}
.stat .r{
  flex:0 0 62px;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11.5px;letter-spacing:.05em;color:var(--dim);
}
.stat .r b{font-weight:700}
.r.good b{color:#5FBF8A} .r.mid b{color:var(--mute)} .r.low b{color:#8C6A6A}

.depth{display:flex;flex-direction:column;gap:1px}
.drow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 9px;border-radius:var(--r);transition:background .13s;
}
.drow:hover{background:var(--rule)}
.drow[aria-current="true"]{background:color-mix(in srgb,var(--team) 20%,transparent)}
.dord{
  flex:0 0 19px;height:19px;border-radius:2px;background:var(--rule);color:var(--mute);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;
  display:flex;align-items:center;justify-content:center;
}
.drow[aria-current="true"] .dord{background:var(--team);color:var(--team2)}
.dnm{flex:1 1 auto;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.djn{font-family:'Archivo Black',sans-serif;font-size:11px;color:var(--dim)}
.dt100{color:var(--brass);font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.06em;font-weight:700}
.drook,.dnew{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;
  font-weight:700;padding:1px 5px;border-radius:2px;
  border:1px solid color-mix(in srgb,var(--team) 50%,var(--line));
  color:var(--team-accent);
}

/* ---------- team record in header ---------- */
#trec{display:flex;align-items:center;gap:9px;margin-top:7px;flex-wrap:wrap}
#trec .wl{font-family:'Archivo Black',sans-serif;font-size:15px;color:#fff}
#trec .fin{
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:11.5px;color:var(--mute);
  padding:3px 8px;border:1px solid var(--line);border-radius:var(--r);
}
#trec .fin.champ{border-color:var(--brass);color:var(--brass)}
#trec .pts{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}

/* ---------- team overview panel ---------- */
.unit{margin-bottom:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.unit-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;background:#1A2429;
}
.unit-h .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.13em;color:var(--chalk)}
.unit-h .rk{display:flex;align-items:baseline;gap:5px}
.unit-h .rk b{font-family:'Archivo Black',sans-serif;font-size:19px;line-height:1}
.unit-h .rk span{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tier1 b{color:#5FBF8A} .tier2 b{color:var(--chalk)} .tier3 b{color:#C98080}
.unit-b{padding:3px 12px 8px}
.urow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.urow:last-child{border-bottom:0}
.urow .l{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.urow .v{font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff;
  min-width:56px;text-align:right}
.urow .r{flex:0 0 42px;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11.5px;letter-spacing:.05em}
.urow .r.good{color:#5FBF8A} .urow .r.mid{color:var(--dim)} .urow .r.low{color:#8C6A6A}

#back{
  display:flex;align-items:center;gap:7px;margin-bottom:14px;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.11em;font-size:11.5px;color:var(--mute);
}
#back:hover{color:var(--chalk)}

/* ---------- advanced stats disclosure ---------- */
/* ---------- contract ---------- */
/* ---------- head coach ---------- */
.coach{
  border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;margin-bottom:18px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--team) 9%,transparent),transparent);
}
.coach .nm{font-family:'Archivo Black',sans-serif;font-size:17px;color:#fff;line-height:1.1}
.coach .ten{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--team-accent);margin-top:5px;
}
.coach .rec{
  display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;
  padding-top:9px;border-top:1px solid var(--rule);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute);
}
.coach .rec b{font-family:'Archivo Black',sans-serif;font-size:12.5px;color:var(--chalk);
  letter-spacing:0;margin-right:4px}
.coach .rec .gold b{color:var(--brass)}
.coach .first{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin-top:9px;
  padding-top:9px;border-top:1px solid var(--rule);
}

.coach .staff{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule)}
.srow{display:flex;align-items:baseline;gap:10px;padding:5px 0}
.srow .role{
  flex:0 0 128px;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
}
.srow .who{flex:1 1 auto;font-size:13.5px;color:var(--chalk)}
.srow .yrs{
  flex:0 0 auto;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;
}
.srow .yrs.new{color:var(--team-accent)}

.ctop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding:2px 0 10px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.ctop .apy{font-family:'Archivo Black',sans-serif;font-size:25px;line-height:1;color:#fff}
.ctop .per{font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.ctop .pos{text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.ctop .pos b{font-family:'Archivo Black',sans-serif;font-size:15px;display:block;
  letter-spacing:0;margin-bottom:2px}

/* ---------- movement ----------
   Corners in use on a chip: Top 100 top-left, injury top-right, jersey
   bottom-right. Movement takes bottom-left, the only one left, and stays clear
   of the position label sitting above the disc. */
.mv{
  position:absolute;left:-8px;bottom:-3px;
  display:flex;align-items:center;gap:1px;padding:0 5px;height:19px;
  border-radius:10px;
  background:var(--field);border:2px solid var(--rise);
  font-family:'Archivo Black',sans-serif;font-size:10px;line-height:1;
  color:var(--rise);white-space:nowrap;
}
:root{--rise:#5FBF8A;--fall:#C98080}
.mv.down{border-color:var(--fall);color:var(--fall)}
.mv.newc{border-color:var(--brass);color:var(--brass);font-size:8.5px}

.mrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--rule)}
.mrow:last-child{border-bottom:0}
.mrow .arw{
  flex:0 0 30px;text-align:center;font-family:'Archivo Black',sans-serif;
  font-size:11px;color:var(--rise);
}
.mrow .arw.newc{color:var(--brass);font-size:10px}
.mrow .nm{flex:1 1 auto;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .pp{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim)}

/* ---------- cap allocation ---------- */
.cap{display:flex;height:9px;border-radius:2px;overflow:hidden;margin:2px 0 12px;background:var(--rule)}
.cap i{display:block;height:100%}
.caprow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--rule)}
.caprow:last-child{border-bottom:0}
.caprow .sw{flex:0 0 9px;height:9px;border-radius:2px}
.caprow .g{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.caprow .m{font-family:'Archivo Black',sans-serif;font-size:12.5px;color:#fff;min-width:56px;text-align:right}
.caprow .p{flex:0 0 44px;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11.5px;color:var(--dim)}

/* ---------- age ---------- */
.agebox{display:flex;align-items:flex-end;gap:14px;padding-bottom:10px;
  border-bottom:1px solid var(--rule);margin-bottom:8px}
.agebox .big{font-family:'Archivo Black',sans-serif;font-size:25px;line-height:1;color:#fff}
.agebox .lab{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-top:5px}
.agebox .rk{margin-left:auto;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.agebox .rk b{font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--chalk);
  display:block;letter-spacing:0;margin-bottom:2px}

/* ---------- schedule ---------- */
.gm{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--rule)}
.gm:last-child{border-bottom:0}
.gm .wk{flex:0 0 30px;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.gm .ha{flex:0 0 20px;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;color:var(--dim)}
.gm .op{flex:1 1 auto;font-family:'Archivo Black',sans-serif;font-size:12px;color:var(--chalk)}
.gm .rc{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.06em;color:var(--dim)}
.gm.bye{color:var(--dim)}
.gm.bye .op{font-family:'Barlow Condensed',sans-serif;letter-spacing:.11em;
  text-transform:uppercase;font-size:11.5px;color:var(--dim)}

/* ---------- injury ---------- */
.injdot{
  position:absolute;right:-7px;top:-3px;width:19px;height:19px;border-radius:50%;
  background:#D06A6A;border:2px solid var(--field);
  font-family:'Archivo Black',sans-serif;font-size:10px;color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.injbar{
  display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:7px 10px;
  border-radius:var(--r);background:color-mix(in srgb,#C25B5B 16%,transparent);
  border:1px solid color-mix(in srgb,#C25B5B 45%,transparent);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:#E4A4A4;
}

/* ---------- highlights ---------- */
.hl{padding:8px 0;border-bottom:1px solid var(--rule)}
.hl:last-of-type{border-bottom:0}
.hl .top{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
.hl .wk{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim)}
.hl .ep{
  margin-left:auto;font-family:'Archivo Black',sans-serif;font-size:10.5px;
  color:var(--rise);
}
.hl .td{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.09em;padding:1px 5px;border-radius:2px;
  border:1px solid var(--brass);color:var(--brass);
}
.hl .txt{font-size:13px;line-height:1.45;color:var(--chalk)}
.yt{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:12px;padding:9px 12px;border-radius:var(--r);
  border:1px solid var(--line);color:var(--mute);text-decoration:none;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;transition:.15s;
}
.yt:hover{border-color:var(--team);color:var(--chalk)}

/* ---------- search ---------- */
#searchbar{
  flex:0 0 auto;position:relative;border-bottom:1px solid var(--line);
  background:#0C1215;
}
#q{
  width:100%;padding:9px 14px 9px 34px;background:none;border:0;color:var(--chalk);
  font:400 14px/1.4 Barlow,sans-serif;
}
#q::placeholder{color:var(--dim)}
#q:focus{outline:none;background:#101A1E}
#searchbar .mag{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--dim);font-size:13px;pointer-events:none;
}
#qclear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--dim);font-size:16px;line-height:1;padding:2px 6px;
}
#qclear:hover{color:var(--chalk)}
#results{
  position:absolute;left:0;right:0;top:100%;z-index:40;max-height:330px;
  overflow-y:auto;background:#101A1E;border-bottom:1px solid var(--line);
  box-shadow:0 12px 28px rgba(0,0,0,.5);
}
#results[hidden]{display:none}
.res{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 14px;border-bottom:1px solid var(--rule);
}
.res:hover,.res.on{background:#243039}
.res .rnum{
  flex:0 0 26px;font-family:'Archivo Black',sans-serif;font-size:11px;
  color:var(--dim);text-align:right;
}
.res .rnm{flex:1 1 auto;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rmeta{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap;
}
.res .rt100{color:var(--brass);font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.06em}
.nores{padding:14px;color:var(--dim);font-size:13px}

/* ---------- situational ---------- */
.sit{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.sit:last-of-type{border-bottom:0}
.sit .l{flex:1 1 auto}
.sit .l b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sit .l span{font-size:11px;color:var(--dim)}
.sit .v{font-family:'Archivo Black',sans-serif;font-size:14px;color:#fff;
  min-width:56px;text-align:right}
.sit .r{flex:0 0 62px;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11.5px;color:var(--dim)}
.sit .r.good{color:#5FBF8A} .sit .r.low{color:#8C6A6A}

/* ---------- compare ---------- */
#cmp{
  position:fixed;inset:0;z-index:60;background:rgba(8,12,14,.93);
  display:flex;flex-direction:column;padding:18px;overflow:auto;
}
#cmp[hidden]{display:none}
.cmphead{display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:14px;flex:0 0 auto}
.cmphead h2{font-family:'Archivo Black',sans-serif;font-size:17px;color:#fff}
#cmpclose{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:6px 12px;border-radius:var(--r);
}
#cmpclose:hover{color:var(--chalk);border-color:var(--team)}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:840px;
  margin:0 auto;width:100%}
.cmpcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;min-width:0}
.cmpcol.empty{display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:13px;text-align:center;min-height:200px;line-height:1.6}
.cmprow{display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--rule);font-size:13px}
.cmprow:last-child{border-bottom:0}
.cmprow .k{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.cmprow .val{font-family:'Archivo Black',sans-serif;font-size:12.5px;color:var(--chalk)}
.cmprow .val.win{color:#5FBF8A}
@media (max-width:700px){ .cmpgrid{grid-template-columns:1fr} }

/* ---------- career table ---------- */
.carwrap{overflow-x:auto;margin:0 -2px}
table.car{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.car th,table.car td{padding:6px 7px;text-align:right;white-space:nowrap}
table.car th{
  font-family:'Barlow Condensed',sans-serif;font-size:10.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);
}
table.car td{font-size:12.5px;color:var(--chalk);border-bottom:1px solid var(--rule)}
table.car tr:last-child td{border-bottom:0}
table.car .yr{text-align:left;font-family:'Archivo Black',sans-serif;font-size:11.5px}
table.car .tm{text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.08em;color:var(--dim)}
table.car tr.cur td{background:color-mix(in srgb,var(--team) 13%,transparent)}
table.car tr.cur .yr{color:#fff}
table.car td.best{color:#5FBF8A;font-weight:600}
.carnote{margin-top:10px;font-size:12px;color:var(--dim);line-height:1.5}

/* ---------- league leaders ---------- */
#lead{position:fixed;inset:0;z-index:65;background:rgba(8,12,14,.96);
  display:flex;flex-direction:column;padding:16px 18px}
#lead[hidden]{display:none}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:12px;flex:0 0 auto}
.lhead h2{font-family:'Archivo Black',sans-serif;font-size:16px;color:#fff}
.lsplit{flex:1 1 auto;display:flex;gap:16px;min-height:0;max-width:940px;
  margin:0 auto;width:100%}
.lcats{flex:0 0 210px;overflow-y:auto;border-right:1px solid var(--line);padding-right:10px}
.lgrp{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);margin:12px 0 5px;padding-left:2px}
.lgrp:first-child{margin-top:0}
.lcat{
  display:block;width:100%;text-align:left;padding:6px 9px;border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.06em;
  color:var(--mute);
}
.lcat:hover{background:#243039;color:var(--chalk)}
.lcat[aria-pressed="true"]{background:color-mix(in srgb,var(--team) 22%,transparent);
  color:#fff}
.lrows{flex:1 1 auto;overflow-y:auto;min-width:0}
.ltitle{font-family:'Archivo Black',sans-serif;font-size:15px;color:#fff;margin-bottom:3px}
.lsub{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:11px}
.lrow{display:flex;align-items:center;gap:11px;padding:7px 0;width:100%;text-align:left;
  border-bottom:1px solid var(--rule)}
.lrow:hover .ln{color:#fff}
.lrow .lr{flex:0 0 26px;text-align:right;font-family:'Archivo Black',sans-serif;
  font-size:12px;color:var(--dim)}
.lrow.top .lr{color:var(--brass)}
.lrow .lf{flex:0 0 28px;height:28px;border-radius:50%;overflow:hidden;background:#0B1113;
  border:1px solid var(--line)}
.lrow .lf img{width:100%;height:100%;object-fit:cover;object-position:top center}
.lrow .ln{flex:1 1 auto;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lt{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap}
.lrow .lv{font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--chalk);
  min-width:62px;text-align:right}
#leadbtn{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:5px 10px;border-radius:var(--r);
}
#leadbtn:hover{color:var(--chalk);border-color:var(--team)}
@media (max-width:760px){
  .lsplit{flex-direction:column}
  .lcats{flex:0 0 auto;max-height:132px;border-right:0;border-bottom:1px solid var(--line);
    padding-right:0;padding-bottom:8px}
}

/* ---------- leaderboard years ---------- */
.lyears{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.lyears button{
  padding:5px 11px;border:1px solid var(--line);border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;
  color:var(--mute);
}
.lyears button[aria-pressed="true"]{border-color:var(--team);color:#fff;
  background:color-mix(in srgb,var(--team) 20%,transparent)}
.lrow .lmv{
  flex:0 0 54px;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.06em;color:var(--dim);white-space:nowrap;
}
.lrow .lmv.up{color:#5FBF8A} .lrow .lmv.dn{color:#C98080}
.lrow .lmv.new{color:var(--brass)}

/* ---------- learn: quiz ---------- */
#quiz{position:fixed;inset:0;z-index:70;background:rgba(8,12,14,.96);
  display:flex;flex-direction:column;padding:18px;overflow:auto}
#quiz[hidden]{display:none}
.qwrap{max-width:520px;margin:0 auto;width:100%;flex:1 1 auto;
  display:flex;flex-direction:column;justify-content:center}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:18px;max-width:520px;width:100%;margin-left:auto;margin-right:auto}
.qhead h2{font-family:'Archivo Black',sans-serif;font-size:16px;color:#fff}
.qx{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:6px 12px;border-radius:var(--r)}
.qx:hover{color:var(--chalk);border-color:var(--team)}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.qmeta b{font-family:'Archivo Black',sans-serif;color:var(--chalk);font-size:13px;letter-spacing:0}
.qbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.qbar i{display:block;height:100%;background:var(--team);transition:width .25s}
.qface{width:150px;height:150px;border-radius:50%;overflow:hidden;margin:0 auto 16px;
  background:#0B1113;border:3px solid var(--team)}
.qface img{width:100%;height:100%;object-fit:cover;object-position:top center}
.qlogo{width:92px;height:92px;margin:0 auto 14px;display:block;object-fit:contain}
.qprompt{text-align:center;font-size:17px;line-height:1.4;margin-bottom:20px;color:var(--chalk)}
.qprompt b{font-family:'Archivo Black',sans-serif;color:#fff;display:block;
  font-size:21px;margin-top:5px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{
  padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);text-align:left;font-size:14.5px;color:var(--chalk);
  transition:.12s;
}
.qopt:hover:not(:disabled){border-color:var(--team);background:#243039}
.qopt:disabled{cursor:default}
.qopt.right{border-color:#5FBF8A;background:color-mix(in srgb,#5FBF8A 16%,transparent);color:#8FE0B4}
.qopt.wrong{border-color:#C98080;background:color-mix(in srgb,#C98080 14%,transparent);color:#E0A4A4}
.qnext{margin-top:16px;width:100%;padding:12px;border-radius:var(--r);
  background:var(--team);color:var(--team2);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.13em;text-transform:uppercase}
.qsetup{display:flex;flex-direction:column;gap:16px}
.qgroup h4{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.qpick{display:flex;gap:6px;flex-wrap:wrap}
.qpick button{
  padding:9px 13px;border:1px solid var(--line);border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mute);
}
.qpick button[aria-pressed="true"]{border-color:var(--team);color:#fff;
  background:color-mix(in srgb,var(--team) 20%,transparent)}
.qdone{text-align:center}
.qdone .big{font-family:'Archivo Black',sans-serif;font-size:46px;color:#fff;line-height:1}
.qdone .sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-top:6px}
.qmiss{margin-top:20px;text-align:left}
.qmiss h4{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.qmissrow{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--rule);font-size:13.5px}
.qmissrow .mf{flex:0 0 26px;height:26px;border-radius:50%;overflow:hidden;background:#0B1113}
.qmissrow .mf img{width:100%;height:100%;object-fit:cover;object-position:top center}
.qmissrow .mt{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* ---------- learn: catch up ---------- */
.cuhead{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.cuhead .big{font-family:'Archivo Black',sans-serif;font-size:25px;color:#fff;line-height:1}
.cuhead .lab{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-top:5px}
.curow{display:flex;align-items:center;gap:10px;padding:7px 0;width:100%;text-align:left;
  border-bottom:1px solid var(--rule)}
.curow:hover .cn{color:#fff}
.curow .cf{flex:0 0 28px;height:28px;border-radius:50%;overflow:hidden;background:#0B1113;
  border:1px solid var(--line)}
.curow .cf img{width:100%;height:100%;object-fit:cover;object-position:top center}
.curow .cn{flex:1 1 auto;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curow .cp{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap}
.curow .cy{font-family:'Archivo Black',sans-serif;font-size:10.5px;color:var(--team)}
.yrpick{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px}
.yrpick button{padding:6px 11px;border:1px solid var(--line);border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--mute)}
.yrpick button[aria-pressed="true"]{border-color:var(--team);color:#fff;
  background:color-mix(in srgb,var(--team) 20%,transparent)}

/* ---------- learn: simple mode ---------- */
body.simple .mv,body.simple .t100,body.simple .stack,body.simple .injdot{display:none}
body.simple #timebar{display:none}

#learnbtn{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--team2);background:var(--team);
  padding:6px 13px;border-radius:var(--r);font-weight:600;
}
#simplebtn{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:5px 10px;border-radius:var(--r);
}
#simplebtn[aria-pressed="true"]{border-color:var(--team);color:var(--chalk)}

/* ---------- live strip ---------- */
/* Three states, three treatments. Only a game actually in progress earns the
   red: dressing a scheduled kickoff as live is alarming and wrong. */
#livebar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:7px 11px;margin-bottom:9px;border-radius:var(--r);
  background:#141C20;border:1px solid var(--line);
}
#livebar.live{
  background:color-mix(in srgb,#C25B5B 12%,transparent);
  border-color:color-mix(in srgb,#C25B5B 35%,transparent);
}
#livebar.final{background:#141C20;border-color:var(--line)}
#livebar .when{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mute);
}
#livebar .vs{font-family:'Archivo Black',sans-serif;font-size:12.5px;color:var(--chalk)}
#livebar.live .livelab{color:#E4A4A4}
#livebar .livelab{color:var(--mute)}
#livebar[hidden]{display:none}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.livedot.on{background:#E05B5B;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.livescore{font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff}
.livelab,.livegame{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;color:#E4A4A4;
}
.livegame{color:var(--mute)}
.chip .livestat{
  position:absolute;top:calc(100% + 19px);left:50%;transform:translateX(-50%);
  pointer-events:none;white-space:nowrap;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;
  letter-spacing:.05em;color:#E05B5B;
}

/* ---------- scores page ---------- */
#scores{position:fixed;inset:0;z-index:72;background:rgba(8,12,14,.97);
  display:flex;flex-direction:column;padding:16px 18px}
#scores[hidden]{display:none}
#scoresnav{flex:0 0 auto;max-width:860px;margin:0 auto 4px;width:100%}
#scoresbody{flex:1 1 auto;overflow-y:auto;max-width:860px;margin:0 auto;width:100%}
.wkstrip{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;
  border-bottom:1px solid var(--line);margin-bottom:12px}
.wkstrip button{
  flex:0 0 auto;width:32px;height:30px;border:1px solid var(--line);
  border-radius:var(--r);font-family:'Barlow Condensed',sans-serif;font-size:12.5px;
  color:var(--mute);
}
.wkstrip button.now{border-color:color-mix(in srgb,var(--brass) 60%,transparent);
  color:var(--brass)}
.wkstrip button[aria-pressed="true"]{border-color:var(--team);color:#fff;
  background:color-mix(in srgb,var(--team) 22%,transparent)}
.wkhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.wkhead .wknum{font-family:'Archivo Black',sans-serif;font-size:17px;color:#fff}
.wkhead .wkmeta{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.daylab{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
.gmrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:5px;background:var(--panel);transition:.12s;
}
.gmrow:hover{border-color:var(--team)}
.gmrow.live{border-color:color-mix(in srgb,#C25B5B 50%,transparent);
  background:color-mix(in srgb,#C25B5B 9%,transparent)}
.gmrow.done{background:#121A1E}
.gside{display:flex;align-items:center;gap:7px;flex:1 1 0;min-width:0}
.gside.home{flex-direction:row-reverse;text-align:right}
.glogo{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
.gname{flex:1 1 auto;font-size:13.5px;color:var(--mute);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.gside.won .gname{color:#fff}
.gscore{font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--chalk);
  min-width:22px;text-align:center}
.gside.won .gscore{color:#5FBF8A}
.gat{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);flex:0 0 auto}
.gmeta{flex:0 0 92px;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
  white-space:nowrap}
.gmeta.hot{color:#E0A4A4}
#scoresbtn{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:5px 10px;border-radius:var(--r);
}
#scoresbtn:hover{color:var(--chalk);border-color:var(--team)}
@media (max-width:560px){
  .gname{font-size:12px}
  .gmeta{flex:0 0 68px;font-size:11px}
  .gat{display:none}
}

/* ---------- reset the chart ---------- */
#resetchart{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;
  color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);
  background:color-mix(in srgb,var(--brass) 12%,transparent);
  padding:4px 10px;border-radius:var(--r);margin-left:10px;white-space:nowrap;
}
#resetchart:hover{background:color-mix(in srgb,var(--brass) 22%,transparent);
  color:#fff}

/* ---------- hold to swap ---------- */
.chip.holding .face{transform:scale(.92);transition:transform .42s ease}
.swap{
  position:absolute;z-index:30;width:212px;max-height:246px;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 14px 34px rgba(0,0,0,.6);padding:6px;
}
.swaphd{display:flex;align-items:baseline;justify-content:space-between;
  padding:4px 6px 7px;border-bottom:1px solid var(--rule);margin-bottom:4px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--team-accent)}
.swapn{color:var(--dim);letter-spacing:.08em}
.swaprow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px;border-radius:2px}
.swaprow:hover{background:#243039}
.swaprow.on{background:color-mix(in srgb,var(--team) 22%,transparent)}
.swapi{flex:0 0 16px;height:16px;border-radius:2px;background:var(--rule);
  color:var(--mute);font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:10px;display:flex;align-items:center;justify-content:center}
.swaprow.on .swapi{background:var(--team);color:var(--team2)}
.swapf{flex:0 0 26px;height:26px;border-radius:50%;overflow:hidden;
  background:#0B1113;border:1px solid var(--line)}
.swapf img{width:100%;height:100%;object-fit:cover;object-position:top center}
.swapnm{flex:1 1 auto;min-width:0}
.swapname{font-size:12.5px;color:var(--chalk);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.swapmeta{font-family:'Barlow Condensed',sans-serif;font-size:10px;
  letter-spacing:.06em;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.swapnote{padding:6px;font-family:'Barlow Condensed',sans-serif;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center;
  border-top:1px solid var(--rule);margin-top:4px}
/* The depth count doubles as the affordance, so make it look tappable. */
.chip .stack{cursor:pointer}

/* ---------- concepts library ---------- */
#concepts{position:fixed;inset:0;z-index:77;background:rgba(8,12,14,.97);
  display:flex;flex-direction:column;padding:16px 18px}
#concepts[hidden]{display:none}
#conceptbtn{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--mute);
  border:1px solid var(--line);padding:5px 10px;border-radius:var(--r)}
#conceptbtn:hover{color:var(--chalk);border-color:var(--team)}
.ctitle{font-family:'Archivo Black',sans-serif;font-size:17px;color:#fff;
  margin-bottom:6px}
.cblurb{font-size:13.5px;line-height:1.55;color:var(--mute);margin-bottom:12px;
  max-width:60ch}
.cfield{position:relative;width:100%;aspect-ratio:5/4;max-width:520px;
  background:var(--field);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0,transparent 9.4%,
    color-mix(in srgb,var(--chalk) 11%,transparent) 9.4%,
    color-mix(in srgb,var(--chalk) 11%,transparent) calc(9.4% + 1px))}
.closs{position:absolute;left:0;right:0;height:2px;
  background:color-mix(in srgb,var(--chalk) 55%,transparent)}
.cdot{position:absolute;transform:translate(-50%,-50%);
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:9.5px;letter-spacing:.04em;z-index:3}
/* Offence light, defence dark: the convention every coaching diagram uses. */
.cdot.o{background:var(--chalk);color:#10171A;border:2px solid var(--chalk)}
.cdot.d{background:transparent;color:#E08A8A;border:2px solid #E08A8A}
.cdot.gap{background:transparent;color:var(--brass);border:1px dashed var(--brass);
  width:20px;height:20px;font-size:10px;z-index:2}
.cdot.hi{box-shadow:0 0 0 4px color-mix(in srgb,var(--brass) 40%,transparent)}
.czone{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  background:color-mix(in srgb,#E08A8A 13%,transparent);
  border:1px dashed color-mix(in srgb,#E08A8A 40%,transparent);z-index:1}
.cball{position:absolute;width:10px;height:10px;z-index:4;
  border-radius:50%/60% 60% 40% 40%;background:var(--brass);
  transform:translate(-50%,-50%) rotate(25deg);
  box-shadow:0 0 9px color-mix(in srgb,var(--brass) 70%,transparent)}
.cctl{margin-top:10px}

/* ---------- lineup game ---------- */
#game{position:fixed;inset:0;z-index:76;background:rgba(8,12,14,.97);
  display:flex;flex-direction:column;padding:14px 16px}
#game[hidden]{display:none}
#gamebody{flex:1 1 auto;overflow-y:auto;max-width:760px;margin:0 auto;width:100%}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.gteam{font-family:'Archivo Black',sans-serif;font-size:15px;color:#fff}
.gsmall{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--mute);
  border:1px solid var(--line);padding:5px 10px;border-radius:var(--r)}
.gsmall:hover{color:var(--chalk);border-color:var(--team)}
#gamebtn{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--team2);
  background:var(--team);padding:5px 12px;border-radius:var(--r);font-weight:600}
.gfield{position:relative;width:100%;aspect-ratio:16/11;min-height:320px;
  background:var(--field);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:12px}
.gturf{position:absolute;inset:0;width:100%;height:100%}
.gslot{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  width:60px;padding:0;
}
.gempty{width:44px;height:44px;border-radius:50%;
  border:2px dashed color-mix(in srgb,var(--chalk) 30%,transparent);
  background:rgba(0,0,0,.25)}
.gslot.over .gempty{border-color:var(--team-accent);background:rgba(255,255,255,.08)}
.gdisc{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#0B1113;
  border:2px solid var(--team-accent)}
.gdisc img{width:100%;height:100%;object-fit:cover;object-position:top center}
.gfb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--dim)}
.gslot.ok .gdisc{border-color:var(--rise)}
.gslot.bad .gdisc{border-color:var(--fall);opacity:.75}
.glab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10.5px;
  letter-spacing:.13em;color:var(--team-accent)}
.gname2{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--chalk);
  white-space:nowrap;max-width:74px;overflow:hidden;text-overflow:ellipsis}
.gtrue{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--rise);
  white-space:nowrap}
.gtray{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel);margin-bottom:8px;min-height:70px}
.gchip{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;
  padding:4px;border-radius:var(--r);border:1px solid transparent}
.gchip:hover{border-color:var(--line)}
.gchip.held{border-color:var(--team-accent);
  background:color-mix(in srgb,var(--team-accent) 18%,transparent)}
.gcf{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#0B1113;
  border:1px solid var(--line)}
.gcf img{width:100%;height:100%;object-fit:cover;object-position:top center}
.gcn{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;color:var(--chalk);
  white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}
.gfoot{margin-top:10px}
.gscore{text-align:center;margin-bottom:10px}
.gscore .gbig{display:block;font-family:'Archivo Black',sans-serif;font-size:26px;
  color:#fff}
.gscore .gsub{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-top:4px}
@media (max-width:560px){
  .gslot{width:50px}
  .gempty,.gdisc{width:36px;height:36px}
  .gname2{font-size:10px;max-width:58px}
  .glab{font-size:9.5px}
}

/* ---------- visual: face wall ---------- */
#wall{position:fixed;inset:0;z-index:73;background:rgba(8,12,14,.97);
  display:flex;flex-direction:column;padding:16px 18px}
#wall[hidden]{display:none}
#wallbody{flex:1 1 auto;overflow-y:auto;max-width:900px;margin:0 auto;width:100%}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:10px;margin-bottom:6px}
.wcard{text-align:center;padding:0}
.wface{position:relative;width:100%;aspect-ratio:1;border-radius:50%;
  overflow:visible;background:#0B1113;border:2px solid var(--line);
  transition:border-color .13s,transform .13s}
.wcard:hover .wface{border-color:var(--team-accent);transform:scale(1.06)}
.wface img{width:100%;height:100%;object-fit:cover;object-position:top center;
  border-radius:50%}
.wfb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Archivo Black',sans-serif;font-size:19px;color:var(--dim)}
.wt100{position:absolute;left:-3px;top:-3px;background:var(--brass);color:#181200;
  font-family:'Archivo Black',sans-serif;font-size:9px;padding:2px 4px;
  border-radius:8px;border:2px solid var(--ink)}
.winj{position:absolute;right:-3px;top:-3px;background:#D06A6A;color:#fff;
  font-size:9px;width:17px;height:17px;border-radius:50%;border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center}
.wn{margin-top:6px;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp2{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.07em;
  color:var(--dim)}

/* ---------- visual: charts ---------- */
svg.chart{width:100%;height:auto;display:block;margin:6px 0 4px;max-width:340px}
.chartnote{font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.chartkey{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 10px}
.chartkey span{display:flex;align-items:center;gap:5px;
  font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim)}
.chartkey i{width:9px;height:9px;border-radius:50%;display:block}
.gapgrid{display:flex;gap:6px;margin:6px 0 4px;max-width:340px}
.gapcol{flex:1 1 0}
.gaphd{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:4px}
.gapcell{border:1px solid var(--line);border-radius:2px;padding:7px 4px;
  margin-bottom:4px;text-align:center}
.gapcell.empty{opacity:.35}
.gapcell.hastd{border-color:var(--brass)}
.gapcell .gn{font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff}
.gapcell .ga{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--dim)}

/* ---------- visual: season strip ---------- */
.sstrip{display:flex;align-items:flex-end;gap:5px;margin:8px 0 4px;height:56px}
.sblockwrap{flex:1 1 0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;height:100%}
.sblock{width:100%;border-radius:2px 2px 0 0;
  background:color-mix(in srgb,var(--team-accent) 45%,transparent)}
.sblock.po{background:color-mix(in srgb,var(--team-accent) 80%,transparent)}
.sblock.sb{background:var(--brass)}
.syr{font-family:'Barlow Condensed',sans-serif;font-size:9.5px;color:var(--dim);
  margin-top:3px}

/* ---------- visual: treemap ---------- */
.tmap{display:flex;gap:3px;height:92px;margin:8px 0 10px;border-radius:var(--r);
  overflow:hidden}
.tcell{position:relative;min-width:26px;display:flex;align-items:flex-end;
  border-radius:2px;overflow:hidden}
.tin{padding:6px;width:100%}
.tg{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:rgba(0,0,0,.72);white-space:nowrap;overflow:hidden}
.tp{font-family:'Archivo Black',sans-serif;font-size:12px;color:rgba(0,0,0,.85)}

/* ---------- visual: play arrows ---------- */
#playlayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  z-index:5}
/* The men involved in the last play, marked on the field. Worth doing even when
   no line can be drawn -- knowing who was involved is most of the value. */
.chip.inplay .face{border-color:var(--rise);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--rise) 30%,transparent)}
.chip.inplay2 .face{border-color:#E0A15B;
  box-shadow:0 0 0 4px color-mix(in srgb,#E0A15B 28%,transparent)}
.chip.inplay,.chip.inplay2{z-index:6}
@keyframes flash{0%{opacity:.25}100%{opacity:.95}}
#playlayer path{animation:flash .45s ease-out}
#facesbtn{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:5px 10px;border-radius:var(--r);
}
#facesbtn:hover{color:var(--chalk);border-color:var(--team)}

/* ---------- watch mode ----------
   Sized for glancing at from across a room, not reading. */
#watch{position:fixed;inset:0;z-index:80;background:var(--ink);
  display:flex;flex-direction:column;padding:12px 14px}
#watch[hidden]{display:none}
.whead{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;flex:0 0 auto}
.wlive{display:flex;align-items:center;gap:7px;
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#E4A4A4}
.wlive i{width:8px;height:8px;border-radius:50%;background:#E05B5B;
  animation:pulse 1.6s ease-in-out infinite}
#watchbody{flex:1 1 auto;overflow-y:auto;max-width:620px;margin:0 auto;width:100%}
.wsc{display:flex;gap:12px;margin-bottom:6px}
.wside{flex:1 1 0;display:flex;align-items:center;gap:10px;padding:12px 14px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.wlogo{width:34px;height:34px;object-fit:contain;flex:0 0 auto}
.wab{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.1em;
  color:var(--mute);flex:1 1 auto}
.wpts{font-family:'Archivo Black',sans-serif;font-size:32px;color:#fff;line-height:1}
.wstat{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.wdd{text-align:center;font-family:'Archivo Black',sans-serif;font-size:24px;
  color:#fff;margin-bottom:10px}
.wfield{position:relative;height:16px;border-radius:3px;background:#1B252B;
  overflow:hidden;margin-bottom:6px}
.wfield .rz{position:absolute;right:0;top:0;bottom:0;width:20%;
  background:color-mix(in srgb,#C25B5B 24%,transparent)}
.wfield .ball{position:absolute;top:2px;bottom:2px;width:4px;border-radius:2px;
  background:var(--brass);transform:translateX(-50%)}
.wfl{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  margin-bottom:14px}
.wfl .hot{color:#E0A4A4}
.wwp{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.wfeed{border-top:1px solid var(--line);padding-top:10px}
.wplay{padding:10px 0;border-bottom:1px solid var(--rule)}
.wplay:last-child{border-bottom:0}
.wplay.score{background:color-mix(in srgb,var(--rise) 9%,transparent);
  margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:var(--r)}
.wpm{display:flex;gap:10px;margin-bottom:4px;
  font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}
.wpm .wpt{color:var(--team-accent);font-weight:700}
.wpm .wpd{margin-left:auto}
.ptext{font-size:14.5px;line-height:1.5;color:var(--chalk)}
/* A name you can tap is the entire point of this view. */
.pname2{font-size:14.5px;line-height:1.5;color:var(--team-accent);font-weight:600;
  border-bottom:1px dotted color-mix(in srgb,var(--team-accent) 55%,transparent);
  padding:0}
.pname2:hover{color:#fff}
#watchbtn{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--team2);background:#D06A6A;
  padding:5px 12px;border-radius:var(--r);font-weight:600;
}
#watchbtn[hidden]{display:none}

/* ---------- play animation ---------- */
.awrap{margin-bottom:16px}
.ahead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.alabel{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.areplay{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);border:1px solid var(--line);
  padding:4px 10px;border-radius:var(--r)}
.areplay:hover{color:var(--chalk);border-color:var(--team)}
.afield{position:relative;width:100%;aspect-ratio:5/4;background:var(--field);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0, transparent 9.4%,
    color-mix(in srgb,var(--chalk) 12%,transparent) 9.4%,
    color-mix(in srgb,var(--chalk) 12%,transparent) calc(9.4% + 1px))}
.afield.shake{animation:shake .45s}
@keyframes shake{
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)}
  75%{transform:translateX(3px)}}
.adot{position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  width:34px;z-index:2}
.aface{width:28px;height:28px;border-radius:50%;overflow:hidden;background:#0B1113;
  border:2px solid var(--team-accent)}
.aface img{width:100%;height:100%;object-fit:cover;object-position:top center}
.afb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;
  color:var(--dim)}
.alab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8.5px;
  letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.aball{position:absolute;width:11px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:var(--brass);transform:translate(-50%,-50%) rotate(28deg);
  z-index:3;box-shadow:0 0 10px color-mix(in srgb,var(--brass) 70%,transparent)}
.aball.miss{background:var(--mute);box-shadow:none;opacity:.6}
.aball.pick{background:var(--fall);box-shadow:0 0 10px color-mix(in srgb,var(--fall) 70%,transparent)}
.acap{font-size:12.5px;line-height:1.45;color:var(--chalk);margin-top:8px}
.anote{font-size:11.5px;line-height:1.45;color:var(--dim);margin-top:6px}

/* ---------- conditions ---------- */
.wxbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel)}
.wxbox.rough{border-color:color-mix(in srgb,#E0A15B 45%,transparent);
  background:color-mix(in srgb,#E0A15B 10%,transparent)}
.wxbox.indoors{color:var(--dim)}
.wxi{font-size:15px}
.wxv{font-family:'Archivo Black',sans-serif;font-size:17px;color:#fff}
.wxt{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mute)}
.wxs{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim)}
.wxn{flex:1 1 100%;font-size:12px;color:#E0B48A;line-height:1.4}
.drift{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.drift span{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--team-accent)}
.curow .trn{font-family:'Archivo Black',sans-serif;font-size:11px;color:var(--rise)}

/* ---------- defensive credit ---------- */
.dcred{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dtag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
  border-radius:10px;background:var(--rule);
  border:1px solid transparent}
.dtag.big{background:color-mix(in srgb,#E0A15B 16%,transparent);
  border-color:color-mix(in srgb,#E0A15B 45%,transparent)}
.dlab{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim)}
.dtag.big .dlab{color:#E0B48A}
.dnm2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;
  color:var(--chalk);padding:0;border-bottom:1px dotted color-mix(in srgb,var(--chalk) 40%,transparent)}
.dnm2.plain{border-bottom:0;color:var(--mute)}
.dnm2:hover{color:#fff}
.wsub{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin:4px 0 6px}
.dlead{margin-bottom:14px}
.dlrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:6px 0;border-bottom:1px solid var(--rule)}
.dlrow:last-child{border-bottom:0}
.dlrow:hover .dln{color:#fff}
.dlt{flex:0 0 32px;font-family:'Archivo Black',sans-serif;font-size:10px;
  color:var(--team-accent)}
.dln{flex:1 1 auto;font-size:13px;color:var(--chalk);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.dls{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap}

/* ---------- game preview ---------- */
#prev{position:fixed;inset:0;z-index:74;background:rgba(8,12,14,.97);
  display:flex;flex-direction:column;padding:16px 18px}
#prev[hidden]{display:none}
#prevbody{flex:1 1 auto;overflow-y:auto;max-width:760px;margin:0 auto;width:100%}
.oddsbox{display:flex;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.oddscell{flex:1 1 0;min-width:96px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel)}
.oddscell .ol{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.oddscell .ov{font-family:'Archivo Black',sans-serif;font-size:17px;color:#fff}
.oddscell .ov.small{font-size:12px;color:var(--mute);font-family:'Barlow Condensed',sans-serif;
  letter-spacing:.06em}
table.boxteam td.edge{color:var(--rise)}
.h2hline{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel)}
.h2hline .hn{display:block;font-family:'Archivo Black',sans-serif;font-size:13.5px;color:#fff}
.h2hline .hm{display:block;margin-top:4px;font-family:'Barlow Condensed',sans-serif;
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.mu{display:flex;align-items:stretch;gap:8px;margin-top:8px}
.muside{flex:1 1 0;display:flex;align-items:center;gap:9px;min-width:0;
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);text-align:left}
.muside.r{flex-direction:row-reverse;text-align:right}
.muside:hover{border-color:var(--team)}
.muf{flex:0 0 34px;height:34px;border-radius:50%;overflow:hidden;background:#0B1113;
  border:1px solid var(--line)}
.muf img{width:100%;height:100%;object-fit:cover;object-position:top center}
.mut{flex:1 1 auto;min-width:0}
.mun{font-size:13.5px;color:var(--chalk);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.mus{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);margin-top:2px}
.mut100{font-family:'Archivo Black',sans-serif;font-size:10.5px;color:var(--brass);
  flex:0 0 auto}
.mut100.hurt{color:#E0A15B;font-size:13px}
.muvs{align-self:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex:0 0 auto}
.mucap{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin:5px 0 10px;text-align:center}
@media (max-width:520px){
  .mu{flex-direction:column;gap:4px}
  .muside.r{flex-direction:row;text-align:left}
  .muvs{align-self:flex-start;padding-left:12px}
}

/* ---------- standings ---------- */
table.car td.form{white-space:nowrap}
table.car td.form i{
  display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:2px;margin-right:2px;font-style:normal;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
}
td.form i.fW{background:color-mix(in srgb,var(--rise) 26%,transparent);color:var(--rise)}
td.form i.fL{background:color-mix(in srgb,var(--fall) 22%,transparent);color:var(--fall)}
td.form i.fT{background:var(--rule);color:var(--mute)}

/* ---------- current season ---------- */
.seasontag{
  display:inline-block;margin-left:8px;padding:1px 6px;border-radius:2px;
  background:color-mix(in srgb,var(--team) 26%,transparent);
  color:var(--team-accent);font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:10px;letter-spacing:.09em;
}

/* ---------- injury report ---------- */
.injgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
@media (max-width:560px){ .injgrid{grid-template-columns:1fr} }
.injcol h5{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--mute);
  padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.injrow{display:flex;align-items:center;gap:9px;padding:6px 0;width:100%;
  text-align:left;border-bottom:1px solid var(--rule)}
.injrow:last-child{border-bottom:0}
.injrow:hover .in2{color:#fff}
.injrow .idot{flex:0 0 7px;height:7px;border-radius:50%;background:var(--dim)}
.injrow.s5 .idot,.injrow.s4 .idot{background:#D06A6A}
.injrow.s3 .idot{background:#E0A15B}
.injrow.s2 .idot{background:#D9B84A}
.injrow.s1 .idot{background:#6E8F84}
.injrow .in2{flex:1 1 auto;font-size:13px;color:var(--chalk);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.injrow .ip{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.injrow .is{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--mute);
  white-space:nowrap;text-align:right}
.injrow.s5 .is,.injrow.s4 .is{color:#E4A4A4}
.injnone{font-size:12.5px;color:var(--dim);padding:6px 0}

/* ---------- box score popup ---------- */
#box{position:fixed;inset:0;z-index:75;background:rgba(8,12,14,.97);
  display:flex;flex-direction:column;padding:16px 18px}
#box[hidden]{display:none}
#boxbody{flex:1 1 auto;overflow-y:auto;max-width:860px;margin:0 auto;width:100%}
.boxscore-line{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.boxscore-line .bt{font-family:'Archivo Black',sans-serif;font-size:17px;color:#fff}
.boxscore-line .bd{color:var(--dim)}
.boxscore-line .bs{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.boxtabs{display:flex;gap:6px;margin:14px 0 4px}
.boxtabs button{
  padding:7px 14px;border:1px solid var(--line);border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mute);
}
.boxtabs button[aria-pressed="true"]{border-color:var(--team);color:#fff;
  background:color-mix(in srgb,var(--team) 20%,transparent)}
table.boxteam td.mid{text-align:center;font-family:'Barlow Condensed',sans-serif;
  font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
table.car td.bxname{max-width:170px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--mute)}
table.car td.bxname.link{color:var(--chalk);cursor:pointer}
table.car td.bxname.link:hover{color:#fff;text-decoration:underline}
/* The score is a button now, so it has to look like one. */
.scoreclick{cursor:pointer;border-bottom:1px dotted color-mix(in srgb,#fff 35%,transparent)}
.scoreclick:hover{color:#fff}

/* ---------- live game panel ---------- */
#livebar .dd{font-family:'Archivo Black',sans-serif;font-size:11.5px;color:#fff;
  padding:2px 7px;border-radius:2px;background:rgba(255,255,255,.09)}
#livebar .wp{font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.gsc{display:flex;align-items:baseline;gap:10px;margin:2px 0 10px}
.gsc .t{font-family:'Archivo Black',sans-serif;font-size:19px;color:#fff}
.gsc .d{color:var(--dim)}
.ddbig{font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--chalk);
  margin-bottom:8px}
/* The field position bar is deliberately separate from the formation diagram.
   The formation shows who lines up where; it is not a scale map of the field,
   so spotting a real yard line on it would misrepresent both. */
.fieldbar2{position:relative;height:12px;border-radius:2px;background:var(--rule);
  overflow:hidden;margin-bottom:6px}
.fieldbar2 .rz{position:absolute;right:0;top:0;bottom:0;width:20%;
  background:color-mix(in srgb,#C25B5B 22%,transparent)}
.fieldbar2 .ball{position:absolute;top:1px;bottom:1px;width:3px;border-radius:2px;
  background:var(--brass);transform:translateX(-50%)}
.fblab{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.fblab .hot{color:#E0A4A4}
.lastplay{margin-top:9px;font-size:12.5px;line-height:1.45;color:var(--mute)}
.drv{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--rule)}
.drv:last-of-type{border-bottom:0}
.drv .dt{flex:0 0 34px;font-family:'Archivo Black',sans-serif;font-size:10.5px;color:var(--dim)}
.drv .dr2{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--chalk)}
.drv.score .dr2{color:#5FBF8A}
.drv .dm{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--dim);
  white-space:nowrap}
/* A player confirmed on the field today, as opposed to merely projected there. */
.chip.played .face{border-color:#5FBF8A}
.vsusual{display:flex;align-items:center;gap:9px;padding:6px 0;
  border-bottom:1px solid var(--rule);font-size:13px}
.vsusual:last-of-type{border-bottom:0}
.vsusual .k{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.vsusual .now{font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff}
.vsusual .cmp2{flex:0 0 96px;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.06em;color:var(--dim)}
.vsusual .cmp2.up{color:#5FBF8A} .vsusual .cmp2.dn{color:#8C6A6A}

/* ---------- time scrubber ---------- */
#timebar{
  display:flex;align-items:center;gap:11px;padding:7px 0 9px;
  border-bottom:1px solid var(--line);margin-bottom:9px;
}
#timebar[hidden]{display:none}
#time{
  flex:1 1 auto;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
  background:var(--line);outline:none;
}
#time::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--team);border:2px solid var(--ink);cursor:pointer;
}
#time::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;background:var(--team);
  border:2px solid var(--ink);cursor:pointer;border-width:2px;
}
#timelab{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);white-space:nowrap;min-width:96px;
}
#timelab b{color:var(--chalk);font-family:'Archivo Black',sans-serif;font-size:11.5px;
  letter-spacing:0}
#timenow{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);border:1px solid var(--line);
  padding:4px 9px;border-radius:var(--r);white-space:nowrap;
}
#timenow:hover{color:var(--chalk);border-color:var(--team)}
#timenow[hidden]{display:none}
.past #field{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brass) 40%,transparent)}

/* ---------- comparables ---------- */
.comp{display:flex;align-items:center;gap:10px;padding:7px 0;width:100%;text-align:left;
  border-bottom:1px solid var(--rule)}
.comp:last-of-type{border-bottom:0}
.comp:hover .cn{color:#fff}
.comp .cf{
  flex:0 0 30px;height:30px;border-radius:50%;overflow:hidden;background:#0B1113;
  border:1px solid var(--line);
}
.comp .cf img{width:100%;height:100%;object-fit:cover;object-position:top center}
.comp .cn{flex:1 1 auto;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp .ct2{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap}

/* ---------- trade ---------- */
.tradebox{max-width:760px;margin:0 auto;width:100%}
.tradehdr{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tradehdr .who{font-family:'Archivo Black',sans-serif;font-size:16px;color:#fff}
.tradearrow{color:var(--team);font-size:16px}
.tradegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){ .tradegrid{grid-template-columns:1fr} }
.tradecol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tradecol h4{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--mute);padding-bottom:7px;
  border-bottom:1px solid var(--line);margin-bottom:9px;
}
.delta{font-family:'Archivo Black',sans-serif;font-size:13px}
.delta.pos{color:#5FBF8A} .delta.neg{color:#C98080}

/* ---------- draft capital ---------- */
.rdbar{display:flex;height:11px;border-radius:2px;overflow:hidden;margin:8px 0 10px;background:var(--rule)}
.rdbar i{display:block;height:100%}
.rdkey{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.rdkey span{display:flex;align-items:center;gap:5px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim)}
.rdkey i{width:8px;height:8px;border-radius:2px;display:block}
.drafted{
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin-top:8px;
}
.drafted b{color:var(--chalk);font-weight:600}
.drafted .own{color:var(--team-accent)}

/* ---------- head to head ---------- */
.gm .h2h{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.06em;
  color:var(--dim);white-space:nowrap;min-width:44px;text-align:right;
}
.gm .h2h.up{color:#5FBF8A} .gm .h2h.dn{color:#8C6A6A}

/* ---------- team history ---------- */
.hsum{display:flex;align-items:flex-end;gap:14px;padding-bottom:10px;
  border-bottom:1px solid var(--rule);margin-bottom:8px;flex-wrap:wrap}
.hsum .big{font-family:'Archivo Black',sans-serif;font-size:23px;line-height:1;color:#fff}
.hsum .lab{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-top:5px}
.hsum .rk{margin-left:auto;text-align:right;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.hsum .rk b{font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--chalk);
  display:block;letter-spacing:0;margin-bottom:2px}
.wins{display:flex;align-items:flex-end;gap:3px;height:40px;margin:10px 0 4px}
.wins i{flex:1 1 0;background:color-mix(in srgb,var(--team) 50%,transparent);
  border-radius:1px 1px 0 0;min-height:3px}
.wins i.po{background:color-mix(in srgb,var(--team) 85%,#fff)}
.wins i.sb{background:var(--brass)}
table.hist td.fin{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left}
table.hist td.fin.po{color:var(--chalk)}
table.hist td.fin.sb{color:var(--brass);font-weight:700}
table.hist td.co{text-align:left;font-size:11.5px;color:var(--dim);
  max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- position battles ---------- */
.bat{border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-bottom:9px}
.bat .bh{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.bat .bp{font-family:'Archivo Black',sans-serif;font-size:12.5px;color:#fff}
.bat .bm{
  margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
}
.bat .bm.hot{color:#E0B04A}
.batman{display:flex;align-items:center;gap:9px;padding:4px 0;width:100%;text-align:left}
.batman:hover .bn{color:#fff}
.batman .bi{
  flex:0 0 18px;height:18px;border-radius:2px;background:var(--rule);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10.5px;
  color:var(--mute);display:flex;align-items:center;justify-content:center;
}
.batman:first-of-type .bi{background:var(--team);color:var(--team2)}
.batman .bn{flex:1 1 auto;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batman .bs{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
