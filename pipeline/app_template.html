        tr.append(c1, c2, c3); tb.appendChild(tr);
      });
      t.appendChild(tb);
      const w = el("div","carwrap"); w.appendChild(t); body.appendChild(w);
    }
  }

  // Team switcher
  const tabs = el("div","boxtabs");
  LIVE.box.forEach(b=>{
    const btn = el("button", null, (DATA.teams[b.team] || {}).nick || b.team);
    btn.setAttribute("aria-pressed", b.team === boxTeam);
    btn.onclick = () => { boxTeam = b.team; renderBox(); };
    tabs.appendChild(btn);
  });
  body.appendChild(tabs);

  const side = LIVE.box.find(b => b.team === boxTeam);
  if(!side){ body.appendChild(el("div","carnote","No box score for that side yet.")); return; }

  side.cats.forEach(cat=>{
    body.appendChild(el("div","advsub", cat.label || cat.name));
    const w = el("div","carwrap");
    const t = document.createElement("table");
    t.className = "car";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    const th0 = document.createElement("th");
    th0.textContent = "Player"; th0.style.textAlign = "left";
    hr.appendChild(th0);
    cat.labels.forEach(l=>{
      const th = document.createElement("th");
      th.textContent = l;
      hr.appendChild(th);
    });
    thead.appendChild(hr); t.appendChild(thead);
    const tb = document.createElement("tbody");
    cat.rows.forEach(r=>{
      const tr = document.createElement("tr");
      const nameCell = document.createElement("td");
      nameCell.className = "tm bxname";
      // Only link players we actually hold; the rest are plain text.
      const mine = r.eid && Object.values(DATA.players).find(p => p.eid === r.eid);
      nameCell.textContent = r.name + (r.pos ? "  " + r.pos : "");
      if(mine){
        nameCell.classList.add("link");
        nameCell.onclick = () => { closeBox(); goPlayer(mine.id); };
      }
      tr.appendChild(nameCell);
      cat.labels.forEach((_l,i)=>{
        const td = document.createElement("td");
        td.textContent = r.stats[i] ?? "\u2013";
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb); w.appendChild(t); body.appendChild(w);
  });

  const n = el("div","carnote");
  n.textContent = "Live from ESPN. Names in white are on a depth chart in this "
    + "app \u2014 tap one to open his profile.";
  body.appendChild(n);
  body.scrollTop = 0;
}

/* ---------------- live play feed ----------------
   Play text arrives as "J.Hurts pass short right to D.Smith for 8 yards." The
   whole point of this app is knowing who those people are, so every name that
   matches somebody on either roster becomes a link to his profile.

   Names are matched as first-initial + surname against the two teams playing,
   not the whole league, which keeps collisions rare. Where a team really does
   have two players sharing a key, the one higher on the depth chart wins --
   announcers mean the starter far more often than his backup. */
let feedIndex = null, feedFor = null;

function buildFeedIndex(teamsInGame){
  const idx = {};
  teamsInGame.forEach(tm=>{
    (DATA.depth[tm] || []).forEach(r=>{
      const p = DATA.players[r.pid];
      if(!p) return;
      const parts = p.name.trim().split(/\s+/);
      if(parts.length < 2) return;
      const last = parts.slice(1).join(" ")
        .replace(/\s+(Jr\.?|Sr\.?|II|III|IV|V)$/i, "");
      const key = (parts[0][0] + "." + last).toLowerCase();
      const cur = idx[key];
      if(!cur || r.rank < cur.rank) idx[key] = {pid: p.id, rank: r.rank};
    });
  });
  return idx;
}

/* Split play text into plain words and player links. Built as DOM nodes rather
   than markup, so nothing from the feed is ever interpreted as HTML. */
function playText(text, idx){
  const wrap = el("span","ptext");
  // Matches D.Smith, T.J.Watt, D.Smith-Jones, Ja'Marr style surnames.
  const re = /\b([A-Z][A-Za-z]?\.(?:[A-Z]\.)?[A-Z][A-Za-z'’-]+)/g;
  let last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) wrap.appendChild(document.createTextNode(text.slice(last, m.index)));
    const raw = m[1];
    const key = raw.toLowerCase().replace(/^([a-z])\.[a-z]\./, "$1.");
    const hit = idx[key] || idx[raw.toLowerCase()];
    if(hit && DATA.players[hit.pid]){
      const a = el("button","pname2", raw);
      a.onclick = (e) => {
        e.stopPropagation();
        closeWatch(); $("#box").hidden = true; $("#scores").hidden = true;
        goPlayer(hit.pid);
      };
      wrap.appendChild(a);
    } else {
      wrap.appendChild(document.createTextNode(raw));
    }
    last = m.index + raw.length;
  }
  if(last < text.length) wrap.appendChild(document.createTextNode(text.slice(last)));
  return wrap;
}

/* Pull the play list out of a summary payload. Drives hold plays; shapes vary,
   so everything is read defensively and anything unrecognised is skipped. */
function extractPlays(j){
  const dr = j.drives || {};
  const all = [...(dr.previous || [])];
  if(dr.current) all.push(dr.current);
  const out = [];
  all.forEach(d=>{
    const tm = normTeam(((d.team || {}).abbreviation) || "");
    (d.plays || []).forEach(p=>{
      const txt = p.text || (p.type || {}).text;
      if(!txt) return;
      out.push({
        team: tm,
        text: txt,
        clock: ((p.clock || {}).displayValue) || null,
        period: ((p.period || {}).number) || null,
        score: p.scoringPlay ? ((p.awayScore ?? "") + "-" + (p.homeScore ?? "")) : null,
        scoring: !!p.scoringPlay,
        down: p.start ? p.start.downDistanceText : null,
      });
    });
  });
  return out.reverse();          // newest first
}

async function fetchPlays(gameId){
  try {
    const j = await getJSON("/summary?event=" + gameId);
    LIVE.plays = extractPlays(j);
    return true;
  } catch(e){ LIVE.plays = []; return false; }
}

/* ---------------- face wall ----------------
   The field diagram explains structure. Structure is not the hard part when you
   are learning a league -- faces are. This is every player on a roster as a
   photograph, grouped by position, with nothing else competing for attention. */
const WALL_GROUPS = [
  ["QB", ["QB"]], ["Running backs", ["RB","FB"]], ["Receivers", ["WR"]],
  ["Tight ends", ["TE"]], ["Offensive line", ["T","G","C","OL","OT","OG"]],
  ["Defensive line", ["DE","DT","NT","DL"]],
  ["Linebackers", ["LB","ILB","OLB","MLB"]],
  ["Defensive backs", ["CB","S","SS","FS","DB"]],
  ["Specialists", ["K","PK","P","LS"]],
];

function renderWall(host){
  const rows = DATA.depth[team] || [];
  const best = {};
  rows.forEach(r=>{
    const cur = best[r.pid];
    if(!cur || r.rank < cur) best[r.pid] = r.rank;
  });
  const roster = Object.keys(best)
    .map(pid => DATA.players[pid]).filter(Boolean);

  WALL_GROUPS.forEach(([label, positions])=>{
    const mine = roster.filter(p => positions.includes(p.pos))
      .sort((a,b) => (best[a.id] - best[b.id]) || a.name.localeCompare(b.name));
    if(!mine.length) return;
    host.appendChild(el("div","advsub", label + "  \u00b7  " + mine.length));
    const grid = el("div","wall");
    mine.forEach(p=>{
      const c = el("button","wcard");
      const f = el("div","wface");
      const im = faceImg(p, 192, {lazy: true});
      if(im) f.appendChild(im);
      else f.appendChild(el("div","wfb", p.num == null ? "\u2013" : String(p.num)));
      if(p.t100) f.appendChild(el("span","wt100", "#" + p.t100));
      if(p.inj && p.inj.sev >= 3) f.appendChild(el("span","winj","\u26A0"));
      c.appendChild(f);
      c.appendChild(el("div","wn", shortName(p.name)));
      c.appendChild(el("div","wp2",
        (p.num != null ? "#" + p.num + "  " : "") + p.pos));
      c.onclick = () => { $("#wall").hidden = true; goPlayer(p.id); };
      grid.appendChild(c);
    });
    host.appendChild(grid);
  });

  const n = el("div","carnote");
  n.textContent = "Everyone on the depth chart, starters first within each group. "
    + "Tap a face for the full profile.";
  host.appendChild(n);
}

/* ---------------- target chart ----------------
   Every pass thrown at a receiver, plotted by how far downfield it travelled and
   which third of the field it went to. Filled means caught. The scatter shows a
   role that no stat line does. */
function targetChart(p){
  const t = p.tgt;
  if(!t || !t.pts.length) return null;
  const W = 300, H = 240, PAD = 26;
  const depths = t.pts.map(x => x[0]);
  const lo = Math.min(-6, Math.floor(Math.min(...depths) / 5) * 5);
  const hi = Math.max(22, Math.ceil(Math.max(...depths) / 5) * 5);
  const y = d => PAD + (hi - d) / (hi - lo) * (H - PAD * 2);
  const x = dir => PAD + (dir + 0.5) / 3 * (W - PAD * 2);

  const bits = [];
  bits.push(`<rect x="${PAD}" y="${PAD}" width="${W-PAD*2}" height="${H-PAD*2}"
    fill="var(--field)" stroke="var(--line)"/>`);
  // depth guides every ten yards, plus the line of scrimmage
  for(let d = Math.ceil(lo/10)*10; d <= hi; d += 10){
    const yy = y(d);
    const los = d === 0;
    bits.push(`<line x1="${PAD}" y1="${yy}" x2="${W-PAD}" y2="${yy}"
      stroke="${los ? "var(--team-accent)" : "var(--chalk)"}"
      stroke-opacity="${los ? .7 : .16}" stroke-width="${los ? 1.6 : 1}"
      ${los ? "" : 'stroke-dasharray="3 4"'}/>`);
    bits.push(`<text x="${PAD-5}" y="${yy+3}" text-anchor="end"
      font-family="Barlow Condensed" font-size="9" fill="var(--dim)">${d}</text>`);
  }
  ["Left","Middle","Right"].forEach((lab,i)=>{
    bits.push(`<text x="${x(i)}" y="${H-PAD+13}" text-anchor="middle"
      font-family="Barlow Condensed" font-size="9" letter-spacing="1"
      fill="var(--dim)">${lab.toUpperCase()}</text>`);
    if(i) bits.push(`<line x1="${PAD+i*(W-PAD*2)/3}" y1="${PAD}"
      x2="${PAD+i*(W-PAD*2)/3}" y2="${H-PAD}" stroke="var(--chalk)"
      stroke-opacity=".1"/>`);
  });
  // Jitter horizontally so overlapping targets stay countable.
  t.pts.forEach((pt, i)=>{
    const [d, dir, f] = pt;
    const jx = x(dir) + ((i * 37) % 40 - 20) * 0.9;
    const caught = f & 1, td = f & 2, pick = f & 4;
    const fill = td ? "var(--brass)" : pick ? "var(--fall)"
               : caught ? "var(--team-accent)" : "none";
    bits.push(`<circle cx="${jx.toFixed(1)}" cy="${y(d).toFixed(1)}"
      r="${td ? 4.5 : 3.4}" fill="${fill}"
      stroke="${td ? "var(--brass)" : pick ? "var(--fall)" : "var(--team-accent)"}"
      stroke-width="1.2" opacity="${caught || td ? .95 : .55}"/>`);
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img"
    aria-label="Target chart">${bits.join("")}</svg>`;
}

/* ---------------- run gap chart ----------------
   Nine buckets, so a grid says more than a scatter would. */
function runChart(p){
  const r = p.run;
  if(!r || !r.cells.length) return null;
  const order = ["end","tackle","guard","middle"];
  const cells = {};
  r.cells.forEach(c=>{ cells[c.loc + "|" + c.gap] = c; });
  const max = Math.max(...r.cells.map(c => c.n));
  const wrap = el("div","gapgrid");
  [0,1,2].forEach(loc=>{
    const col = el("div","gapcol");
    col.appendChild(el("div","gaphd", ["Left","Middle","Right"][loc]));
    order.forEach(gap=>{
      const c = cells[loc + "|" + gap];
      const cell = el("div","gapcell");
      if(c){
        const strength = c.n / max;
        cell.style.background =
          `color-mix(in srgb, var(--team-accent) ${Math.round(12 + strength*58)}%, transparent)`;
        cell.appendChild(el("div","gn", String(c.n)));
        cell.appendChild(el("div","ga", c.avg + " avg"));
        cell.title = c.n + " carries through the " + gap + ", " + c.avg
          + " a go" + (c.td ? ", " + c.td + " touchdowns" : "");
        if(c.td) cell.classList.add("hastd");
      } else {
        cell.classList.add("empty");
        cell.appendChild(el("div","gn","\u2013"));
      }
      col.appendChild(cell);
    });
    wrap.appendChild(col);
  });
  return wrap;
}

/* ---------------- career arc ----------------
   The table gives you the numbers; this gives you the shape. A rise, a peak, an
   injury year -- those read instantly as a line and slowly as rows. */
function careerChart(p, key, label){
  const rows = (p.car || []).filter(r => r[key] != null);
  if(rows.length < 3) return null;
  const W = 300, H = 130, L = 30, R = 8, T = 12, B = 20;
  const vals = rows.map(r => r[key]);
  const max = Math.max(...vals), min = Math.min(0, Math.min(...vals));
  const x = i => L + (rows.length === 1 ? 0 : i / (rows.length - 1)) * (W - L - R);
  const y = v => T + (1 - (v - min) / ((max - min) || 1)) * (H - T - B);
  const peak = vals.indexOf(max);

  const bits = [];
  [min, (min + max) / 2, max].forEach(v=>{
    bits.push(`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"
      stroke="var(--chalk)" stroke-opacity=".1" stroke-dasharray="3 4"/>`);
    bits.push(`<text x="${L-5}" y="${y(v)+3}" text-anchor="end"
      font-family="Barlow Condensed" font-size="9"
      fill="var(--dim)">${Math.round(v).toLocaleString()}</text>`);
  });
  const pts = rows.map((r,i)=>`${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join(" ");
  bits.push(`<polyline points="${pts}" fill="none" stroke="var(--team-accent)"
    stroke-width="2" stroke-linejoin="round"/>`);
  rows.forEach((r,i)=>{
    const top = i === peak;
    bits.push(`<circle cx="${x(i).toFixed(1)}" cy="${y(r[key]).toFixed(1)}"
      r="${top ? 4.5 : 3}" fill="${top ? "var(--rise)" : "var(--ink)"}"
      stroke="${top ? "var(--rise)" : "var(--team-accent)"}" stroke-width="1.6"/>`);
    if(i === 0 || i === rows.length - 1 || top)
      bits.push(`<text x="${x(i)}" y="${H-6}" text-anchor="middle"
        font-family="Barlow Condensed" font-size="9"
        fill="var(--dim)">'${String(r.y).slice(-2)}</text>`);
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img"
    aria-label="${label} by season">${bits.join("")}</svg>`;
}

/* ---------------- season strip ----------------
   One block per game, coloured by result and sized by margin, so a season reads
   as a pattern rather than a list. */
function seasonStrip(seasons){
  const wrap = el("div","sstrip");
  seasons.forEach(s=>{
    const cell = el("div","sblock" + (s.champ ? " sb" : s.playoff ? " po" : ""));
    const diff = (s.pf || 0) - (s.pa || 0);
    const h = Math.max(14, Math.min(46, 30 + diff / 6));
    cell.style.height = h + "px";
    cell.title = s.y + ": " + s.rec + (s.fin !== "\u2013" ? " \u00b7 " + s.fin : "")
      + " \u00b7 " + (diff > 0 ? "+" : "") + diff + " points";
    const w = el("div","sblockwrap");
    w.appendChild(cell);
    w.appendChild(el("div","syr", "'" + String(s.y).slice(-2)));
    wrap.appendChild(w);
  });
  return wrap;
}

/* ---------------- cap treemap ----------------
   Area reads proportion better than a stacked bar does, and money is a
   proportion question. Squarified enough to be readable without being fussy. */
function capTreemap(groups, cols){
  const total = groups.reduce((a,g) => a + g.m, 0) || 1;
  const wrap = el("div","tmap");
  groups.forEach((g,i)=>{
    const cell = el("div","tcell");
    cell.style.flexGrow = String(Math.max(0.06, g.m / total));
    cell.style.background = cols[i % cols.length];
    cell.title = g.g + ": $" + g.m.toFixed(1) + "M (" + g.pct + "%)";
    const inner = el("div","tin");
    inner.appendChild(el("div","tg", g.g));
    inner.appendChild(el("div","tp", g.pct + "%"));
    cell.appendChild(inner);
    wrap.appendChild(cell);
  });
  return wrap;
}

/* ---------------- live play arrows ----------------
   Draw the play you just read onto the formation. Direction comes from the play
   text, depth from the yardage, so this is a sketch of what happened rather than
   a tracking replay -- which is all the text supports. */
/* ---------------- live play, drawn on the formation ----------------
   The first version guessed: a fixed start point, a direction from the word
   "left", and a length from the yardage. It ignored the one thing this app
   actually has, which is every player's position on the field.

   This version reads the participants out of the play text, finds their chips
   where they are actually rendered, and draws between them. If the men involved
   are not on the view you are looking at -- wrong team, wrong unit, a backup who
   is not on the chart -- it draws nothing rather than inventing a line. */

function playParticipants(text){
  if(!text) return null;
  const t = text;
  const NAME = "[A-Z][A-Za-z]?\\.(?:[A-Z]\\.)?[A-Z][A-Za-z'’-]+";
  const grab = re => { const m = t.match(re); return m ? m[1] : null; };

  const out = {kind: null, from: null, to: null, defender: null,
               td: /TOUCHDOWN/i.test(t), turnover: /INTERCEPTED|FUMBLES/i.test(t),
               yards: null, incomplete: /pass incomplete/i.test(t)};

  const y = t.match(/for (-?\d+) yard/);
  if(y) out.yards = parseInt(y[1], 10);
  if(/for no gain/i.test(t)) out.yards = 0;

  // A sack is a pass play that never left the pocket.
  if(/\bsacked\b/i.test(t)){
    out.kind = "sack";
    out.from = grab(new RegExp("(" + NAME + ")\\s+sacked"));
    out.defender = grab(new RegExp("sacked[^()]*\\((" + NAME + ")"));
    return out.from ? out : null;
  }
  if(/\bpass\b/i.test(t)){
    out.kind = "pass";
    out.from = grab(new RegExp("(" + NAME + ")\\s+pass"));
    // Completions say "to", incompletions and picks say "intended for".
    out.to = grab(new RegExp("(?:to|intended for)\\s+(" + NAME + ")"));
    out.defender = grab(new RegExp("INTERCEPTED by (?:[A-Z]{2,3}-)?(" + NAME + ")"))
                || grab(new RegExp("\\((" + NAME + ")\\)\\s*\\.?\\s*$"));
    return out.from ? out : null;
  }
  // Runs read as "left tackle", "right end" and so on, but a middle run is just
  // "up the middle" with no gap word after it, which an earlier version missed.
  if(/(left|right)\s+(end|tackle|guard)|up the middle|scramble|kneel|\brushed\b/i.test(t)){
    out.kind = "run";
    out.from = grab(new RegExp("^(?:\\([^)]*\\)\\s*)?(" + NAME + ")"));
    out.defender = grab(new RegExp("\\((" + NAME + ")[^)]*\\)\\s*\\.?\\s*$"));
    // Direction only matters when the runner has nobody to run toward.
    out.dir = /left/i.test(t) ? -1 : /right/i.test(t) ? 1 : 0;
    return out.from ? out : null;
  }
  return null;
}

/* Where a chip actually sits, read from the DOM rather than recomputed, so the
   arrow always agrees with what is on screen even after a formation change. */
function chipPos(pid){
  if(!pid) return null;
  const c = document.querySelector('.chip[data-pid="' + CSS.escape(pid) + '"]');
  if(!c) return null;
  return {x: parseFloat(c.style.left), y: parseFloat(c.style.top), el: c};
}

function resolvePlayer(nameToken, idx){
  if(!nameToken) return null;
  const key = nameToken.toLowerCase().replace(/^([a-z])\.[a-z]\./, "$1.");
  const hit = idx[key] || idx[nameToken.toLowerCase()];
  return hit ? hit.pid : null;
}

function clearPlayArrow(){
  const layer = document.getElementById("playlayer");
  if(layer) layer.innerHTML = "";
  document.querySelectorAll(".chip.inplay, .chip.inplay2")
    .forEach(c => c.classList.remove("inplay", "inplay2"));
}

function drawPlay(play, idx){
  clearPlayArrow();
  const layer = document.getElementById("playlayer");
  if(!layer || !play) return;
  const parts = playParticipants(play.text);
  if(!parts) return;

  const fromPid = resolvePlayer(parts.from, idx);
  const toPid = resolvePlayer(parts.to, idx);
  const defPid = resolvePlayer(parts.defender, idx);

  const a = chipPos(fromPid), b = chipPos(toPid), d = chipPos(defPid);

  // Mark whoever is on screen, even when no line can be drawn.
  if(a) a.el.classList.add("inplay");
  if(b) b.el.classList.add("inplay");
  if(d) d.el.classList.add("inplay2");

  const colour = parts.turnover ? "var(--fall)"
               : parts.td ? "var(--brass)"
               : parts.incomplete ? "var(--mute)"
               : "var(--rise)";
  const dash = parts.incomplete ? 'stroke-dasharray="9 7"' : "";

  let x0, y0, x1, y1;
  if(a && b){
    // Both men on screen: the honest case, draw the actual connection.
    x0 = a.x; y0 = a.y; x1 = b.x; y1 = b.y;
  } else if(a && parts.kind === "run"){
    // A run has no target, so carry the ball upfield from the runner by the
    // distance he actually gained.
    const gain = Math.max(3, Math.min(22, parts.yards == null ? 5 : parts.yards));
    x0 = a.x; y0 = a.y;
    x1 = Math.max(6, Math.min(94, a.x + (parts.dir || 0) * 9));
    y1 = Math.max(4, a.y - gain);
  } else if(a && parts.kind === "sack"){
    x0 = a.x; y0 = a.y;
    x1 = a.x; y1 = Math.min(96, a.y + 8);      // driven backwards
  } else {
    return;                                     // not enough on screen to be honest
  }

  const mx = (x0 + x1) / 2 + (parts.kind === "pass" ? (x1 - x0) * 0.12 : 0);
  const my = (y0 + y1) / 2 - (parts.kind === "pass" ? 6 : 2);
  layer.innerHTML =
    '<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="5.6" refY="3.4"'
    + ' orient="auto"><path d="M0,0 L6.4,3.4 L0,6.8 z" fill="' + colour + '"/></marker>'
    + '<filter id="gl"><feDropShadow dx="0" dy="0" stdDeviation="4"'
    + ' flood-color="' + colour + '" flood-opacity=".55"/></filter></defs>'
    + '<path d="M ' + (x0*10).toFixed(1) + ' ' + (y0*7).toFixed(1)
    + ' Q ' + (mx*10).toFixed(1) + ' ' + (my*7).toFixed(1)
    + ' ' + (x1*10).toFixed(1) + ' ' + (y1*7).toFixed(1) + '"'
    + ' fill="none" stroke="' + colour + '" stroke-width="4" stroke-linecap="round"'
    + ' ' + dash + ' marker-end="url(#ah)" filter="url(#gl)" opacity=".95"/>';
}

/* ---------------- hold to swap ----------------
   Switching to a backup used to mean: tap the chip, scroll the panel, find the
   depth list, tap a name. Four steps to answer "who else plays here".

   Holding the chip puts that list under your thumb instead. Right-click does the
   same on a desktop.

   Pointer events rather than touch events, so one implementation covers a
   finger, a mouse and a stylus. The press is cancelled if the finger moves,
   otherwise every scroll that starts on a chip would open this. */
const HOLD_MS = 420;
const HOLD_SLOP = 10;          // px of movement that still counts as a hold
let holdTimer = null, holdFrom = null, holdFired = false;

function attachHold(chip, grp, slot, stack){
  if(stack.length < 2) return;          // nobody to switch to

  const start = e => {
    if(e.button != null && e.button !== 0 && e.pointerType === "mouse") return;
    holdFired = false;
    holdFrom = {x: e.clientX, y: e.clientY};
    chip.classList.add("holding");
    clearTimeout(holdTimer);
    holdTimer = setTimeout(()=>{
      holdFired = true;
      chip.classList.remove("holding");
      if(navigator.vibrate) navigator.vibrate(12);
      openSwap(chip, grp, slot, stack);
    }, HOLD_MS);
  };
  const cancel = () => {
    clearTimeout(holdTimer);
    chip.classList.remove("holding");
  };
  const move = e => {
    if(!holdFrom) return;
    if(Math.abs(e.clientX - holdFrom.x) > HOLD_SLOP
    || Math.abs(e.clientY - holdFrom.y) > HOLD_SLOP) cancel();
  };

  chip.addEventListener("pointerdown", start);
  chip.addEventListener("pointerup", cancel);
  chip.addEventListener("pointerleave", cancel);
  chip.addEventListener("pointercancel", cancel);
  chip.addEventListener("pointermove", move);
  // Stop the long press from also opening the profile underneath.
  chip.addEventListener("click", e => {
    if(holdFired){ e.preventDefault(); e.stopPropagation(); holdFired = false; }
  }, true);
  chip.addEventListener("contextmenu", e=>{
    e.preventDefault();
    openSwap(chip, grp, slot, stack);
  });
}

function closeSwap(){
  const p = document.getElementById("swap");
  if(p) p.remove();
  document.removeEventListener("pointerdown", swapAway, true);
}
function swapAway(e){
  const p = document.getElementById("swap");
  if(p && !p.contains(e.target)) closeSwap();
}

function openSwap(chip, grp, slot, stack){
  closeSwap();
  const shown = Math.min(sub[grp + "|" + slot] || 0, stack.length - 1);
  const pop = el("div", null);
  pop.id = "swap";
  pop.className = "swap";

  const head = el("div","swaphd");
  head.appendChild(el("span", null,
    (SLOTMETA[grp + "|" + slot] || {}).abb || "Depth"));
  head.appendChild(el("span","swapn", stack.length + " listed"));
  pop.appendChild(head);

  stack.forEach((r, i)=>{
    const p = DATA.players[r.pid];
    if(!p) return;
    const row = el("button","swaprow" + (i === shown ? " on" : ""));
    row.appendChild(el("span","swapi", String(i + 1)));
    const f = el("div","swapf");
    const im = faceImg(p, 96);
    if(im) f.appendChild(im);
    row.appendChild(f);
    const nm = el("div","swapnm");
    nm.appendChild(el("div","swapname", p.name));
    const bits = [];
    if(p.num != null) bits.push("#" + p.num);
    if(p.t100) bits.push("Top 100 #" + p.t100);
    if(p.inj && p.inj.sev >= 3) bits.push(p.inj.label);
    nm.appendChild(el("div","swapmeta", bits.join("  \u00b7  ") || p.pos));
    row.appendChild(nm);
    row.onclick = e => {
      e.stopPropagation();
      closeSwap();
      if(i === 0) delete sub[grp + "|" + slot];
      else sub[grp + "|" + slot] = i;
      sel = p.id;
      renderField();
      renderDetail(grp, slot, i);
      paintSel();
      syncHash();
    };
    pop.appendChild(row);
  });

  const note = el("div","swapnote","Tap a name to put him on the field");
  pop.appendChild(note);

  // Anchor to the chip, then pull back inside the field if it would overflow.
  const field = document.getElementById("field");
  field.appendChild(pop);
  const fr = field.getBoundingClientRect(), cr = chip.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = cr.left - fr.left + cr.width / 2 - w / 2;
  let top = cr.top - fr.top + cr.height + 6;
  if(top + h > fr.height) top = cr.top - fr.top - h - 6;   // flip above
  if(top < 4) top = 4;
  left = Math.max(4, Math.min(fr.width - w - 4, left));
  pop.style.left = left + "px";
  pop.style.top = top + "px";

  setTimeout(()=>document.addEventListener("pointerdown", swapAway, true), 0);
}

function runConcept(c){
  const field = document.getElementById("conceptfield");
  if(!field) return;
  clearTimeout(conceptTimer);
  field.innerHTML = "";

  // line of scrimmage
  const los = el("div","closs");
  los.style.top = LOS + "%";
  field.appendChild(los);

  c.actors.forEach(a=>{
    // A zone is the patch of grass a defender is responsible for, which is the
    // whole point of zone coverage and invisible without drawing it.
    if(a.zone){
      const [zx, zy, zr] = a.zone;
      const z = el("div","czone");
      z.style.left = zx + "%"; z.style.top = zy + "%";
      z.style.width = z.style.height = zr * 2 + "%";
      field.appendChild(z);
    }
    const d = el("div","cdot " + a.side + (a.hi ? " hi" : ""));
    d.style.left = a.x + "%";
    d.style.top = a.y + "%";
    d.appendChild(el("span", null, a.lab));
    field.appendChild(d);

    (a.path || []).forEach((pt, i)=>{
      setTimeout(()=>{
        d.style.transition = "left 620ms cubic-bezier(.35,.6,.35,1), "
          + "top 620ms cubic-bezier(.35,.6,.35,1)";
        d.style.left = pt[0] + "%";
        d.style.top = pt[1] + "%";
      }, (a.t || 0) + i * 620 + 260);
    });
  });

  if(c.ball){
    const b = el("div","cball");
    b.style.left = c.ball.from[0] + "%";
    b.style.top = c.ball.from[1] + "%";
    field.appendChild(b);
    setTimeout(()=>{
      b.style.transition = "left 560ms cubic-bezier(.2,.8,.4,1), "
        + "top 560ms cubic-bezier(.2,.8,.4,1)";
      b.style.left = c.ball.to[0] + "%";
      b.style.top = c.ball.to[1] + "%";
    }, c.ball.t);
  }

  if(!c.static) conceptTimer = setTimeout(() => runConcept(c), 4200);
}

/* ---------------- lineup game ----------------
   The depth chart in reverse: the formation is drawn empty with only position
   labels, and eleven real players sit in a tray with their positions hidden.
   Put each man where he belongs.

   Placing works by tap-select then tap-place, not HTML5 drag-and-drop. Drag
   events do not fire on touch screens at all, and this is most useful on a phone,
   so the tap flow is the real mechanism and dragging is layered on top for a
   mouse. */
const GAME = {team:null, unit:"off", slots:{}, tray:[], held:null, checked:false,
              right:0, best:{}};

function gameSlots(){
  const grp = GAME.unit === "off" ? "3WR 1TE" : activeDefGrp(GAME.team);
  const form = FORMS[grp];
  const by = {};
  (DATA.depth[GAME.team] || []).filter(r => r.grp === grp).forEach(r=>{
    if(!by[r.slot] || r.rank < by[r.slot].rank) by[r.slot] = r;
  });
  return Object.entries(form.coords)
    .filter(([slot]) => by[slot] && DATA.players[by[slot].pid])
    .map(([slot, xy]) => ({
      slot: +slot, x: xy[0], y: xy[1],
      abb: slotLabel(grp, +slot, by[slot].abb),
      pid: by[slot].pid,
    }));
}
/* Some slots are genuinely the same job and only differ by which side of the
   formation they sit on, or by depth order. Nobody can reasonably know which of
   three receivers is "WR2", so those are graded as interchangeable. Left tackle
   against right tackle is a real distinction and stays graded. */
const EQUIV = {
  "3WR 1TE": [[1, 2, 8], [4, 6]],                       // receivers, guards
  "Base 4-3 D": [[1, 4], [2, 3], [5, 7], [8, 11], [9, 10]],
  "Base 3-4 D": [[1, 3], [4, 7], [5, 6], [8, 11], [9, 10]],
};
function equivalentSlots(grp, slot){
  const sets = EQUIV[grp] || [];
  const found = sets.find(g => g.includes(slot));
  return found || [slot];
}

function activeDefGrp(tm){
  const rows = DATA.depth[tm] || [];
  return ["Base 4-3 D","Base 3-4 D"].find(g => rows.some(r => r.grp === g))
      || "Base 4-3 D";
}

function startGame(tm, unit){
  GAME.team = tm || team;
  GAME.unit = unit || GAME.unit;
  const slots = gameSlots();
  GAME.grp = GAME.unit === "off" ? "3WR 1TE" : activeDefGrp(GAME.team);
  GAME.answer = {};
  slots.forEach(s => { GAME.answer[s.slot] = s.pid; });
  // Which players would also be acceptable in each slot.
  GAME.accept = {};
  slots.forEach(s=>{
    GAME.accept[s.slot] = new Set(
      equivalentSlots(GAME.grp, s.slot)
        .map(x => GAME.answer[x]).filter(Boolean));
  });
  GAME.slots = {};
  GAME.tray = shuffle(slots.map(s => s.pid));
  GAME.held = null;
  GAME.checked = false;
  GAME.right = 0;
  renderGame(slots);
}

function renderGame(slots){
  slots = slots || gameSlots();
  const host = $("#gamebody");
  host.innerHTML = "";

  // header: which team, which unit, how it went
  const bar = el("div","gbar");
  const teamName = (DATA.teams[GAME.team] || {}).nick || GAME.team;
  bar.appendChild(el("span","gteam", teamName));
  const tabs = el("div","boxtabs");
  tabs.style.margin = "0";
  [["off","Offence"],["def","Defence"]].forEach(([k,lab])=>{
    const b = el("button", null, lab);
    b.setAttribute("aria-pressed", k === GAME.unit);
    b.onclick = () => startGame(GAME.team, k);
    tabs.appendChild(b);
  });
  bar.appendChild(tabs);
  const shuffleBtn = el("button","gsmall","Another team");
  shuffleBtn.onclick = () => {
    const all = Object.keys(DATA.teams);
    startGame(all[(Math.random() * all.length) | 0], GAME.unit);
  };
  bar.appendChild(shuffleBtn);
  host.appendChild(bar);

  // the field, with empty labelled slots
  const field = el("div","gfield");
  const turf = document.createElementNS("http://www.w3.org/2000/svg","svg");
  turf.setAttribute("viewBox","0 0 1000 700");
  turf.setAttribute("preserveAspectRatio","none");
  turf.classList.add("gturf");
  let marks = "";
  for(let i=1;i<10;i++){
    const y=i*70;
    marks += `<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="#DDE6E1"
      stroke-opacity="${i%2?0.1:0.16}" stroke-width="1.5"/>`;
  }
  turf.innerHTML = marks;
  field.appendChild(turf);

  slots.forEach(s=>{
    const spot = el("button","gslot");
    spot.style.left = s.x + "%";
    spot.style.top = s.y + "%";
    spot.dataset.slot = s.slot;
    const placed = GAME.slots[s.slot];
    if(placed){
      const p = DATA.players[placed];
      const disc = el("div","gdisc");
      const im = faceImg(p, 96, {lazy: true});
      if(im) disc.appendChild(im);
      else disc.appendChild(el("div","gfb", p.num == null ? "?" : String(p.num)));
      spot.appendChild(disc);
      spot.appendChild(el("div","gname2", shortName(p.name)));
      if(GAME.checked){
        const ok = (GAME.accept[s.slot] || new Set()).has(placed);
        spot.classList.add(ok ? "ok" : "bad");
        if(!ok){
          const real = DATA.players[GAME.answer[s.slot]];
          spot.appendChild(el("div","gtrue", real ? shortName(real.name) : ""));
        }
      }
    } else {
      spot.appendChild(el("div","gempty"));
    }
    spot.appendChild(el("div","glab", s.abb));
    spot.onclick = () => placeHere(s.slot);
    // Dragging is an enhancement for a mouse; the tap flow above is the real one.
    spot.ondragover = e => { e.preventDefault(); spot.classList.add("over"); };
    spot.ondragleave = () => spot.classList.remove("over");
    spot.ondrop = e => {
      e.preventDefault();
      spot.classList.remove("over");
      const pid = e.dataTransfer.getData("text/plain");
      if(pid){ GAME.held = pid; placeHere(s.slot); }
    };
    field.appendChild(spot);
  });
  host.appendChild(field);

  // the tray
  if(!GAME.checked){
    const tray = el("div","gtray");
    if(!GAME.tray.length){
      tray.appendChild(el("div","carnote","All placed. Check your answers."));
    }
    GAME.tray.forEach(pid=>{
      const p = DATA.players[pid];
      const c = el("button","gchip" + (GAME.held === pid ? " held" : ""));
      c.draggable = true;
      c.ondragstart = e => { GAME.held = pid; e.dataTransfer.setData("text/plain", pid); };
      const f = el("div","gcf");
      const im = faceImg(p, 96, {lazy: true});
      if(im) f.appendChild(im);
      else f.appendChild(el("div","gfb", p.num == null ? "?" : String(p.num)));
      c.appendChild(f);
      c.appendChild(el("div","gcn", shortName(p.name)));
      c.onclick = () => { GAME.held = (GAME.held === pid ? null : pid); renderGame(slots); };
      tray.appendChild(c);
    });
    host.appendChild(tray);
    host.appendChild(el("div","carnote", GAME.held
      ? "Now tap the position he plays."
      : "Tap a player, then tap where he lines up. Positions are labelled."));
  }

  // controls
  const foot = el("div","gfoot");
  if(GAME.checked){
    const total = Object.keys(GAME.answer).length;
    const pct = Math.round(GAME.right / total * 100);
    const sc = el("div","gscore");
    sc.appendChild(el("span","gbig", GAME.right + " of " + total));
    sc.appendChild(el("span","gsub", pct + "% right"));
    foot.appendChild(sc);
    const again = el("button","qnext","Play again");
    again.onclick = () => startGame(GAME.team, GAME.unit);
    foot.appendChild(again);
  } else {
    const check = el("button","qnext","Check answers");
    check.disabled = GAME.tray.length > 0;
    if(GAME.tray.length) check.style.opacity = ".45";
    check.onclick = checkGame;
    foot.appendChild(check);
  }
  host.appendChild(foot);
  host.scrollTop = 0;
}

function placeHere(slot){
  if(GAME.checked) return;
  const existing = GAME.slots[slot];
  if(!GAME.held){
    // Tapping a filled slot with nothing held takes that player back.
    if(existing){
      GAME.tray.push(existing);
      delete GAME.slots[slot];
      renderGame();
    }
    return;
  }
  if(existing) GAME.tray.push(existing);          // swap out whoever was there
  GAME.slots[slot] = GAME.held;
  GAME.tray = GAME.tray.filter(x => x !== GAME.held);
  GAME.held = null;
  renderGame();
}

function checkGame(){
  GAME.checked = true;
  GAME.right = Object.entries(GAME.slots)
    .filter(([slot, pid]) => (GAME.accept[slot] || new Set()).has(pid)).length;
  const total = Object.keys(GAME.answer).length;
  const key = GAME.team + "|" + GAME.unit;
  if(store.ok){
    PROG.lineup = PROG.lineup || {};
    const prev = PROG.lineup[key] || 0;
    if(GAME.right > prev){ PROG.lineup[key] = GAME.right; store.save(PROG); }
  }
  renderGame();
}

/* ---------------- defensive credit ----------------
   Who made the play. NFL play text follows firm conventions and puts the defence
   in parentheses, which is easy to miss when you are reading quickly and are
   still learning who these people are:

     ... for 4 yards (C.Gonzalez)              solo tackle
     ... for 3 yards (C.Gonzalez, Z.Baun)      assisted tackle
     sacked at PHI 30 for -7 yards (J.Carter)  sack
     pass incomplete deep left (Q.Mitchell)    pass broken up
     INTERCEPTED by D.Hand at NE 20            interception
     FUMBLES (M.Garrett), RECOVERED by NE-K.Byard

   Pulled out and labelled, the defensive half of the game becomes visible rather
   than parenthetical. */
const NAME_RE = /[A-Z][A-Za-z]?\.(?:[A-Z]\.)?[A-Z][A-Za-z'’-]+/g;

function defensiveCredit(text){
  if(!text) return null;
  const out = [];
  const seen = new Set();
  const push = (label, names, tone) => {
    const list = (names || []).filter(n => n && !seen.has(label + n));
    list.forEach(n => seen.add(label + n));
    if(list.length) out.push({label, names: list, tone});
  };
  const grab = re => {
    const m = text.match(re);
    if(!m) return null;
    return (m[1].match(NAME_RE) || []);
  };

  // Interception first: it is the headline whatever else happened.
  const pick = text.match(/INTERCEPTED by (?:[A-Z]{2,3}-)?([A-Z][A-Za-z]?\.[A-Z][A-Za-z'’-]+)/);
  if(pick) push("Interception", [pick[1]], "big");

  const rec = text.match(/RECOVERED by (?:[A-Z]{2,3}-)?([A-Z][A-Za-z]?\.[A-Z][A-Za-z'’-]+)/);
  if(rec) push("Recovered", [rec[1]], "big");

  const forced = grab(/FUMBLES\s*\(([^)]+)\)/);
  if(forced) push("Forced fumble", forced, "big");

  // A sack names its tacklers in the parentheses that follow it.
  if(/\bsacked\b/i.test(text)){
    const names = grab(/sacked[^()]*\(([^)]+)\)/i);
    if(names) push("Sack", names, "big");
  } else if(/pass incomplete/i.test(text)){
    const names = grab(/\(([^)]+)\)\s*\.?\s*$/);
    if(names) push("Broken up", names, "");
  } else {
    // Otherwise a trailing parenthetical is whoever made the tackle.
    const names = grab(/\(([^)]+)\)\s*\.?\s*$/);
    if(names) push(names.length > 1 ? "Tackle, assisted" : "Tackle", names, "");
  }
  return out.length ? out : null;
}

/* Live defensive leaders, read from the box score already being fetched. ESPN
   files these under a defensive category whose column labels vary, so the
   numbers are looked up by label rather than by position. */
function defensiveLeaders(teamsInGame, limit){
  const rows = [];
  (LIVE.box || []).forEach(side=>{
    if(teamsInGame && !teamsInGame.includes(side.team)) return;
    side.cats.forEach(cat=>{
      if(!/def|tackl/i.test(cat.name || "")) return;
      const iTot = cat.labels.findIndex(l => /^(TOT|TCKL|TACKLES)$/i.test(l));
      const iSack = cat.labels.findIndex(l => /^SACKS?$/i.test(l));
      const iInt = cat.labels.findIndex(l => /^INT$/i.test(l));
      const iTfl = cat.labels.findIndex(l => /^TFL$/i.test(l));
      cat.rows.forEach(r=>{
        const val = i => i >= 0 ? num(r.stats[i]) : null;
        const tot = val(iTot) || 0, sack = val(iSack) || 0;
        const ints = val(iInt) || 0, tfl = val(iTfl) || 0;
        if(!tot && !sack && !ints) return;
        rows.push({
          eid: r.eid, name: r.name, pos: r.pos, team: side.team,
          tot, sack, ints, tfl,
          // Sacks and takeaways outweigh raw tackle counts.
          score: tot + sack * 6 + ints * 8 + tfl * 2,
        });
      });
    });
  });
  rows.sort((a,b) => b.score - a.score);
  return rows.slice(0, limit || 6);
}

/* ---------------- watch mode ----------------
   Built to sit next to a television. Everything else in this app is for reading;
   this is for glancing at, so it is large, sparse, and refreshes itself. */

function openWatch(gameId){

  if(!watchGame) return;
  watchOn = true;
  $("#watch").hidden = false;
  document.body.classList.add("watching");
  refreshWatch();
  clearInterval(watchPoll);
  watchPoll = setInterval(refreshWatch, 20000);
}

  watchOn = false;
  clearInterval(watchPoll);

  if(!watchOn) return;

/* ---------------- weather ----------------
   Open-Meteo, free and keyless. Only asked for outdoor fixtures at a club's
   usual ground -- indoor games and the nine international fixtures carry no
   coordinates, so no request is made and none is implied.

   This is not decoration. Wind over about fifteen miles an hour or steady rain
   measurably suppresses scoring, and it is the biggest single influence on a
   game total. */
const WX = {};
const WX_CODE = {
  0:"Clear", 1:"Mostly clear", 2:"Partly cloudy", 3:"Overcast",
  45:"Fog", 48:"Freezing fog", 51:"Light drizzle", 53:"Drizzle",
  55:"Heavy drizzle", 61:"Light rain", 63:"Rain", 65:"Heavy rain",
  66:"Freezing rain", 67:"Freezing rain", 71:"Light snow", 73:"Snow",
  75:"Heavy snow", 77:"Snow grains", 80:"Showers", 81:"Showers",
  82:"Heavy showers", 85:"Snow showers", 86:"Snow showers",
  95:"Thunderstorms", 96:"Thunderstorms", 99:"Thunderstorms",
};

async function fetchWeather(g){
  if(!g || !g.ll || !g.d) return null;
  const key = g.a + "@" + g.h + "|" + g.d;
  if(WX[key] !== undefined) return WX[key];
  WX[key] = null;
  try {
    const [lat, lon] = g.ll;
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat
      + "&longitude=" + lon
      + "&hourly=temperature_2m,precipitation_probability,wind_speed_10m,weather_code"
      + "&temperature_unit=fahrenheit&wind_speed_unit=mph"
      + "&start_date=" + g.d + "&end_date=" + g.d + "&timezone=America%2FNew_York";
    const r = await fetch(url);
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    const hours = (j.hourly || {}).time || [];
    // Match the hour of kickoff; the schedule stores Eastern time and the
    // request asked for the same zone, so these line up directly.
    const want = (g.t || "13:00").slice(0, 2) + ":00";
    let i = hours.findIndex(t => t.endsWith(want));
    if(i < 0) i = Math.floor(hours.length / 2);
    const at = k => (j.hourly[k] || [])[i];
    WX[key] = {
      temp: Math.round(at("temperature_2m")),
      wind: Math.round(at("wind_speed_10m")),
      rain: at("precipitation_probability"),
      code: at("weather_code"),
      desc: WX_CODE[at("weather_code")] || "",
    };
  } catch(e){ WX[key] = null; }
  return WX[key];
}

function weatherNote(w){
  if(!w) return null;
  const rough = [];
  if(w.wind >= 15) rough.push("wind this strong tends to hold scoring down");
  if(w.rain >= 60) rough.push("rain favours the run");
  if(w.temp <= 25) rough.push("cold enough to matter");
  return rough.length ? rough.join(", ") : null;
}

/* ---------------- trending players ----------------
   Sleeper's public feed, no key. Counts how many fantasy managers added or
   dropped a player in the last day, across millions of leagues. That is a crowd
   noticing something, which is a different signal from anything computable here
   and a good breakout detector. */
const TREND = {add: null, drop: null, at: 0};

async function fetchTrending(kind){
  if(TREND[kind] && Date.now() - TREND.at < 9e5) return TREND[kind];
  try {
    const r = await fetch("https://api.sleeper.app/v1/players/nfl/trending/"
      + kind + "?lookback_hours=24&limit=40");
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    const bySid = {};
    Object.values(DATA.players).forEach(p => { if(p.sid) bySid[p.sid] = p; });
    TREND[kind] = rows
      .map(x => ({p: bySid[String(x.player_id)], n: x.count}))
      .filter(x => x.p);
    TREND.at = Date.now();
  } catch(e){ TREND[kind] = null; }
  return TREND[kind];
}

/* ---------------- line movement ----------------
   Multi-book history needs a paid key, but the useful part is the drift, and
   that can be had for nothing by remembering the first line we ever saw for a
   fixture. A line that has moved three points since Tuesday is saying something
   changed; the number on its own is not. */
function rememberLine(key, odds){
  if(!store.ok || !odds || odds.spread == null) return null;
  PROG.lines = PROG.lines || {};
  const seen = PROG.lines[key];
  if(!seen){
    PROG.lines[key] = {spread: odds.spread, total: odds.total,
                       at: Date.now(), line: odds.line};
    store.save(PROG);
    return null;
  }
  const dSpread = +(odds.spread - seen.spread).toFixed(1);
  const dTotal = odds.total != null && seen.total != null
    ? +(odds.total - seen.total).toFixed(1) : null;
  if(!dSpread && !dTotal) return null;
  return {dSpread, dTotal, from: seen.line, since: seen.at};
}

/* Inactives arrive about ninety minutes before kickoff and settle what a
   Wednesday "questionable" only hinted at. ESPN carries them on the summary
   payload, under a shape that varies, so read it defensively. */
async function fetchInactives(gameId){
  try {
    const j = await getJSON("/summary?event=" + gameId);
    const out = [];
    (j.injuries || []).forEach(team=>{
      const ab = normTeam(((team.team || {}).abbreviation) || "");
      (team.injuries || []).forEach(x=>{
        const status = ((x.status || "") + "").toLowerCase();
        if(!/out|inactive/.test(status)) return;
        const ath = x.athlete || {};
        out.push({
          eid: ath.id ? String(ath.id) : null,
          name: ath.displayName || ath.shortName || "",
          team: ab,
          detail: (x.details || {}).type || x.status || null,
        });
      });
    });
    return out;
  } catch(e){ return []; }
}

/* ---------------- scores page ----------------
   A route rather than a second file, so a name in a box score still opens that
   player's profile. Two sources, used for what each is good at:

     ESPN      live and finished games, fetched on demand for a given date
     the slate all 272 fixtures with kickoff times, already in the payload, so
               future weeks work with no network at all

   Anything in the past or happening now comes from ESPN; anything ahead comes
   from the schedule we shipped. */
let scoreWeek = null, scoreCache = {}, scoreLoading = false, scoreMode = "games";

function seasonWeekNow(){
  // Week 1 opens 9 Sep 2026; each week runs Wed to Tue.
  const start = Date.UTC(2026, 8, 9);
  const wk = Math.floor((Date.now() - start) / (7 * 864e5)) + 1;
  return Math.max(1, Math.min(18, wk));
}

function weekDates(wk){
  const slate = (DATA.slate || {})[wk] || [];
  return [...new Set(slate.map(g => g.d).filter(Boolean))].sort();
}

/* ESPN is asked per date. A week is at most four distinct dates, so this is a
   handful of requests, cached for the session. */
async function loadWeekScores(wk){
  const dates = weekDates(wk);
  if(!dates.length) return {};
  if(scoreCache[wk]) return scoreCache[wk];
  const out = {};
  for(const d of dates){
    const stamp = d.replace(/-/g, "");
    try {
      const j = await getJSON("/scoreboard?dates=" + stamp);
      (j.events || []).forEach(e=>{
        const c = (e.competitions || [])[0] || {};
        const st = (e.status || {}).type || {};
        const teams = (c.competitors || []).map(t=>({
          ab: normTeam((t.team || {}).abbreviation || ""),
          score: t.score, home: t.homeAway === "home",
        }));
        const a = teams.find(t=>!t.home), h = teams.find(t=>t.home);
        // The betting line rides along on the scoreboard response, so it costs
        // nothing extra. Shape varies by provider, so read it defensively.
        const o = (c.odds || [])[0] || null;
        const venue = ((c.venue || {}).fullName) || null;
        if(a && h) out[a.ab + "@" + h.ab] = {
          id: e.id, state: st.state, detail: st.shortDetail,
          a: a.score, h: h.score,
          odds: o ? {
            line: o.details || null,
            total: num(o.overUnder),
            spread: num(o.spread),
            book: ((o.provider || {}).name) || null,
          } : null,
          venue,
        };
      });
    } catch(err){ liveLog("scores for", d, "failed:", err.message); }
  }
  scoreCache[wk] = out;
  return out;
}

  const rows = {};
  let lastDay = null;
  slate.forEach(g=>{
    if(g.d !== lastDay){

    const row = el("button","gmrow");
    const side = (ab, home) => {
      const w = el("div","gside" + (home ? " home" : ""));
      const t = DATA.teams[ab] || {};

      if(t.logo){ lg.src = t.logo; lg.alt = ""; }
      w.appendChild(lg);
      w.appendChild(el("span","gname", t.nick || ab));
      w.appendChild(el("span","gscore", ""));
      return w;
    };
    const aEl = side(g.a, false), hEl = side(g.h, true);
    row.appendChild(aEl);
    row.appendChild(el("span","gat","at"));
    row.appendChild(hEl);
    const meta = el("span","gmeta", fmtKick(g));
    row.appendChild(meta);
    row.onclick = () => pickGame(key, g);
    wrap.appendChild(row);
    rows[key] = {row, aEl, hEl, meta};
  });

  const n = el("div","carnote");
  n.textContent = "Kickoff times are local to you. Tap a finished or live game "
    + "for the full box score.";
  wrap.appendChild(n);

  // Now go and see whether any of these have been played.
  const scores = await loadWeekScores(scoreWeek);
  for(const key in rows){
    const s = scores[key];
    if(!s) continue;
    const {row, aEl, hEl, meta} = rows[key];
    if(s.state === "pre") continue;
    row.classList.add(s.state === "in" ? "live" : "done");
    aEl.querySelector(".gscore").textContent = s.a ?? "";
    hEl.querySelector(".gscore").textContent = s.h ?? "";
    const aw = num(s.a), hw = num(s.h);
    if(aw != null && hw != null && s.state === "post"){
      (aw > hw ? aEl : hEl).classList.add("won");
    }
    meta.textContent = s.detail || "";
    if(s.state === "in") meta.classList.add("hot");
    rows[key].id = s.id;
  }
}

function fmtKick(g){
  if(!g.d || !g.t) return g.wd || "";
  // Schedule times are US Eastern; render in the reader's own zone.
  const [hh, mm] = g.t.split(":").map(Number);
  const d = new Date(g.d + "T00:00:00-04:00");
  d.setUTCHours(d.getUTCHours() + hh, d.getUTCMinutes() + mm);
  return d.toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
}

async function pickGame(key, g){
  const cached = scoreCache[scoreWeek] || {};
  const s = cached[key];
  if(!s || s.state === "pre"){
    // No score exists yet, so show what can be known beforehand instead.
    openPreview(key, g, s);
    return;
  }
  await fetchGame(s.id);
  LIVE.gameId = s.id;
  if(!LIVE.byTeam[g.h]){
    LIVE.games.push({id:s.id, state:s.state, detail:s.detail, situation:null,
      teams:[{ab:g.a, score:s.a, home:false},{ab:g.h, score:s.h, home:true}]});
    LIVE.byTeam[g.a] = LIVE.byTeam[g.h] = LIVE.games[LIVE.games.length-1];
  }
  boxTeam = null;
  openBox();
}

/* ---------------- game preview ----------------
   Shown for a fixture that has not kicked off. A score would be meaningless, so
   this answers the questions you can actually answer beforehand: how the two
   sides rate, who has the edge historically, what the market thinks, and which
   individual battles decide it.

   Matchups pair a player against the unit he will face, using the depth charts
   and last season's ranks that are already loaded. Nothing is predicted. */
let prevKey = null, prevGame = null;

// Which slot holds the man we care about, per formation.
const OFF_SLOT = {QB: 9, RB: 11, WR1: 1, LT: 3, TE: 10};
const DEF_SLOT = {CB1: 8, EDGE: 1, MLB: 6, S1: 9};

function starterAt(team, grps, slot){
  const rows = (DATA.depth[team] || [])
    .filter(r => grps.includes(r.grp) && r.slot === slot)
    .sort((a, b) => a.rank - b.rank);
  return rows.length ? DATA.players[rows[0].pid] : null;
}
const offStarter = (t, k) => starterAt(t, ["3WR 1TE"], OFF_SLOT[k]);
const defStarter = (t, k) => starterAt(t, ["Base 4-3 D", "Base 3-4 D"], DEF_SLOT[k]);

function statLine(p, labels){
  if(!p || !p.st) return null;
  for(const l of labels){
    const it = p.st.items.find(x => x.l === l);
    if(it) return {l: it.l, v: it.v, r: it.r, n: it.n};
  }
  return null;
}
function unitRank(team, which){
  const u = ((DATA.season[team] || {}).units || [])[which];
  return u ? u.rank : null;
}

function openPreview(key, g, score){
  prevKey = key; prevGame = g;

  renderPreview(score);
}
function closePreview(){ $("#prev").hidden = true; }

    + (standView === "conf" ? " The top seven seeds make the postseason." : "");

/* ---------------- learn mode ----------------
   Everything else in this app assumes you already know who these people are.
   This part assumes you do not. Recall beats recognition for learning names, so
   the quiz asks rather than shows, and anything missed comes back later in the
   same session rather than being marked wrong and forgotten. */

/* ---------------- saved learning progress ----------------
   Now that the app is served over https, browser storage is reliable, so what
   you know can survive closing the tab. That is the difference between a quiz
   and actual spaced repetition.

   A Leitner box per player: a right answer promotes it, a wrong one sends it
   back to box 0. Higher boxes come back after longer gaps. Nothing here is
   precious -- if storage is unavailable the app degrades to the old behaviour
   of starting fresh each time. */
const LS_KEY = "nfl-learn-v1";
const BOX_DAYS = [0, 1, 3, 7, 21];      // when a card in each box is due again
const DAY = 864e5;

const store = (() => {
  let ok = true;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  return {
    ok,
    load(){
      if(!ok) return {cards:{}, streak:{n:0, last:null}, sessions:0};
      try {
        return JSON.parse(localStorage.getItem(LS_KEY))
            || {cards:{}, streak:{n:0, last:null}, sessions:0};
      } catch(e){ return {cards:{}, streak:{n:0, last:null}, sessions:0}; }
    },
    save(v){ if(!ok) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(v)); }catch(e){} },
  };
})();

let PROG = store.load();

function cardOf(pid){
  return PROG.cards[pid] || {b:0, seen:0, right:0, last:0};
}
function recordAnswer(pid, correct){
  const c = cardOf(pid);
  c.seen++;
  if(correct){ c.right++; c.b = Math.min(c.b + 1, BOX_DAYS.length - 1); }
  else { c.right = c.right; c.b = 0; }
  c.last = Date.now();
  PROG.cards[pid] = c;
  store.save(PROG);
}
function isDue(pid){
  const c = PROG.cards[pid];
  if(!c) return true;                       // never seen
  return Date.now() - c.last >= BOX_DAYS[c.b] * DAY;
}
const isKnown = pid => (PROG.cards[pid]?.b || 0) >= 3;

function bumpStreak(){
  const today = new Date().toISOString().slice(0,10);
  const last = PROG.streak.last;
  if(last === today) return;
  const yday = new Date(Date.now() - DAY).toISOString().slice(0,10);
  PROG.streak.n = (last === yday) ? PROG.streak.n + 1 : 1;
  PROG.streak.last = today;
  PROG.sessions = (PROG.sessions || 0) + 1;
  store.save(PROG);
}

function progressFor(pool){
  const ids = pool.map(x => x.p.id);
  return {
    total: ids.length,
    known: ids.filter(isKnown).length,
    due: ids.filter(isDue).length,
    seen: ids.filter(id => PROG.cards[id]).length,
  };
}

/* Cards that are due come first, then anything never seen, then the rest.
   Within each band the order is random so the same ten never repeat. */
function pickQuestions(pool, n){
  const due = [], fresh = [], rest = [];
  pool.forEach(x=>{
    const c = PROG.cards[x.p.id];
    if(!c) fresh.push(x);
    else if(isDue(x.p.id)) due.push(x);
    else rest.push(x);
  });
  return [...shuffle(due), ...shuffle(fresh), ...shuffle(rest)].slice(0, n);
}

function resetProgress(){
  PROG = {cards:{}, streak:{n:0, last:null}, sessions:0};
  store.save(PROG);
}

const STARTERS = (() => {
  const best = {};
  Object.entries(DATA.depth).forEach(([tm, rows]) => rows.forEach(r => {
    const k = tm + "|" + r.grp + "|" + r.slot;
    if (!best[k] || r.rank < best[k].rank) best[k] = {...r, team: tm};
  }));
  return Object.values(best).filter(r => DATA.players[r.pid]);
})();

const QUIZ = {
  mode: "face", tier: "t100", n: 10,
  queue: [], i: 0, right: 0, missed: [], answered: false,
};

function quizPool(){
  if(QUIZ.tier === "t100"){
    return Object.values(DATA.players).filter(p => p.t100 && p.im)
      .map(p => ({p, team: (LOCATE[p.id]||{}).team,
                  pos: (LOCATE[p.id]||{}).abb || p.pos}));
  }
  const seen = new Set();
  return STARTERS.filter(r => {
    if(seen.has(r.pid)) return false;
    seen.add(r.pid); return true;
  }).map(r => ({p: DATA.players[r.pid], team: r.team, pos: r.abb, slot: r.slot, grp: r.grp}))
    .filter(x => x.p && (QUIZ.mode !== "face" || x.p.im));
}

const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0;
  [a[i],a[j]]=[a[j],a[i]]; } return a; };

function buildQuestion(item, pool){
  const {p, team, pos} = item;
  if(QUIZ.mode === "face"){
    const wrong = shuffle(pool.filter(x => x.p.id !== p.id
      && POSBUCKET[x.p.pos] === POSBUCKET[p.pos])).slice(0,3);
    const fill = wrong.length < 3
      ? shuffle(pool.filter(x => x.p.id !== p.id)).slice(0, 3 - wrong.length) : [];
    return {
      kind: "face", pid: p.id, img: imgUrl(p, 320),
      prompt: "Who is this?",
      answer: p.name,
      opts: shuffle([p, ...wrong.map(x=>x.p), ...fill.map(x=>x.p)].map(x=>x.name)),
      after: p.name + " \u00b7 " + pos + ", " + (DATA.teams[team]?.nick || team),
    };
  }
  if(QUIZ.mode === "team"){
    const wrong = shuffle(Object.keys(DATA.teams).filter(t => t !== team)).slice(0,3);
    return {
      kind: "team", pid: p.id, img: imgUrl(p, 320),
      prompt: "Who does he play for?", sub: p.name + "  \u00b7  " + pos,
      answer: DATA.teams[team].nick,
      opts: shuffle([team, ...wrong].map(t => DATA.teams[t].nick)),
      after: p.name + " starts at " + pos + " for the " + DATA.teams[team].nick,
    };
  }
  // starter: given a team and a position, who lines up there
  const wrong = shuffle(pool.filter(x => x.p.id !== p.id
    && POSBUCKET[x.p.pos] === POSBUCKET[p.pos])).slice(0,3);
  return {
    kind: "starter", pid: p.id, logo: DATA.teams[team]?.logo,
    prompt: "Who starts at " + pos + " for the " + (DATA.teams[team]?.nick || team) + "?",
    answer: p.name,
    opts: shuffle([p, ...wrong.map(x=>x.p)].map(x=>x.name)),
    after: p.name + " \u00b7 " + pos + ", " + (DATA.teams[team]?.nick || team),
  };
}

function startQuiz(){
  const pool = quizPool();
  if(pool.length < 6){ renderQuizSetup("Not enough players in that set."); return; }
  bumpStreak();
  QUIZ.queue = pickQuestions(pool, QUIZ.n).map(item => buildQuestion(item, pool));
  QUIZ.i = 0; QUIZ.right = 0; QUIZ.missed = []; QUIZ.answered = false;
  renderQuestion();
}

    const btn = el("button",null,lab);

  });
  g1.appendChild(p1); w.appendChild(g1);

  const g2 = el("div","qgroup");
  g2.appendChild(el("h4",null,"Who to include"));

  [["t100","The 97 best players"],["starters","All 883 starters"]].forEach(([k,lab])=>{

    btn.setAttribute("aria-pressed", QUIZ.tier===k);

  g3.appendChild(el("h4",null,"How many"));
  const p3 = el("div","qpick");

    const btn = el("button",null,String(n));
    btn.setAttribute("aria-pressed", QUIZ.n===n);
    btn.onclick = () => { QUIZ.n = n; renderQuizSetup(); };
    p3.appendChild(btn);
  });
  g3.appendChild(p3); w.appendChild(g3);

  if(note){
    const nn = el("div","carnote", note);
    nn.style.color = "#C98080";
    w.appendChild(nn);
  }

  const pool = quizPool();
  const pr = progressFor(pool);
  const stat = el("div");
  stat.style.cssText = "border:1px solid var(--line);border-radius:3px;padding:12px 14px";
  if(store.ok){
    const bar = el("div","qbar");
    bar.style.margin = "8px 0 6px";
    const fi = el("i");
    fi.style.width = (pr.total ? pr.known / pr.total * 100 : 0) + "%";
    bar.appendChild(fi);
    const top = el("div","qmeta");
    top.style.marginBottom = "0";
    const l = el("span");
    l.appendChild(el("b", null, pr.known + " of " + pr.total));
    l.appendChild(document.createTextNode(" learned"));
    top.appendChild(l);
    if(PROG.streak.n > 1){
      const r = el("span");
      r.appendChild(el("b", null, String(PROG.streak.n)));
      r.appendChild(document.createTextNode(" day streak"));
      top.appendChild(r);
    }
    stat.appendChild(top);
    stat.appendChild(bar);
    const sub = el("div","carnote");
    sub.style.margin = "0";
    sub.textContent = pr.due + " due for review \u00b7 "
      + (pr.total - pr.seen) + " never seen. A name counts as learned after three "
      + "correct answers in a row, and comes back for review after that.";
    stat.appendChild(sub);
  } else {
    stat.appendChild(el("div","carnote",
      "Progress cannot be saved here \u2014 this browser is blocking storage. "
      + "The quiz still works, it just starts fresh each time."));
  }
  w.appendChild(stat);

  const go = el("button","qnext","Start");
  go.onclick = startQuiz;
  w.appendChild(go);

  const tip = el("div","carnote");
  tip.textContent = QUIZ.tier === "t100"
    ? "Start here. Ninety-seven names covers most of what commentators talk about."
    : "Every first-string player in the league. Long, but this is the whole map.";

  b.appendChild(w);
}

function renderQuestion(){
  const q = QUIZ.queue[QUIZ.i];
  const b = $("#qbody"); b.innerHTML = "";
  QUIZ.answered = false;

  const meta = el("div","qmeta");
  const left = el("span");
  left.appendChild(el("b", null, String(QUIZ.i + 1)));
  left.appendChild(document.createTextNode(" of " + QUIZ.queue.length));
  meta.appendChild(left);
  const right = el("span");
  right.appendChild(el("b", null, String(QUIZ.right)));
  right.appendChild(document.createTextNode(" right"));
  meta.appendChild(right);
  b.appendChild(meta);

  const bar = el("div","qbar");
  const fill = el("i");
  fill.style.width = (QUIZ.i / QUIZ.queue.length * 100) + "%";
  bar.appendChild(fill); b.appendChild(bar);

  if(q.img && q.kind !== "starter"){
    const f = el("div","qface");
    const im = new Image();
    im.src = q.img; im.alt = ""; im.decoding = "async";
    f.appendChild(im); b.appendChild(f);
  } else if(q.logo){
    const im = new Image(); im.src = q.logo; im.alt = ""; im.className = "qlogo";
    b.appendChild(im);
  }

  const pr = el("div","qprompt");
  pr.appendChild(document.createTextNode(q.prompt));
  if(q.sub) pr.appendChild(el("b", null, q.sub));
  b.appendChild(pr);

  const opts = el("div","qopts");
  q.opts.forEach(text=>{
    const o = el("button","qopt", text);
    o.onclick = () => answer(o, text, q, opts);
    opts.appendChild(o);
  });
  b.appendChild(opts);
}

function answer(btn, text, q, opts){
  if(QUIZ.answered) return;
  QUIZ.answered = true;
  const correct = text === q.answer;
  [...opts.children].forEach(c=>{
    c.disabled = true;
    if(c.textContent === q.answer) c.classList.add("right");
    else if(c === btn) c.classList.add("wrong");
  });
  recordAnswer(q.pid, correct);
  if(correct) QUIZ.right++;
  else {
    QUIZ.missed.push(q);
    // Ask it again later in the same session -- that is the whole point.
    if(QUIZ.queue.length < QUIZ.n + 6) QUIZ.queue.push(q);
  }

  const b = $("#qbody");
  const after = el("div","carnote", q.after);
  after.style.textAlign = "center";
  b.appendChild(after);

  const nx = el("button","qnext",
    QUIZ.i + 1 < QUIZ.queue.length ? "Next" : "See how you did");
  nx.onclick = () => {
    QUIZ.i++;
    if(QUIZ.i < QUIZ.queue.length) renderQuestion(); else renderQuizDone();
  };
  b.appendChild(nx);
}

function renderQuizDone(){
  const b = $("#qbody"); b.innerHTML = "";
  const total = QUIZ.queue.length;
  const pct = Math.round(QUIZ.right / total * 100);
  const w = el("div","qdone");
  w.appendChild(el("div","big", pct + "%"));
  w.appendChild(el("div","sub", QUIZ.right + " of " + total + " right"));

  if(QUIZ.missed.length){
    const m = el("div","qmiss");
    m.appendChild(el("h4", null, "Worth another look"));
    const seen = new Set();
    QUIZ.missed.forEach(q=>{
      if(seen.has(q.pid)) return;
      seen.add(q.pid);
      const p = DATA.players[q.pid];
      const row = el("div","qmissrow");
      const f = el("div","mf");
      const im = faceImg(p, 96, {lazy: true});
      if(im) f.appendChild(im);
      row.appendChild(f);
      row.appendChild(el("span", null, p.name));
      const loc = LOCATE[p.id];
      row.appendChild(el("span","mt", (loc ? loc.team + " \u00b7 " : "") + p.pos));
      m.appendChild(row);
    });
    w.appendChild(m);
  }

  const again = el("button","qnext","Go again");
  again.onclick = startQuiz;
  w.appendChild(again);
  if(store.ok){
    const wipe = el("button", null, "Reset saved progress");
    wipe.style.cssText = "margin-top:14px;font-family:'Barlow Condensed',sans-serif;"
      + "font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)";
    wipe.onclick = () => {
      if(confirm("Clear everything you have learned so far?")){ resetProgress(); renderQuizSetup(); }
    };
    w.appendChild(wipe);
  }

  const back = el("button","qnext","Change what to practise");
  back.style.cssText = "background:none;border:1px solid var(--line);color:var(--mute);margin-top:8px";
  back.onclick = () => renderQuizSetup();
  w.appendChild(back);
  b.appendChild(w);
}

/* ---------------- league leaders ----------------
   Every number in the payload already carries its rank and the size of the pool
   it was ranked against, so this needs no new data -- it inverts what is already
   there. Ranks are scoped to a position group, which is the honest way to do it:
   a leaderboard of "sacks" that mixed edge rushers with cornerbacks would be
   noise. That is why the categories are grouped by position rather than flat. */

const BUCKET_LABEL = {QB:"Quarterbacks", RB:"Running backs", WR:"Receivers",
                      TE:"Tight ends", DL:"Defensive line", LB:"Linebackers",
                      DB:"Defensive backs", K:"Kickers"};
const BUCKET_ORDER = ["QB","RB","WR","TE","DL","LB","DB","K"];
const SRC_LABEL = {st:"", adv:"charting", sit:"situational"};

let LEAD = null, leadKey = null;

function buildLeaders(){
  if(LEAD) return LEAD;
  const cats = {};
  const add = (group, key, label, sub, pid, v, r, n, unit) => {
    const k = group + "|" + key;
    (cats[k] ||= {group, label, sub, unit, rows: []})
      .rows.push({pid, v, r, n});
  };

  Object.values(DATA.players).forEach(p=>{
    const b = POSBUCKET[p.pos];
    if(!b) return;
    const g = BUCKET_LABEL[b];
    if(!g) return;
    if(p.st) p.st.items.forEach(it=>{
      if(it.r) add(g, "st:"+b+":"+it.l, it.l, "", p.id, it.v, it.r, it.n);
    });
    if(p.adv) p.adv.items.forEach(it=>{
      if(it.r) add(g, "adv:"+b+":"+it.l, it.l, SRC_LABEL.adv, p.id, it.v, it.r, it.n);
    });
    if(p.sit) p.sit.forEach(it=>{
      if(it.r) add(g, "sit:"+b+":"+it.l, it.l, SRC_LABEL.sit, p.id, it.v, it.r, it.rn, it.u);
    });
    if(p.ct && p.ct.r)
      add("Money", "pay:"+b, BUCKET_LABEL[b], "average per year", p.id,
          p.ct.apy, p.ct.r, p.ct.n, "M");
  });

  // Drop anything too thin to be a leaderboard.
  Object.keys(cats).forEach(k=>{
    if(cats[k].rows.length < 10) delete cats[k];
    else cats[k].rows.sort((a,b)=>a.r-b.r);
  });

  // Teams are ranked too, just held elsewhere in the payload.
  const teamCat = (key, label, sub, fn, unit, asc) => {
    const rows = [];
    Object.keys(DATA.teams).forEach(ab=>{
      const v = fn(ab);
      if(v == null) return;
      rows.push({team: ab, v});
    });
    if(rows.length < 10) return;
    rows.sort((a,b)=> asc ? a.v-b.v : b.v-a.v);
    rows.forEach((r,i)=>{ r.r = i+1; r.n = rows.length; });
    cats["Teams|"+key] = {group:"Teams", label, sub, unit, rows, isTeam:true};
  };
  const S = ab => DATA.season[ab] || {};
  const R = ab => (DATA.roster||{})[ab] || {};
  teamCat("off","Points per game","2025 offence",
          ab=>{const u=(S(ab).units||[])[0]; return u&&u.stats[0]?u.stats[0].v:null;});
  teamCat("def","Points allowed per game","2025 defence",
          ab=>{const u=(S(ab).units||[])[1]; return u&&u.stats[0]?u.stats[0].v:null;},"",true);
  teamCat("wins","Wins","2025 season", ab=>S(ab).w);
  teamCat("ten","Ten-year win rate","2016\u20132025",
          ab=>(DATA.history||{})[ab]?.pct, "%");
  teamCat("cap","Money committed","average per year",
          ab=>R(ab).cap?R(ab).cap.total:null, "M");
  teamCat("age","Oldest roster","average years",
          ab=>R(ab).age?R(ab).age.avg:null);
  teamCat("home","Homegrown share","drafted by this club",
          ab=>(DATA.draft||{})[ab]?.own_pct, "%");

  LEAD = cats;
  return cats;
}

/* Historical boards live under the same category keys as the live ones, so a
   category shows a year strip when a matching history exists. Movement is the
   change in rank against the previous season, which is not the same as a change
   in the number: a player can gain yards and still fall. */
let leadYear = "now";

function pastKeyFor(catKey){
  // live keys look like "Receivers|st:WR:Rec yds"; history keys like "WR|Rec yds"
  const m = /^[^|]+\|st:([A-Z]+):(.+)$/.exec(catKey);
  if(!m) return null;
  const k = m[1] + "|" + m[2];
  return (DATA.leadersPast && DATA.leadersPast[k]) ? k : null;
}

function renderYearStrip(box, catKey){
  const pk = pastKeyFor(catKey);
  if(!pk){ leadYear = "now"; return null; }
  const years = Object.keys(DATA.leadersPast[pk]).sort();
  const strip = el("div","lyears");
  const mk = (val, label) => {
    const b = el("button", null, label);
    b.setAttribute("aria-pressed", leadYear === val);
    b.onclick = () => { leadYear = val; renderLeaders(); };
    strip.appendChild(b);
  };
  years.forEach(y => mk(y, y));
  mk("now", "This roster");
  box.appendChild(strip);
  return pk;
}

function movementCell(r){
  if(r.new) return {cls:"new", txt:"first time"};
  if(r.unranked) return {cls:"new", txt:"unranked"};
  const d = r.d || 0;
  if(d === 0) return {cls:"", txt:"\u2013"};
  return d > 0 ? {cls:"up", txt:"\u25B2 " + d} : {cls:"dn", txt:"\u25BC " + Math.abs(d)};
}

function renderLeaders(){
  const cats = buildLeaders();
  const keys = Object.keys(cats);
  const groups = [];
  BUCKET_ORDER.forEach(b=>{ if(BUCKET_LABEL[b]) groups.push(BUCKET_LABEL[b]); });
  groups.push("Money", "Teams");

  if(!leadKey || !cats[leadKey]) leadKey = keys[0];

  const cl = $("#lcats"); cl.innerHTML = "";
  groups.forEach(g=>{
    const mine = keys.filter(k=>cats[k].group === g);
    if(!mine.length) return;
    cl.appendChild(el("div","lgrp", g));
    mine.forEach(k=>{
      const b = el("button","lcat", cats[k].label
        + (cats[k].sub && cats[k].sub !== "average per year" ? "  \u00b7 "+cats[k].sub : ""));
      b.setAttribute("aria-pressed", k === leadKey);
      b.onclick = () => { leadKey = k; if(!pastKeyFor(k)) leadYear = "now"; renderLeaders(); };
      cl.appendChild(b);
    });
  });

  const c = cats[leadKey];
  const box = $("#lrows"); box.innerHTML = "";
  box.appendChild(el("div","ltitle", c.label));
  const pk = renderYearStrip(box, leadKey);

  // A past season: names come from that year's file, not the current roster,
  // so retired players still appear where they belong.
  if(pk && leadYear !== "now"){
    const rows = DATA.leadersPast[pk][leadYear] || [];
    box.appendChild(el("div","lsub",
      c.group + " \u00b7 " + leadYear + " season \u00b7 move from " + (leadYear - 1)));
    rows.forEach(r=>{
      const row = el("button","lrow" + (r.r <= 3 ? " top" : ""));
      row.appendChild(el("span","lr", r.r));
      const p = DATA.players[r.id];
      const f = el("div","lf");
      const im = p ? faceImg(p, 96, {lazy: true}) : null;
      if(im) f.appendChild(im);
      row.appendChild(f);
      row.appendChild(el("span","ln", r.n));
      row.appendChild(el("span","lt", r.t || ""));
      const mv = movementCell(r);
      row.appendChild(el("span","lmv " + mv.cls, mv.txt));
      row.appendChild(el("span","lv", r.v.toLocaleString()));
      if(p) row.onclick = () => { $("#lead").hidden = true; goPlayer(r.id); };
      else row.disabled = true;     // no longer on any depth chart
      box.appendChild(row);
    });
    const n = el("div","carnote");
    n.textContent = "Whoever actually led that season, including players since "
      + "retired \u2014 greyed names are no longer on a depth chart. Movement is "
      + "the change in rank, so a player can gain yards and still fall.";
    box.appendChild(n);
    box.scrollTop = 0;
    return;
  }

  box.appendChild(el("div","lsub",
    c.group + (c.sub ? " \u00b7 " + c.sub : "") + " \u00b7 " + c.rows.length + " ranked"));

  c.rows.slice(0, 40).forEach(r=>{
    const row = el("button","lrow" + (r.r <= 3 ? " top" : ""));
    row.appendChild(el("span","lr", r.r));
    if(c.isTeam){
      const t = DATA.teams[r.team];
      const f = el("div","lf");
      if(t.logo){ const im = new Image(); im.src = t.logo; im.alt=""; f.appendChild(im); }
      row.appendChild(f);
      row.appendChild(el("span","ln", t.name));
      row.appendChild(el("span","lt", t.div));
      row.onclick = () => { $("#lead").hidden = true; goTeam(r.team); };
    } else {
      const p = DATA.players[r.pid];
      const f = el("div","lf");
      const im = faceImg(p, 96, {lazy: true});
      if(im) f.appendChild(im);
      row.appendChild(f);
      row.appendChild(el("span","ln", p.name));
      const loc = LOCATE[p.id];
      row.appendChild(el("span","lt", (loc ? loc.team : "") + " \u00b7 " + p.pos));
      row.onclick = () => { $("#lead").hidden = true; goPlayer(p.id); };
    }
    const unit = c.unit === "M" ? "" : (c.unit || "");
    const val = (c.unit === "M" ? "$" : "") + (typeof r.v === "number"
      ? r.v.toLocaleString() : r.v) + (c.unit === "M" ? "M" : unit);
    row.appendChild(el("span","lv", val));
    box.appendChild(row);
  });
  box.scrollTop = 0;
}
