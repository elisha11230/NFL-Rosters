name: Rebuild depth charts

# Tuesday mornings: the NFL week has settled by then, injury reports are out and
# depth charts have absorbed the weekend. Also runnable by hand from the Actions
# tab, which is what you want after changing anything in pipeline/.
on:
  schedule:
    - cron: "0 11 * * 2"
  # Any change to the pipeline rebuilds the site straight away. This is what
  # makes a code change a one-file push: drop the new app_template.html in,
  # push it, and index.html regenerates itself a few minutes later.
  push:
    paths:
      - "pipeline/**"
      # Watch this file too. Without it, fixing a broken workflow does not
      # trigger a rebuild -- the previous run failed, the fix does not match
      # "pipeline/**", and the site silently stays on the old build until
      # somebody presses Run workflow by hand.
      - ".github/workflows/rebuild.yml"
      # A hand-pushed index.html -- stale, or stitched together by a merge --
      # triggers a rebuild that replaces it. The robot's own commits do not
      # trigger anything (GitHub never starts a run from its own token), so this
      # cannot loop.
      - "index.html"
  workflow_dispatch:

# Needed so the job can commit the rebuilt page back to the repository.
permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install --quiet pandas pyarrow Pillow

      # Conflict markers in a source file would be baked into the page. Stop here
      # and name the file instead. index.html is not checked: it is about to be
      # rebuilt from scratch, which is how a broken one gets repaired.
      - name: Refuse sources with merge conflict markers
        run: |
          bad=$(grep -rlE --exclude-dir=.srccache --exclude-dir=node_modules '^(<{7}|>{7}) |^={7}$' pipeline .github || true)
          if [ -n "$bad" ]; then
            echo "Merge conflict markers found in:"
            echo "$bad"
            echo "Resolve these files (keep one version) and push again."
            exit 1
          fi

      # The last good set of downloaded sources, carried between runs. If a source
      # fails to download even after five minutes of retries, fetch_sources.sh
      # uses this copy (with a warning on the run) instead of failing the build.
      - name: Restore the last good sources
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.srccache
          key: nfl-sources-${{ github.run_id }}
          restore-keys: nfl-sources-

      - name: Download data sources
        working-directory: pipeline
        run: |
          chmod +x fetch_sources.sh
          ./fetch_sources.sh

      # A build is only worth publishing if the inputs are sound. This catches
      # the two failure modes that have actually happened: a source that quietly
      # went stale, and a 404 page saved to disk as if it were data.
      - name: Verify every source
        working-directory: pipeline
        run: python3 verify_sources.py

      - name: Build the data payload
        working-directory: pipeline
        run: python3 build_data.py

      - name: Check the field layout still fits
        working-directory: pipeline
        run: python3 check_layout.py

      - name: Assemble the page
        working-directory: pipeline
        run: |
          python3 make_icon.py
          python3 build_app.py
          cp index.html ../index.html

      # A syntax check is not enough. A build once passed one while a whole
      # module had been deleted by an overlapping edit: the remaining handlers
      # referenced functions that no longer existed, the script threw on load,
      # and the page rendered nothing at all. This loads the script in a stub DOM
      # and fails the build if it throws.
      - name: Load the page in a stub browser
        working-directory: pipeline
        run: node smoke_test.js index.html

      # The stub test cannot tell a missing element from a present one, so it
      # once passed a page that rendered nothing. jsdom is a real DOM: this loads
      # the page, runs it, and fails if it throws or draws no players.
      - name: Load the page in a real DOM
        working-directory: pipeline
        run: |
          npm install --no-save --silent jsdom@24
          node dom_test.js index.html

      # The DOM tests build the page but ignore screen-size rules, which is how
      # tablet rules once overrode the phone rules and kept the field 700px wide
      # on phones. This runs the real CSS cascade at a phone width and a desktop
      # width and fails if the wrong rule wins.
      - name: Check which styles win on phone and desktop
        working-directory: pipeline
        run: |
          pip install -q tinycss2 cssselect2 html5lib
          node render_dom.js index.html 390 /tmp/page390.html
          node render_dom.js index.html 1280 /tmp/page1280.html
          python3 check_css.py /tmp/page390.html /tmp/page1280.html

      - name: Confirm the page is valid before publishing
        run: |
          python3 - <<'PY'
          import json, sys
          h = open("index.html").read()
          i = h.index("const DATA = ") + 13
          j = h.index(";\n\n/* ----------------", i)
          d = json.loads(h[i:j])            # raises if the payload is malformed
          n = len(d["players"])
          assert len(d["teams"]) == 32, f"expected 32 teams, got {len(d['teams'])}"
          # Roster size swings hugely across a year: about 2,900 in camp, then
          # roughly 1,900 once clubs cut to 53 plus a practice squad. A floor set
          # for camp fails every build from September onward, so this is a range
          # wide enough for both, and the message says what it actually saw.
          assert 1200 <= n <= 4000, f"player count looks wrong: {n}"
          print(f"ok: {n} players, chart dated {d['snapshot'][:10]}")
          PY

      # Only after a build that passed every check, so a bad set of files is never
      # kept as the fallback.
      - name: Keep these sources for next time
        if: success()
        uses: actions/cache/save@v4
        with:
          path: pipeline/.srccache
          key: nfl-sources-${{ github.run_id }}

      - name: Commit if anything changed
        run: |
          # Pull first: a push-triggered run can start from a commit that is
          # already one behind if two changes land close together.
          git pull --rebase --autostash || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Madden publishes current ratings and no history, so the build records
          # what it saw. Without committing this, week-on-week movement would
          # never have a previous week to compare against.
          git add -f pipeline/madden_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no change this week"
          else
            git commit -m "Rebuild: depth charts as of $(date -u +%Y-%m-%d)"
            git push
          fi
